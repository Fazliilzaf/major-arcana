name: arcana-ci

# push är begränsad till main med avsikt.
#
# `push: ["**"]` TILLSAMMANS MED `pull_request` kör samma commit två gånger så
# snart grenen har en öppen PR — två identiska uppsättningar av smoke och
# cmo-mutation på samma SHA. Mätt på 60 körningar: 36 push + 23 pull_request,
# varav 24 SHA:n kördes mer än en gång. Snitt 6,6 jobbminuter ⇒ ~158 minuter
# var samma commit testad två gånger, ungefär 40 % av förbrukningen.
#
# Öppna PR:er tappar ingen täckning: `pull_request` triggar på `synchronize`,
# alltså vid varje ny push till grenen. Det som försvinner är bara dubbletten.
# Grenar UTAN öppen PR får ingen körning — öppna PR:en (gärna som draft) så
# testas den, vilket också är där granskaren ser resultatet.
#
# concurrency avbryter överspelade PR-körningar. Villkoret gör att körningar på
# main ALDRIG avbryts, så huvudlinjens gröna historik förblir hel.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARCANA_AI_PROVIDER: fallback
      ARCANA_DEFAULT_TENANT: hair-tp-clinic
      ARCANA_OWNER_EMAIL: owner@hairtpclinic.se
      ARCANA_OWNER_PASSWORD: ArcanaPilot!2026
      PORT: 3000
      PUBLIC_BASE_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Syntax check
        run: npm run check:syntax

      - name: Require path guard
        run: npm run check:requires

      - name: No-bypass lint
        run: npm run lint:no-bypass

      - name: Unit tests
        # Hela sviten går på ~45s lokalt; per-test-timeouten (--test-timeout i
        # test:unit) failar ett hängande test på 60s. Den här helsvit-guarden är
        # bälte-och-hängslen: fångar hängningar UTANFÖR ett test() (hooks, öppna
        # handtag) och failar steget tydligt (non-zero exit) i stället för att tyst
        # äta jobbets 15-min-budget och maska riktiga fel.
        run: timeout --preserve-status 600 npm test

      - name: Smoke (local)
        run: npm run smoke:local

      - name: Ops strict suite (local runtime)
        run: |
          npm start > /tmp/arcana-server.log 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" >/dev/null 2>&1 || true
            wait "$SERVER_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for i in $(seq 1 80); do
            if curl -sf http://localhost:3000/readyz | grep -q '"ready":true'; then
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:3000/healthz >/dev/null
          curl -sf http://localhost:3000/readyz | grep -q '"ready":true'
          npm run owner:mfa:setup -- --force-mfa-challenge --quiet-secrets --retry-attempts 3 --retry-delay-ms 1500
          npm run ops:suite:strict

      - name: Finalization sweep guard (local runtime)
        env:
          ARCANA_FINALIZATION_SWEEP_OUT_FILE: ./data/reports/finalization-sweep-latest.json
          ARCANA_FINALIZATION_SWEEP_BOOTSTRAP_MODE: if_missing
          ARCANA_EXPECTED_EXTERNAL_FAIL_STEPS: bootstrap_release_cycle,check_pentest_evidence,report_release_readiness,report_stability_window,release_go_live_gate,release_final_live_signoff
        run: |
          npm run finalization:sweep:local:bootstrap
          npm run finalization:sweep:guard

      - name: Closure status report (local runtime)
        run: npm run report:closure-status

      - name: Closure status guard (known external blockers only)
        env:
          ARCANA_EXPECTED_CLOSURE_REMAINING: external_pentest_evidence,stability_window_14_30d,formal_live_signoff
        run: npm run closure:guard

      - name: Upload closure status artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: closure-status-ci-${{ github.run_id }}
          path: |
            ./data/reports/closure-status-latest.json
            ./data/reports/closure-status-latest.md
          if-no-files-found: warn
          retention-days: 14

  cmo-mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARCANA_AI_PROVIDER: fallback
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: CMO mutation fast gate
        run: npm run test:cmo:mutation
