name: cmo-mutation-nightly

on:
  schedule:
    # 03:00 UTC — full sharded Stryker off the push path
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cmo-mutation-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [gate, store, agent]
    env:
      ARCANA_AI_PROVIDER: fallback
      STRYKER_CI: "1"
      STRYKER_CONCURRENCY: "4"
      CMO_MUTATION_SHARD: ${{ matrix.shard }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Restore Stryker incremental cache (gate)
        if: matrix.shard == 'gate'
        uses: actions/cache@v4
        with:
          path: reports/stryker/cmo-incremental-gate.json
          key: cmo-mutation-inc-gate-${{ hashFiles('src/ops/cmoOrchestrationGate.js', 'src/ops/cmoComplianceGate.js', 'src/ops/cmoMarketingMetrics.js', 'tests/_cmoMutationRunner.js') }}
          restore-keys: |
            cmo-mutation-inc-gate-

      - name: Restore Stryker incremental cache (store)
        if: matrix.shard == 'store'
        uses: actions/cache@v4
        with:
          path: reports/stryker/cmo-incremental-store.json
          key: cmo-mutation-inc-store-${{ hashFiles('src/ops/cmoPublishPolicy.js', 'src/ops/cmoPublishConnectors.js', 'src/ops/marketingCampaignDraftsStore.js', 'src/ops/marketingContentAssetsStore.js', 'tests/_cmoMutationRunner.js') }}
          restore-keys: |
            cmo-mutation-inc-store-

      - name: Restore Stryker incremental cache (agent)
        if: matrix.shard == 'agent'
        uses: actions/cache@v4
        with:
          path: reports/stryker/cmo-incremental-agent.json
          key: cmo-mutation-inc-agent-${{ hashFiles('src/agents/cmoContentAgent.js', 'src/agents/cmoCopilotComposeHelpers.js', 'src/capabilities/generateContentSeries.js', 'tests/_cmoMutationRunner.js') }}
          restore-keys: |
            cmo-mutation-inc-agent-

      - name: CMO mutation shard (Stryker)
        run: npm run test:mutation:cmo:shard -- ${{ matrix.shard }}

      - name: Upload shard mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmo-mutation-report-${{ matrix.shard }}-${{ github.run_id }}
          path: reports/stryker/cmo-mutation-${{ matrix.shard }}.html
          if-no-files-found: warn
          retention-days: 14

  cmo-mutation-summary:
    runs-on: ubuntu-latest
    needs: cmo-mutation-shard
    if: always()
    steps:
      - name: Require all shards green
        run: |
          if [ "${{ needs.cmo-mutation-shard.result }}" != "success" ]; then
            echo "One or more CMO mutation shards failed."
            exit 1
          fi
          echo "All CMO mutation shards passed."
