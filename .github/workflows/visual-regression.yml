name: visual-regression

on:
  pull_request:
    paths:
      - "public/major-arcana-preview/cco-*-v3*.html"
      - "public/major-arcana-preview/app/cco-conversations-v2-shell.js"
      - "public/major-arcana-preview/app/cco-conversations-v2.css"
      - "tests/e2e/cco-v2-virtualization*"
      - "scripts/serve-v2-virtualization-harness.js"
      - "scripts/visual-regression.mjs"
      - ".github/workflows/visual-regression.yml"
  push:
    branches:
      - "claude/**"
  workflow_dispatch:

jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (with full history for worktree)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Install chromium
        run: npx playwright install --with-deps chromium

      - name: Run visual diff (branch vs main)
        id: diff
        run: npm run visual:vs-main
        continue-on-error: true

      - name: Upload diff images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-diffs
          path: test/visual/diffs/*.png
          if-no-files-found: ignore
          retention-days: 30

      - name: Fail if drift detected
        if: steps.diff.outcome == 'failure'
        run: |
          echo "Visuell drift detekterad — se artifact 'visual-regression-diffs'"
          exit 1

  v2-virtualization:
    name: V2-inkorg virtualisering (mobil + iPad)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Install chromium
        run: npx playwright install --with-deps chromium

      # Riktig browser: bevisar att bara ett litet fönster ligger i DOM och att
      # scrollen (sidans på mobil, listans på iPad/desktop) når sista tråden.
      - name: Kör virtualiserings-browsertest
        run: npm run test:e2e:v2-virtualization
