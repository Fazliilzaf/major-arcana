name: cco-full-enrichment-backfill

on:
  workflow_dispatch:
    inputs:
      wait_minutes:
        description: "Max wait time for backfill completion"
        required: false
        default: "90"
        type: string
      batch_limit:
        description: "Bounded published batch size (0 runs legacy full backfill)"
        required: false
        default: "0"
        type: string
      mailbox:
        description: "Mailbox for bounded batch"
        required: false
        default: "kons@hairtpclinic.com"
        type: string

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BASE_URL: https://arcana.hairtpclinic.com
      ARCANA_DEFAULT_TENANT: hair-tp-clinic
      ARCANA_OWNER_EMAIL: ${{ secrets.ARCANA_OWNER_EMAIL }}
      ARCANA_OWNER_PASSWORD: ${{ secrets.ARCANA_OWNER_PASSWORD }}
      ARCANA_OWNER_MFA_SECRET: ${{ secrets.ARCANA_OWNER_MFA_SECRET }}
      ARCANA_OWNER_MFA_RECOVERY_CODE: ${{ secrets.ARCANA_OWNER_MFA_RECOVERY_CODE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Run full CCO enrichment backfill
        if: ${{ inputs.batch_limit == '0' }}
        run: |
          chmod +x scripts/extract-owner-token.sh
          export ARCANA_AUTH_TOKEN="$(bash scripts/extract-owner-token.sh)"
          node scripts/run-cco-full-enrichment-backfill.js \
            --trigger \
            --wait \
            --wait-minutes="${{ inputs.wait_minutes }}"

      - name: Run bounded published CCO enrichment batch
        if: ${{ inputs.batch_limit != '0' }}
        run: |
          chmod +x scripts/extract-owner-token.sh
          export ARCANA_AUTH_TOKEN="$(bash scripts/extract-owner-token.sh)"
          node scripts/run-cco-full-enrichment-backfill.js \
            --base-url="https://arcana.hairtpclinic.com" \
            --bounded-limit "${{ inputs.batch_limit }}" \
            --mailbox "${{ inputs.mailbox }}" \
            --wait-minutes "${{ inputs.wait_minutes }}" \
            --poll-seconds 10
