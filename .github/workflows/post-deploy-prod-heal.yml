name: arcana-post-deploy-heal

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      restore_env_from_blueprint:
        description: "FARLIGT — merge PUT env från render.yaml (endast manuell heal)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

jobs:
  prod-heal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.repository == 'Fazliilzaf/major-arcana'
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: srv-d8b3i3tckfvc73clgeng
      RENDER_BLUEPRINT_ID: exs-d6vdjapaae7s7386fum0
      RENDER_EXPECTED_SERVICE_NAME: arcana
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      RENDER_BLUEPRINT_AUTOSYNC_REQUIRED: "false"
      ARCANA_PROD_URL: https://arcana.hairtpclinic.com
      TARGET_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Trigger Render prod deploy
        if: env.RENDER_API_KEY != '' || env.RENDER_DEPLOY_HOOK_URL != ''
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: node ./scripts/trigger-render-prod-deploy.js

      - name: Verify blueprint targets prod service
        if: env.RENDER_API_KEY != ''
        run: bash ./scripts/verify-render-blueprint-link.sh

      - name: Wait for Render blueprint sync
        if: env.RENDER_API_KEY != '' && env.RENDER_BLUEPRINT_AUTOSYNC_REQUIRED != 'false'
        run: bash ./scripts/wait-for-render-blueprint-sync.sh
        # Deploy-drift: script avslutar 0 vid sync-lag; heal fortsätter (env-restore + readyz).

      - name: Skip Render blueprint sync wait (manual deploy trigger)
        if: env.RENDER_API_KEY != '' && env.RENDER_BLUEPRINT_AUTOSYNC_REQUIRED == 'false'
        run: |
          echo "::notice::Blueprint autoSync är av med flit; deploy verifieras via commit-match och readyz."

      - name: Wait for prod deploy (commit match)
        run: |
          target_short="${TARGET_SHA:0:7}"
          echo "Väntar på prod commit ${target_short}..."
          for i in $(seq 1 36); do
            body="$(curl -fsS "${ARCANA_PROD_URL}/api/v1/_diag/version" 2>/dev/null || true)"
            prod_short="$(printf '%s' "$body" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).commit.slice(0,7))}catch{}});" 2>/dev/null || true)"
            echo "  försök $i: prod=${prod_short:-?} mål=${target_short}"
            if [[ "$prod_short" == "$target_short" ]]; then
              echo "Deploy matchar push-commit."
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Prod nådde inte ${target_short} inom timeout — fortsätter ändå med heal"

      - name: Restore Render env from blueprint
        if: >-
          env.RENDER_API_KEY != '' &&
          github.event_name == 'workflow_dispatch' &&
          inputs.restore_env_from_blueprint == 'true'
        env:
          RENDER_ENV_RESTORE_RESTART: "false"
        run: bash ./scripts/restore-render-env-from-blueprint.sh

      - name: Skip env restore (disabled on push)
        if: >-
          env.RENDER_API_KEY != '' &&
          !(github.event_name == 'workflow_dispatch' && inputs.restore_env_from_blueprint == 'true')
        run: |
          echo "Env restore hoppas över (säkerhetslås)."
          echo "Aktivera endast via workflow_dispatch + restore_env_from_blueprint=true."

      - name: Skip env restore (no RENDER_API_KEY)
        if: env.RENDER_API_KEY == ''
        run: |
          echo "::warning::RENDER_API_KEY saknas i GitHub secrets — env restore hoppas över."

      - name: Wait for prod readyz after heal
        run: |
          for i in $(seq 1 36); do
            if curl -fsS "${ARCANA_PROD_URL}/readyz" 2>/dev/null | grep -q '"ready":true'; then
              echo "readyz OK efter ${i} försök"
              exit 0
            fi
            echo "väntar på readyz... ($i/36)"
            sleep 10
          done
          echo "::error::Prod readyz timeout efter env-restore"
          exit 1

      - name: Verify Render env count
        if: env.RENDER_API_KEY != ''
        run: node ./scripts/verify-render-env-count.js

      - name: Install Playwright browsers for prod field prep
        if: env.RENDER_API_KEY != ''
        run: npx playwright install --with-deps chromium webkit

      - name: Verify U2.4 field prep (prod)
        if: env.RENDER_API_KEY != ''
        # U2.4 uses staff/owner test credentials for physical field-prep.
        # Keep failures visible, but do not block deploy heal when credentials drift.
        continue-on-error: true
        env:
          ARCANA_STAFF_EMAIL: ${{ secrets.ARCANA_STAFF_EMAIL }}
          ARCANA_STAFF_PASSWORD: ${{ secrets.ARCANA_STAFF_PASSWORD }}
          ARCANA_OWNER_EMAIL: ${{ secrets.ARCANA_OWNER_EMAIL }}
          ARCANA_OWNER_PASSWORD: ${{ secrets.ARCANA_OWNER_PASSWORD }}
          ARCANA_OWNER_MFA_SECRET: ${{ secrets.ARCANA_OWNER_MFA_SECRET }}
        run: |
          if [[ -z "${ARCANA_STAFF_EMAIL:-}" || -z "${ARCANA_STAFF_PASSWORD:-}" ]]; then
            echo "::warning::ARCANA_STAFF_* secrets saknas — hoppar verify:u2-4-field-prep-prod"
            exit 0
          fi
          npm run verify:u2-4-field-prep-prod

      - name: Verify prod version
        run: curl -fsS "${ARCANA_PROD_URL}/api/v1/_diag/version"

      - name: Verify pilot journeys (public API)
        continue-on-error: true
        run: |
          if [[ ! -f ./data/pilot-patients.json ]]; then
            echo "::warning::data/pilot-patients.json saknas (gitignored) — hoppar pilot-verify"
            exit 0
          fi
          bash ./scripts/verify-all-pilot-journey-prod.sh
