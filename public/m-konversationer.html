<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
    <title>CCO · Konversationer</title>
    <style>
      :root {
        --cco-bg-page: #faf6f2;
        --cco-color-brand: #2b251f;
        --cco-text-secondary: rgba(70, 60, 50, 0.62);
        --cco-text-tertiary: #8a8174;
        --cco-status-success: #4a8268;
        --cco-status-warning: #c8821e;
        --cco-status-info: #4a7ba8;
        --cco-status-danger: #b94a4a;
        --accent-studio: #bb4779;
        --calendar-accent: #c8821e;
        --calendar-accent-glow: rgba(200, 130, 30, 0.22);
        --rose-pill-top: rgba(252, 233, 240, 0.98);
        --rose-pill-bottom: rgba(241, 207, 220, 0.95);
        --rail-fazli: #7c3aed;
        --rail-egzona: #a37433;
        --rail-contact: #2596a8;
        --rail-info: #84756b;
        --panel-shell-top: rgba(250, 246, 242, 0.94);
        --panel-shell-bottom: rgba(244, 238, 233, 0.86);
        --panel-card-top: rgba(255, 255, 255, 0.94);
        --panel-card-bottom: rgba(247, 241, 236, 0.86);
        --panel-card-shadow:
          0 3px 10px rgba(56, 40, 28, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.86);
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        background:
          radial-gradient(ellipse at 12% 0%, rgba(255, 225, 200, 0.42), transparent 38%),
          var(--cco-bg-page);
        color: var(--cco-color-brand);
        font-family: -apple-system, Inter, system-ui, sans-serif;
        font-size: 14px;
        line-height: 1.4;
        min-height: 100vh;
      }
      .phone-frame {
        width: 390px;
        margin: 24px auto;
        border-radius: 48px;
        background: #0a0907;
        padding: 12px;
        box-shadow: 0 40px 80px rgba(0, 0, 0, 0.18);
        position: relative;
      }
      .phone-screen {
        border-radius: 38px;
        overflow: hidden;
        background: var(--cco-bg-page);
        height: 844px;
        overflow-y: auto;
        position: relative;
        scrollbar-width: none;
      }
      .phone-screen::-webkit-scrollbar {
        display: none;
      }
      .phone-frame::before {
        content: '';
        position: absolute;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        width: 120px;
        height: 30px;
        background: #000;
        border-radius: 999px;
        z-index: 100;
      }
      @media (max-width: 460px) {
        .phone-frame {
          width: 100%;
          margin: 0;
          border-radius: 0;
          padding: 0;
          background: transparent;
          box-shadow: none;
        }
        .phone-screen {
          height: 100vh;
          border-radius: 0;
        }
        .phone-frame::before {
          display: none;
        }
      }

      .app-shell {
        padding-top: calc(env(safe-area-inset-top, 0) + 38px);
        padding-bottom: 88px;
      }
      .top-bar {
        position: sticky;
        top: 0;
        z-index: 50;
        padding: 8px 14px;
        background: linear-gradient(180deg, rgba(250, 246, 242, 0.96), rgba(250, 246, 242, 0.78));
        backdrop-filter: blur(18px);
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .brand-pill {
        font-size: 14px;
        font-weight: 800;
        padding: 6px 10px;
        border-radius: 999px;
        background: linear-gradient(180deg, var(--rose-pill-top), var(--rose-pill-bottom));
        color: var(--accent-studio);
        letter-spacing: 0.08em;
        flex-shrink: 0;
      }
      .search {
        flex: 1;
        height: 36px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.7);
        padding: 0 12px;
        font-size: 13.5px;
        color: var(--cco-color-brand);
        outline: none;
      }
      .top-btn {
        width: 36px;
        height: 36px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.7);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--cco-color-brand);
        font-size: 14px;
      }

      .head {
        padding: 14px 14px 4px;
      }
      .head-kicker {
        color: #84756b;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 4px;
      }
      .head-kicker .m {
        width: 18px;
        height: 18px;
        border-radius: 6px;
        background: rgba(108, 156, 139, 0.16);
        color: #6c9c8b;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .head-kicker .m svg {
        width: 11px;
        height: 11px;
      }
      .head h1 {
        font-size: 24px;
        margin: 0;
        font-weight: 800;
        letter-spacing: -0.03em;
      }
      .head p {
        margin: 2px 0 0;
        font-size: 13px;
        color: var(--cco-text-tertiary);
      }

      .tabs {
        margin: 14px 14px 6px;
        display: flex;
        gap: 3px;
        padding: 3px;
        background: rgba(255, 255, 255, 0.55);
        border-radius: 12px;
      }
      .tab {
        flex: 1;
        appearance: none;
        border: 0;
        cursor: pointer;
        min-height: 32px;
        padding: 0 8px;
        border-radius: 10px;
        background: transparent;
        font-size: 11.5px;
        font-weight: 700;
        color: var(--cco-text-secondary);
      }
      .tab.active {
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(244, 238, 232, 0.9));
        color: var(--cco-color-brand);
        box-shadow: 0 2px 6px rgba(56, 40, 28, 0.07);
      }
      .tab .c {
        display: inline-block;
        margin-left: 3px;
        font-size: 9px;
        font-weight: 800;
        opacity: 0.7;
      }

      .list {
        padding: 6px 14px 14px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .thread {
        position: relative;
        display: flex;
        gap: 11px;
        padding: 12px 14px;
        border-radius: 16px;
        background: linear-gradient(180deg, var(--panel-card-top), var(--panel-card-bottom));
        border: 1px solid rgba(255, 255, 255, 0.55);
        box-shadow: var(--panel-card-shadow);
        cursor: pointer;
      }
      .thread::before {
        content: '';
        position: absolute;
        left: 4px;
        top: 14px;
        bottom: 14px;
        width: 3px;
        border-radius: 2px;
        background: var(--rail, var(--rail-info));
      }
      .thread[data-source='contact'] {
        --rail: var(--rail-contact);
      }
      .thread[data-source='info'] {
        --rail: var(--rail-info);
      }
      .thread[data-source='fazli'] {
        --rail: var(--rail-fazli);
      }
      .thread[data-source='egzona'] {
        --rail: var(--rail-egzona);
      }
      .av {
        width: 42px;
        height: 42px;
        border-radius: 999px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-weight: 800;
        font-size: 13px;
        flex-shrink: 0;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.4),
          0 4px 10px rgba(56, 40, 28, 0.16);
      }
      .body {
        flex: 1;
        min-width: 0;
      }
      .from {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }
      .from .n {
        font-size: 13.5px;
        font-weight: 800;
        color: var(--cco-color-brand);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .from .w {
        font-size: 10px;
        color: var(--cco-text-tertiary);
        font-weight: 600;
        flex-shrink: 0;
        margin-left: 6px;
      }
      .subj {
        font-size: 12px;
        color: var(--cco-color-brand);
        font-weight: 600;
        margin-top: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .prv {
        font-size: 11.5px;
        color: var(--cco-text-secondary);
        margin-top: 2px;
        line-height: 1.4;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .tags {
        display: flex;
        gap: 4px;
        margin-top: 7px;
        flex-wrap: wrap;
      }
      .tg {
        padding: 1px 7px;
        border-radius: 999px;
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 0.04em;
      }
      .tg.u {
        background: rgba(185, 74, 74, 0.14);
        color: var(--cco-status-danger);
      }
      .tg.v {
        background: linear-gradient(180deg, var(--rose-pill-top), var(--rose-pill-bottom));
        color: var(--accent-studio);
      }
      .tg.b {
        background: rgba(74, 123, 168, 0.14);
        color: var(--cco-status-info);
      }
      .tg.a {
        background: rgba(200, 130, 30, 0.14);
        color: var(--calendar-accent);
      }
      .unread::after {
        content: '';
        position: absolute;
        right: 14px;
        top: 50%;
        transform: translateY(-50%);
        width: 9px;
        height: 9px;
        border-radius: 999px;
        background: var(--accent-studio);
        box-shadow: 0 0 8px var(--accent-studio);
      }

      .bottom-nav {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 60;
        padding: 8px 12px calc(env(safe-area-inset-bottom, 16px) + 8px);
        background: linear-gradient(180deg, rgba(250, 246, 242, 0), rgba(250, 246, 242, 0.92) 30%);
        backdrop-filter: blur(20px);
        display: flex;
        align-items: center;
        justify-content: space-around;
        gap: 4px;
      }
      .nav-item {
        flex: 1;
        background: transparent;
        border: 0;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        padding: 8px 6px;
        color: var(--cco-text-tertiary);
        font-size: 9.5px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .nav-item svg {
        width: 22px;
        height: 22px;
      }
      .nav-item.is-active {
        color: var(--accent-studio);
      }
      .nav-fab {
        width: 56px;
        height: 56px;
        border-radius: 999px;
        background: linear-gradient(180deg, #fff5e6, var(--calendar-accent));
        border: 0;
        cursor: pointer;
        margin: -22px 4px 0;
        box-shadow:
          0 8px 22px var(--calendar-accent-glow),
          0 0 0 4px rgba(250, 246, 242, 0.92);
        color: #fff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .nav-fab svg {
        width: 24px;
        height: 24px;
      }
    </style>
    <link rel="stylesheet" href="/cco-polish.css" />
    <script src="/cco-polish.js" defer></script>
  </head>
  <body data-stage="live">
    <div class="phone-frame">
      <div class="phone-screen">
        <div class="app-shell">
          <div class="top-bar">
            <span class="brand-pill">CCO</span>
            <input class="search" type="search" placeholder="Sök tråd…" />
            <button class="top-btn">⋮</button>
          </div>

          <div class="head">
            <div class="head-kicker">
              <span class="m"
                ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
                  <path
                    d="M4 4h16v16H4z M4 4l8 8 8-8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  /></svg
              ></span>
              Konversationer
            </div>
            <h1>12 olästa</h1>
            <p>· 47 totalt · 8 bokningar väntar</p>
          </div>

          <div class="tabs">
            <button class="tab active">Alla<span class="c">47</span></button>
            <button class="tab">Olästa<span class="c">12</span></button>
            <button class="tab">Bokning<span class="c">8</span></button>
            <button class="tab">VIP<span class="c">3</span></button>
          </div>

          <div class="list" id="list"></div>
        </div>
      </div>
    </div>

    <div class="bottom-nav">
      <button class="nav-item">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="3" y="5" width="18" height="16" rx="3" />
          <path d="M3 9h18M8 3v4M16 3v4" />
        </svg>
        Kalender
      </button>
      <button class="nav-item is-active">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M4 4h16v16H4z M4 4l8 8 8-8" />
        </svg>
        Inkorg
      </button>
      <button class="nav-fab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
          <path
            d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z M19 10v2a7 7 0 0 1-14 0v-2 M12 19v4 M8 23h8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
      <button class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="8" r="4" />
          <path d="M20 21a8 8 0 0 0-16 0" />
        </svg>
        Kunder
      </button>
      <button class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="12" x2="21" y2="12" />
          <line x1="3" y1="6" x2="21" y2="6" />
          <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
        Mer
      </button>
    </div>

    <script>
      const T = [
        {
          from: 'Anna Karlsson',
          i: 'AK',
          bg: 'linear-gradient(180deg,#d8c1f0,#b48ad6)',
          subj: 'PRP-bekräftelse · imorgon 08:00',
          prv: 'Ser fram emot imorgon. En sak — jag glömde fråga om jag ska ta något särskilt med mig?',
          w: '08:42',
          s: 'contact',
          u: 1,
          tg: [
            ['u', 'OLÄST'],
            ['v', 'VIP'],
            ['b', 'Imorgon'],
          ],
        },
        {
          from: 'Karl Lindberg',
          i: 'KL',
          bg: 'linear-gradient(180deg,#c5d8a8,#92b86e)',
          subj: 'Re: DHI ögonbryn — frågor',
          prv: 'Tack för svar! En sista fråga om eftervård och hur länge jag behöver vänta...',
          w: '07:55',
          s: 'info',
          u: 1,
          tg: [['b', 'Imorgon']],
        },
        {
          from: 'Eva Karlsson',
          i: 'EK',
          bg: 'linear-gradient(180deg,#f4d4f0,#d48ac8)',
          subj: 'Avbokning konsultation',
          prv: 'Jag måste tyvärr avboka idag pga arbete...',
          w: 'igår',
          s: 'egzona',
          tg: [['u', 'AVBOK']],
        },
        {
          from: 'Sofie Andersson',
          i: 'SA',
          bg: 'linear-gradient(180deg,#ffe3b8,#e8a04e)',
          subj: 'Vill boka konsultation',
          prv: 'Hej! Jag har länge funderat på er klinik och...',
          w: 'igår',
          s: 'contact',
          u: 1,
          tg: [['a', '★ AI svar redo']],
        },
        {
          from: 'Marcus Berg',
          i: 'MB',
          bg: 'linear-gradient(180deg,#b8d4e8,#7aa8d4)',
          subj: 'PRP återbesök bokning',
          prv: 'Hej, dags att boka 4:e PRP. Förslag tisdag?',
          w: 'igår',
          s: 'info',
        },
        {
          from: 'Eva Johansson',
          i: 'EJ',
          bg: 'linear-gradient(180deg,#ffd4b5,#f0a070)',
          subj: 'Microneedling — priser?',
          prv: 'Hej, undrar vad microneedling kostar och hur långt resultatet...',
          w: '23 maj',
          s: 'egzona',
          u: 1,
        },
        {
          from: 'Anna Larsson',
          i: 'AL',
          bg: 'linear-gradient(180deg,#e8d4ff,#b894e8)',
          subj: 'Tack för senast',
          prv: 'Bara att tacka för bra besök igår!',
          w: '22 maj',
          s: 'fazli',
          tg: [['v', 'VIP']],
        },
        {
          from: 'Erik Nordström',
          i: 'EN',
          bg: 'linear-gradient(180deg,#f4e8c8,#d4b870)',
          subj: 'PRP 5/6 boka',
          prv: 'Dags för nästa! Är 14:00 tis ledigt?',
          w: '22 maj',
          s: 'contact',
          u: 1,
        },
      ];
      document.getElementById('list').innerHTML = T.map(
        (t) => `
  <div class="thread ${t.u ? 'unread' : ''}" data-source="${t.s}">
    <div class="av" style="background:${t.bg}">${t.i}</div>
    <div class="body">
      <div class="from"><span class="n">${t.from}</span><span class="w">${t.w}</span></div>
      <div class="subj">${t.subj}</div>
      <div class="prv">${t.prv}</div>
      ${t.tg ? `<div class="tags">${t.tg.map(([k, l]) => `<span class="tg ${k}">${l}</span>`).join('')}</div>` : ''}
    </div>
  </div>
`
      ).join('');
    </script>
  </body>
</html>
