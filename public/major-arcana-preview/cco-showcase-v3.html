<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>CCO Showcase — v3 responsiv</title>
    <meta name="visual-regression" content="intentional-change" />
    <style>
      /* ===== CCO AUX SHARED FOUNDATION — paste inside each prototype's <style> at the top =====
   WCAG-härdad varm palett (all text ≥4.5:1). rem/clamp + CSS Grid/flex. Touch ≥44px.
   Samma tokens/primitiver i alla aux-ytor → de hör ihop med varandra och resten av appen. */
      :root {
        --bg-page: #faf6f2;
        --bg-surface: #ffffff;
        --bg-sunken: #f5efe6;
        --bg-rail: #fffdfb;
        --text-primary: #1d1e24;
        --text-secondary: #5d6470;
        --text-tertiary: #6a717d;
        --accent: #a8386a;
        --accent-weak: #f7e6ee;
        --accent-weak-bg: #f7e6ee;
        --accent-strong: #9c2c62;
        --text-on-accent: #ffffff;
        --success: #4a8268;
        --success-bg: rgba(74, 130, 104, 0.14);
        --warning: #c8821e;
        --warning-bg: rgba(200, 130, 30, 0.14);
        --danger: #b94a4a;
        --danger-bg: rgba(185, 74, 74, 0.14);
        --info: #4a7ba8;
        --info-bg: rgba(74, 123, 168, 0.14);
        --violet: #6b31c9;
        --violet-bg: rgba(107, 49, 201, 0.12);
        --gold: #9c6210;
        --gold-bg: rgba(200, 130, 30, 0.14);
        --slate: #556074;
        --slate-bg: rgba(85, 96, 116, 0.12);
        --sh-sm: 0 1px 2px rgba(56, 40, 28, 0.06);
        --sh-md: 0 3px 10px rgba(56, 40, 28, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.86);
        --sh-lg: 0 8px 22px rgba(56, 40, 28, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.92);
        --sh-xl: 0 24px 56px rgba(93, 74, 60, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.55);
        --r-sm: 10px;
        --r-md: 14px;
        --r-lg: 18px;
        --r-xl: 24px;
        --r-pill: 999px;
        --fs-kicker: 0.6875rem;
        --fs-meta: 0.75rem;
        --fs-body: 0.875rem;
        --fs-card-title: clamp(0.9rem, 0.85rem+0.4vw, 1.05rem);
        --fs-h1: clamp(1.5rem, 1.2rem+2vw, 2.25rem);
        --fs-num: clamp(1.35rem, 1.1rem+1.4vw, 1.9rem);
        --tap: 2.75rem;
        --gap: clamp(0.85rem, 0.6rem+0.9vw, 1.4rem);
        --pad-x: clamp(0.875rem, 0.5rem+1.6vw, 1.5rem);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --maxw: 1500px;
        --error-text: #962b2b;
        --error-border: #d8526b;
        --error-bg: #fdecec;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html {
        font-size: 100%;
        overflow-x: clip;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        max-width: 100%;
      }
      body {
        background:
          radial-gradient(ellipse at 12% 0%, rgba(255, 225, 200, 0.4), transparent 38%),
          radial-gradient(ellipse at 88% 4%, rgba(255, 214, 228, 0.12), transparent 42%),
          var(--bg-page);
        color: var(--text-primary);
        font-family:
          Inter,
          -apple-system,
          system-ui,
          sans-serif;
        font-size: var(--fs-body);
        line-height: 1.45;
        min-height: 100vh;
        overflow-x: hidden;
      }
      button {
        font-family: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        border-radius: 6px;
      }
      .tabnum {
        font-variant-numeric: tabular-nums;
      }

      /* page wrapper — centrerad, max-bredd, plats för botnav på mobil */
      .aux {
        max-width: var(--maxw);
        margin-inline: auto;
        padding: 0 var(--pad-x) 6rem;
        min-height: 100vh;
      }
      @media (min-width: 1025px) {
        .aux {
          padding-bottom: 2rem;
        }
      }

      /* topbar (samma som Konversationer/Senare) */
      .topbar {
        position: sticky;
        top: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        gap: var(--gap);
        padding: 0.5rem var(--pad-x);
        padding-top: calc(0.5rem + env(safe-area-inset-top, 0px));
        margin: 0 calc(-1 * var(--pad-x));
        background: linear-gradient(
          180deg,
          rgba(250, 246, 242, 0.97),
          rgba(250, 246, 242, 0.82) 80%,
          transparent
        );
        backdrop-filter: blur(18px);
      }
      .brand {
        flex-shrink: 0;
        font-weight: 800;
        letter-spacing: 0.08em;
        padding: 0.4rem 0.7rem;
        border-radius: var(--r-pill);
        background: linear-gradient(180deg, #fdeef4, #f6cfdc);
        color: var(--accent);
      }
      .search {
        flex: 1;
        min-width: 0;
        position: relative;
        display: flex;
        align-items: center;
        height: var(--tap);
        border-radius: var(--r-md);
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid rgba(180, 165, 150, 0.35);
        box-shadow: var(--sh-sm);
        padding: 0 0.75rem 0 2.1rem;
      }
      .search svg {
        position: absolute;
        left: 0.7rem;
        width: 1rem;
        height: 1rem;
        color: var(--text-tertiary);
      }
      .search input {
        appearance: none;
        border: 0;
        background: transparent;
        width: 100%;
        height: 100%;
        font: inherit;
        font-size: var(--fs-meta);
        color: var(--text-primary);
        outline: none;
      }
      .icon-btn {
        flex-shrink: 0;
        width: var(--tap);
        height: var(--tap);
        border-radius: var(--r-md);
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid rgba(180, 165, 150, 0.35);
        box-shadow: var(--sh-sm);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--text-primary);
        cursor: pointer;
      }

      .icon-btn svg {
        width: 1.1rem;
        height: 1.1rem;
      }

      /* sidoräls-primitiver (v11 facit) */
      .rail-brand {
        font-weight: 800;
        letter-spacing: 0.08em;
        color: var(--accent);
        padding: 0.4rem 0.6rem;
      }
      .rail-nav {
        min-height: var(--tap);
        display: flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0 0.7rem;
        border-radius: var(--r-md);
        cursor: pointer;
        color: var(--text-secondary);
        font-weight: 700;
        font-size: var(--fs-meta);
        border: 0;
        background: transparent;
        text-align: left;
      }
      .rail-nav.is-active {
        background: var(--accent-weak-bg);
        color: var(--accent);
      }
      .rail-nav svg {
        width: 1.1rem;
        height: 1.1rem;
      }
      .rail-sec {
        font-size: var(--fs-kicker);
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--text-tertiary);
        margin: 1rem 0.7rem 0.3rem;
      }

      /* head-zon */
      .head {
        padding: 1.3rem 0 0.85rem;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: var(--gap);
        flex-wrap: wrap;
      }
      .head-main {
        min-width: 0;
      }
      .kicker {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        color: var(--text-tertiary);
        font-size: var(--fs-kicker);
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        margin-bottom: 0.25rem;
      }
      .h1 {
        margin: 0;
        font-size: var(--fs-h1);
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .subtitle {
        margin: 0.3rem 0 0;
        color: var(--text-secondary);
        font-size: var(--fs-meta);
        max-width: 46ch;
      }

      /* pill-rader (filter/period/segment) */
      .pillrow {
        display: flex;
        gap: 0.55rem;
        flex-wrap: wrap;
        align-items: center;
      }
      .pillrow.scroll {
        flex-wrap: nowrap;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .pillrow.scroll::-webkit-scrollbar {
        display: none;
      }
      .pill {
        flex-shrink: 0;
        min-height: 2.25rem;
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0 0.85rem;
        border-radius: var(--r-pill);
        border: 1px solid rgba(180, 165, 150, 0.3);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(244, 238, 232, 0.84));
        font-size: var(--fs-meta);
        font-weight: 700;
        box-shadow: var(--sh-sm);
        color: var(--text-secondary);
        cursor: pointer;
        white-space: nowrap;
      }
      .pill[aria-pressed='true'],
      .pill.is-active {
        background: linear-gradient(180deg, #fdeef4, #f6cfdc);
        color: var(--accent);
        border-color: rgba(176, 53, 110, 0.32);
      }
      .pill .c {
        background: rgba(180, 165, 150, 0.18);
        padding: 0.05rem 0.4rem;
        border-radius: var(--r-pill);
        font-size: var(--fs-kicker);
        font-weight: 800;
      }
      @media (pointer: coarse) {
        .pill {
          min-height: var(--tap);
        }
      }
      .pill .dot {
        width: 0.4rem;
        height: 0.4rem;
        border-radius: 999px;
      }
      .pill--success {
        color: var(--success);
      }
      .pill--success .dot {
        background: var(--success);
      }
      .pill--warning {
        color: var(--warning);
      }
      .pill--warning .dot {
        background: var(--warning);
      }
      .pill--info {
        color: var(--info);
      }
      .pill--info .dot {
        background: var(--info);
      }
      .pill--vip {
        background: linear-gradient(180deg, #fdeef4, #f6cfdc);
        color: var(--accent);
        border-color: rgba(176, 53, 110, 0.32);
      }
      .pill--vip .dot {
        background: var(--accent);
      }

      /* knappar */
      .btn {
        min-height: 2.5rem;
        padding: 0 1rem;
        border-radius: var(--r-pill);
        border: 1px solid rgba(180, 165, 150, 0.35);
        background: rgba(255, 255, 255, 0.85);
        font: inherit;
        font-size: var(--fs-meta);
        font-weight: 700;
        color: var(--text-primary);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        white-space: nowrap;
      }
      .btn--primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .btn--danger {
        background: var(--danger-bg);
        border-color: rgba(168, 56, 56, 0.3);
        color: var(--danger);
      }
      @media (pointer: coarse) {
        .btn {
          min-height: var(--tap);
        }
      }

      /* kort & paneler */
      .card {
        position: relative;
        cursor: pointer;
        padding: 1.25rem;
        border-radius: var(--r-lg);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.94), rgba(247, 241, 236, 0.86));
        border: 1px solid rgba(180, 165, 150, 0.25);
        box-shadow: var(--sh-md);
        transition:
          transform 0.12s ease,
          box-shadow 0.12s ease,
          border-color 0.12s ease;
      }
      .card:hover {
        box-shadow: var(--sh-lg);
        border-color: rgba(176, 53, 110, 0.25);
      }
      .card:active {
        transform: scale(0.99);
      }
      .card.is-selected {
        border-color: var(--accent);
        box-shadow:
          0 0 0 2px rgba(176, 53, 110, 0.25),
          var(--sh-md);
      }
      .card.is-open {
        border-color: var(--accent);
      }
      .panel {
        padding: 1.3rem;
        border-radius: var(--r-xl);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.95), rgba(247, 241, 236, 0.88));
        border: 1px solid rgba(180, 165, 150, 0.25);
        box-shadow: var(--sh-md);
      }
      .panel-head {
        margin-bottom: 0.7rem;
      }
      .panel-head h2 {
        margin: 0;
        font-size: 0.95rem;
        font-weight: 800;
        letter-spacing: -0.01em;
      }
      .panel-head p {
        margin: 0.2rem 0 0;
        color: var(--text-tertiary);
        font-size: var(--fs-meta);
      }
      .sec-kicker {
        font-size: var(--fs-kicker);
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--text-tertiary);
      }

      /* metric-kort (KPI) */
      .metric {
        padding: 1.3rem 1.25rem;
        border-radius: var(--r-lg);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.94), rgba(247, 241, 236, 0.84));
        border: 1px solid rgba(180, 165, 150, 0.25);
        box-shadow: var(--sh-sm);
      }
      .metric .m-label {
        font-size: var(--fs-kicker);
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--text-tertiary);
      }
      .metric .m-val {
        font-size: var(--fs-num);
        font-weight: 800;
        letter-spacing: -0.02em;
        margin-top: 0.45rem;
        line-height: 1.05;
      }
      .metric .m-meta {
        font-size: var(--fs-kicker);
        color: var(--text-tertiary);
        margin-top: 0.45rem;
      }
      .metric .m-trend {
        font-size: var(--fs-kicker);
        font-weight: 800;
      }
      .m-trend--up {
        color: var(--success);
      }
      .m-trend--down {
        color: var(--danger);
      }
      .metric--green {
        border-left: 3px solid var(--success);
      }
      .metric--blue {
        border-left: 3px solid var(--info);
      }
      .metric--rose {
        border-left: 3px solid var(--accent);
      }
      .metric--violet {
        border-left: 3px solid var(--violet);
      }
      .metric--gold {
        border-left: 3px solid var(--gold);
      }
      .metric--slate {
        border-left: 3px solid var(--slate);
      }

      /* switch — 44px träffyta via track-storlek */
      .switch {
        position: relative;
        flex-shrink: 0;
        width: 3rem;
        height: var(--tap);
        cursor: pointer;
      }
      .switch input {
        position: absolute;
        inset: 0;
        opacity: 0;
        margin: 0;
        cursor: pointer;
      }
      .switch .track {
        position: absolute;
        top: 50%;
        left: 0;
        transform: translateY(-50%);
        width: 3rem;
        height: 1.6rem;
        border-radius: 999px;
        background: rgba(120, 108, 95, 0.32);
        transition: background 0.2s;
      }
      .switch .track::after {
        content: '';
        position: absolute;
        top: 2px;
        left: 2px;
        width: 1.2rem;
        height: 1.2rem;
        border-radius: 50%;
        background: #fff;
        box-shadow: var(--sh-sm);
        transition: transform 0.2s;
      }
      .switch input:checked + .track {
        background: var(--success);
      }
      .switch input:checked + .track::after {
        transform: translateX(1.4rem);
      }
      .switch input:focus-visible + .track {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      /* bottom-nav (samma som Konversationer/Senare-prototyperna) — döljs ≥601 */
      .botnav {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 60;
        display: flex;
        align-items: center;
        justify-content: space-around;
        gap: 0.25rem;
        padding: 0.5rem 0.75rem calc(0.5rem + var(--safe-bottom));
        background: linear-gradient(180deg, rgba(250, 246, 242, 0), rgba(250, 246, 242, 0.94) 30%);
        backdrop-filter: blur(20px);
      }
      .nav-i {
        flex: 1;
        min-height: var(--tap);
        border: 0;
        background: transparent;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.1rem;
        color: var(--text-tertiary);
        font-size: var(--fs-kicker);
        font-weight: 700;
        text-transform: uppercase;
      }
      .nav-i svg {
        width: 1.35rem;
        height: 1.35rem;
      }
      .nav-i.is-active {
        color: var(--accent);
      }
      /* lekfull bottom-nav — duoton-ikoner, per-flik-färg, studs + sväv + badge */
      .nav-i {
        gap: 0.2rem;
        transition: color 0.2s;
        position: relative;
      }
      .nav-i .ic-wrap {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 3.1rem;
        height: 1.9rem;
        border-radius: var(--r-pill);
        transition:
          background 0.25s,
          box-shadow 0.25s,
          transform 0.25s;
      }
      .nav-i .ic {
        width: 1.5rem;
        height: 1.5rem;
        transition: transform 0.2s;
      }
      .nav-i .ic-fill {
        fill: currentColor;
        opacity: 0.24;
        transition:
          fill 0.2s,
          opacity 0.2s;
      }
      .nav-i .ic-line {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .nav-i .ic-dot {
        fill: currentColor;
      }
      @media (hover: hover) {
        .nav-i:not(.is-active):hover .ic {
          transform: translateY(-2px) rotate(-6deg);
        }
        .nav-i:not(.is-active):hover .ic-wrap {
          background: rgba(176, 53, 110, 0.08);
        }
      }
      .nav-i:active .ic {
        transform: scale(0.84);
      }
      .nav-i.is-active {
        color: var(--ic, var(--accent));
      }
      .nav-i.is-active .ic-wrap {
        background: var(--ic-bg, var(--accent-weak));
        box-shadow: 0 7px 16px -6px var(--ic, var(--accent));
        animation: navfloat 2.8s ease-in-out infinite;
      }
      .nav-i.is-active .ic {
        animation: navpop 0.46s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .nav-i.is-active .ic-fill {
        opacity: 1;
        fill: var(--ic, var(--accent));
      }
      .nav-i.is-active .ic-line {
        stroke: #fff;
      }
      .nav-i.is-active .ic-dot {
        fill: #fff;
      }
      .nav-badge {
        position: absolute;
        top: -0.15rem;
        right: 0.4rem;
        min-width: 1rem;
        height: 1rem;
        padding: 0 0.25rem;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        font-size: 0.5625rem;
        font-weight: 800;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 0 2px var(--bg-page);
      }
      @keyframes navpop {
        0% {
          transform: scale(0.55);
        }
        55% {
          transform: scale(1.2);
        }
        100% {
          transform: scale(1);
        }
      }
      @keyframes navfloat {
        0%,
        100% {
          transform: translateY(-3px);
        }
        50% {
          transform: translateY(-6px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .nav-i .ic,
        .nav-i .ic-wrap {
          animation: none !important;
        }
      }
      @media (min-width: 601px) {
        .botnav {
          display: none;
        }
        .aux {
          padding-bottom: 2rem;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }

      /* ===== SHOWCASE-SPECIFIK STYLING (bygger på primitiverna ovan) ===== */

      /* 2-kolumn showcase: pill-lista + detaljpanel */
      .showcase-layout {
        display: grid;
        grid-template-columns: 1fr;
        gap: var(--gap);
        margin-top: 0.8rem;
      }

      /* VÄNSTER: vertikal funktions-lista (mobil = wrappad grid) */
      .feature-list {
        display: flex;
        flex-wrap: wrap;
        gap: 0.45rem;
        min-width: 0;
      }
      .feat {
        flex: 1 1 auto;
        min-height: var(--tap);
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.55rem 0.85rem;
        border-radius: var(--r-md);
        border: 1px solid rgba(180, 165, 150, 0.3);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(244, 238, 232, 0.84));
        font-size: var(--fs-meta);
        font-weight: 700;
        color: var(--text-secondary);
        cursor: pointer;
        text-align: left;
        white-space: nowrap;
      }
      .feat .fe {
        font-size: 1.05rem;
        line-height: 1;
        flex-shrink: 0;
      }
      .feat .fl {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .feat[aria-pressed='true'] {
        background: linear-gradient(180deg, #fdeef4, #f6cfdc);
        color: var(--accent);
        border-color: rgba(176, 53, 110, 0.32);
        box-shadow: var(--sh-sm);
      }

      /* HÖGER: detaljpanel */
      .detail {
        display: flex;
        flex-direction: column;
        gap: var(--gap);
        min-width: 0;
      }

      /* hero-rad: hero + effect-card */
      .detail-top {
        display: grid;
        grid-template-columns: 1fr;
        gap: var(--gap);
        align-items: start;
      }
      .hero {
        min-width: 0;
      }
      .hero .h2 {
        margin: 0.15rem 0 0;
        font-size: clamp(1.05rem, 0.95rem+0.7vw, 1.4rem);
        font-weight: 800;
        letter-spacing: -0.02em;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .hero .h2 .emoji {
        font-size: 1.3em;
        line-height: 1;
      }
      .hero .copy {
        margin: 0.5rem 0 0;
        color: var(--text-secondary);
        font-size: var(--fs-body);
      }

      /* effect-card */
      .effect-card {
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
        padding: 1rem;
        border-radius: var(--r-lg);
        background: linear-gradient(180deg, #fdeef4, rgba(246, 207, 220, 0.55));
        border: 1px solid rgba(176, 53, 110, 0.28);
        box-shadow: var(--sh-sm);
      }
      .effect-card .e-label {
        font-size: var(--fs-kicker);
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--accent);
      }
      .effect-card .e-title {
        font-size: 1.05rem;
        font-weight: 800;
        letter-spacing: -0.01em;
        color: var(--text-primary);
      }
      .effect-card .e-copy {
        font-size: var(--fs-meta);
        color: var(--text-secondary);
      }

      /* body-card */
      .body-card .outcome {
        display: block;
        font-size: 1rem;
        font-weight: 800;
        letter-spacing: -0.01em;
        color: var(--text-primary);
      }
      .body-card .detail-p {
        margin: 0.45rem 0 0.9rem;
        color: var(--text-secondary);
        font-size: var(--fs-meta);
      }
      .body-acts {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }

      /* bottom 2-kort rad */
      .detail-notes {
        display: grid;
        grid-template-columns: 1fr;
        gap: var(--gap);
      }
      .note {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
      }
      .note .n-strong {
        display: block;
        font-size: 0.95rem;
        font-weight: 800;
        letter-spacing: -0.01em;
        color: var(--text-primary);
      }
      .note p {
        margin: 0;
        color: var(--text-secondary);
        font-size: var(--fs-meta);
      }

      /* iPad 601–1024: pill-rad ovanför panelen (wrappad grid), bottom-noteringar 1-kol via default */
      @media (min-width: 601px) {
        .feat {
          flex: 0 1 auto;
        }
      }

      /* Desktop ≥1025: centrerad 2-kol — pill-lista ~16rem + panel; effect-card bredvid hero; noteringar 2-kol */
      @media (min-width: 1025px) {
        .showcase-layout {
          grid-template-columns: 16rem minmax(0, 1fr);
          align-items: start;
        }
        .feature-list {
          flex-direction: column;
          flex-wrap: nowrap;
          position: sticky;
          top: 4.5rem;
        }
        .feat {
          flex: 0 0 auto;
          width: 100%;
        }
        .detail-top {
          grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr);
        }
        .detail-notes {
          grid-template-columns: 1fr 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="aux">
      <!-- ===== TOPBAR ===== -->
      <div class="topbar">
        <span class="brand">CCO</span>
        <label class="search"
          ><svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.4"
            stroke-linecap="round"
          >
            <circle cx="11" cy="11" r="7" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" /></svg
          ><input placeholder="Sök funktioner…"
        /></label>
        <button class="icon-btn" aria-label="Filtrera">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
          >
            <path d="M3 5h18M6 12h12M10 19h4" />
          </svg>
        </button>
      </div>

      <!-- ===== HEAD ===== -->
      <div class="head">
        <div class="head-main">
          <span class="kicker">Visa funktioner</span>
          <h1 class="h1">Kraftfunktioner i nya arbetsytan</h1>
          <p class="subtitle">
            Översikt över de funktioner som ska kunna lyftas vidare in i
            <code>/cco-next</code> senare.
          </p>
        </div>
      </div>

      <!-- ===== SHOWCASE 2-KOLUMN ===== -->
      <div class="showcase-layout">
        <!-- VÄNSTER: funktions-lista -->
        <div class="feature-list" id="featureList" role="group" aria-label="Funktioner"></div>

        <!-- HÖGER: detaljpanel -->
        <div class="detail" id="detail"></div>
      </div>
    </div>

    <!-- ===== BOTNAV ===== -->
    <nav class="botnav" aria-label="Huvudnavigering">
      <button
        class="nav-i is-active"
        aria-current="page"
        style="--ic: var(--accent); --ic-bg: var(--accent-bg)"
      >
        <span class="ic-wrap"
          ><svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
            <path
              class="ic-fill"
              d="M3.2 11.3 12 4l8.8 7.3c.3.2.5.6.5 1V20a1 1 0 0 1-1 1H3.7a1 1 0 0 1-1-1v-7.7c0-.4.2-.8.5-1Z"
            />
            <path
              class="ic-line"
              d="M9.4 21v-4.7a1.1 1.1 0 0 1 1.1-1.1h3a1.1 1.1 0 0 1 1.1 1.1V21"
            /></svg></span
        >Hem
      </button>
      <button class="nav-i" style="--ic: #2f6595; --ic-bg: rgba(47, 101, 149, 0.14)">
        <span class="ic-wrap"
          ><svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
            <path
              class="ic-fill"
              d="M5 5h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z"
            />
            <path class="ic-line" d="M3 9.7h18M8 3v3.4M16 3v3.4M12 12.6v4.4M9.8 14.8h4.4" /></svg
          ><span class="nav-badge">3</span></span
        >Boka
      </button>
      <button class="nav-i" style="--ic: #6b31c9; --ic-bg: rgba(107, 49, 201, 0.12)">
        <span class="ic-wrap"
          ><svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
            <path
              class="ic-fill"
              d="M5 5h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z"
            />
            <path class="ic-line" d="M3 9.7h18M8 3v3.4M16 3v3.4" />
            <circle class="ic-dot" cx="8" cy="13.4" r="1" />
            <circle class="ic-dot" cx="12" cy="13.4" r="1" />
            <circle class="ic-dot" cx="16" cy="13.4" r="1" />
            <circle class="ic-dot" cx="8" cy="17" r="1" />
            <circle class="ic-dot" cx="12" cy="17" r="1" /></svg></span
        >Kalender
      </button>
      <button class="nav-i" style="--ic: #2f6f54; --ic-bg: rgba(47, 111, 84, 0.16)">
        <span class="ic-wrap"
          ><svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
            <path
              class="ic-fill"
              d="M12 12.4a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm0 1.6c-4.2 0-7.6 2.7-7.6 6.1 0 .5.4.9.9.9h13.4c.5 0 .9-.4.9-.9 0-3.4-3.4-6.1-7.6-6.1Z"
            /></svg></span
        >Kund
      </button>
      <button class="nav-i" style="--ic: #8a5f1e; --ic-bg: rgba(138, 95, 30, 0.14)">
        <span class="ic-wrap"
          ><svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
            <path
              class="ic-fill"
              d="M7 2.6h9.4A2.6 2.6 0 0 1 19 5.2V20a1.4 1.4 0 0 1-1.4 1.4H7A2.4 2.4 0 0 1 4.6 19V5A2.4 2.4 0 0 1 7 2.6Z"
            />
            <path class="ic-line" d="M8.4 7.6h6.2M8.4 11.2h6.2M8.4 14.8h4" /></svg></span
        >Journal
      </button>
    </nav>

    <script>
      const WHY_COPY =
        'Power features ska vara nära operatören i arbetsytan i stället för att gömmas i en separat meny.';

      const FEATURES = [
        {
          key: 'command_palette',
          emoji: '⌨️',
          name: 'Kommandopalett',
          focus: 'Snabbnavigering',
          copy: 'Tryck ⌘K för att hoppa mellan konversationer, kunder, automationer och operativa actions utan att lämna arbetsflödet.',
          outcome: 'Snabbare beslut med mindre klick mellan vyer.',
          detail:
            'Global sökning och snabbåtgärder gör att operatören kan byta yta utan att tappa fokus eller kontext.',
          effectTitle: 'Fokus',
          effectCopy: 'Mindre klick mellan vyer',
          nextTitle: 'Knyt ihop genvägarna med rätt vyer',
          nextCopy: 'Låt kommandopaletten hoppa direkt till de ytor där beslutet faktiskt tas.',
          primary: 'Öppna makron',
          secondary: 'Gå till konversationer',
        },
        {
          key: 'bulk_ops',
          emoji: '🚀',
          name: 'Massåtgärder',
          focus: 'Batcharbete',
          copy: 'Markera flera profiler, öppna massammanfoga och driv igenom identitetsstädning utan att lämna kundvyn.',
          outcome: 'Färre manuella merge-pass och tydligare kundbild.',
          detail:
            'Massåtgärder samlar repetitiva kundoperationer i ett pass i stället för att kräva flera manuella rundor.',
          effectTitle: 'Tempo',
          effectCopy: 'Snabbare städning i kundregistret',
          nextTitle: 'Öppna kundvyn i batch-läge',
          nextCopy: 'Markera flera profiler och låt högerrailen driva merge-flödet.',
          primary: 'Öppna kunder',
          secondary: 'Öppna inställningar',
        },
        {
          key: 'saved_views',
          emoji: '🗂️',
          name: 'Sparade vyer',
          focus: 'Filtrering',
          copy: 'Lås återkommande urval för arbetskö, senare-listor och kundlistor så att teamet kan växla läge utan att bygga om filtren varje gång.',
          outcome: 'Mindre omställningstid mellan prioriteringslägen.',
          detail:
            'Sparade vyer ger samma utgångspunkt för triage, uppföljning och kundstädning oavsett vem som tar över skiftet.',
          effectTitle: 'Utfall',
          effectCopy: 'Snabbare växling mellan sparade lägen',
          nextTitle: 'Knyt vyerna till arbetsköns filter',
          nextCopy:
            'Bygg vidare på arbetsköns logik och låt vyerna spara mailbox, ägare och status tillsammans.',
          primary: 'Gå till konversationer',
          secondary: 'Öppna senare',
        },
        {
          key: 'collision',
          emoji: '👥',
          name: 'Kollisionsdetektering',
          focus: 'Kundskydd',
          copy: 'När två profiler delar telefon eller e-post lyfter ytan förslag direkt i railen innan fel svar går ut.',
          outcome: 'Mindre risk för fel kund, fel ton eller fel historik i fokusytan.',
          detail:
            'Kollisionsdetektering ska stoppa felaktiga svar innan de lämnar arbetsytan genom att göra konfliktbilden synlig direkt i railen.',
          effectTitle: 'Skydd',
          effectCopy: 'Färre felmatchningar mellan kunder',
          nextTitle: 'Öppna identitetsflödet direkt från förslaget',
          nextCopy:
            'Låt accept/avfärda och merge-val leva i samma kundyta utan extra modaler i första steget.',
          primary: 'Öppna kunder',
          secondary: 'Öppna inställningar',
        },
        {
          key: 'ai_assistant',
          emoji: '🤖',
          name: 'AI-assistent',
          focus: 'Stöd i realtid',
          copy: 'Lyft fram sammanfattningar, nästa steg och riskflaggor när operatören är mitt i tråden i stället för att skicka dem till en separat sida.',
          outcome: 'Mer beslutsstöd utan att lämna arbetsytan.',
          detail:
            'AI-assistenten ska stödja operatören i kontext: i fokusytan, i kundintelligensen och i svarsstudion, inte som en fristående app.',
          effectTitle: 'Fokus',
          effectCopy: 'Mer stöd där svaren faktiskt skrivs',
          nextTitle: 'Knyt assistenten till fokusytan',
          nextCopy:
            'Visa sammanfattning, nästa steg och blockerare i samma arbetskolumn som konversationen.',
          primary: 'Gå till konversationer',
          secondary: 'Öppna analys',
        },
        {
          key: 'macros',
          emoji: '🎬',
          name: 'Makron',
          focus: 'Repetition',
          copy: 'Återanvänd återkommande svarsspår, uppföljningar och anteckningsflöden genom att köra makron från samma shell.',
          outcome: 'Jämnare kvalitet i operativa svar och snabbare onboarding av teamet.',
          detail:
            'Makron samlar svar, nästa steg och följdhandlingar i ett körbart block i stället för att sprida logiken över flera verktyg.',
          effectTitle: 'Återanvändning',
          effectCopy: 'Fler standardiserade svar med mindre friktion',
          nextTitle: 'Knyt makron till studio och automation',
          nextCopy:
            'Låt samma makro gå att köra direkt i svarsstudion eller öppna som byggsten i automation.',
          primary: 'Öppna makron',
          secondary: 'Öppna automation',
        },
        {
          key: 'customer_journey',
          emoji: '🗺️',
          name: 'Kundresa',
          focus: 'Helhetsbild',
          copy: 'Samla viktiga steg, behandlingar, blockerare och nästa rekommenderade moment i en tydlig tidslinje över kunden.',
          outcome: 'Bättre överblick över var kunden faktiskt befinner sig.',
          detail:
            'Kundresan ska hjälpa operatören att förstå helheten över flera mejlkonton och kontaktpunkter utan att gräva i råhistorik först.',
          effectTitle: 'Utfall',
          effectCopy: 'Tydligare nästa steg per kund',
          nextTitle: 'Knyt tidslinjen till kundhistoriken',
          nextCopy:
            'Visa resan i fokusytans kundhistorik och låt den mata beslut i kundintelligensen.',
          primary: 'Öppna kunder',
          secondary: 'Gå till konversationer',
        },
        {
          key: 'snooze',
          emoji: '⏰',
          name: 'Senare-läge',
          focus: 'Timing',
          copy: 'Skicka trådar till Senare från både arbetskö och fokusyta och plocka upp dem igen exakt när kundens timing är rätt.',
          outcome: 'Mer kontroll över återupptag utan att förlora kontext eller studio-läge.',
          detail:
            'Senare-läget ska vara den tydliga återupptagningsytan för snoozade trådar, inte ett dolt sidospår i huvudnavigeringen.',
          effectTitle: 'Timing',
          effectCopy: 'Återuppta rätt tråd vid rätt tidpunkt',
          nextTitle: 'Knyt snooze till arbetskön och fokusytan',
          nextCopy: 'Låt operatören snooza från fokusytan men återuppta från en tydlig Senare-yta.',
          primary: 'Öppna senare',
          secondary: 'Gå till konversationer',
        },
      ];

      const esc = (s) =>
        String(s).replace(
          /[&<>"]/g,
          (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[m]
        );
      const listEl = document.getElementById('featureList');
      const detailEl = document.getElementById('detail');

      function renderPills(activeKey) {
        listEl.innerHTML = FEATURES.map(
          (f) =>
            `<button class="feat" data-key="${f.key}" aria-pressed="${f.key === activeKey ? 'true' : 'false'}"><span class="fe" aria-hidden="true">${f.emoji}</span><span class="fl">${esc(f.name)}</span></button>`
        ).join('');
      }

      function renderDetail(f) {
        detailEl.innerHTML = `
    <div class="detail-top">
      <div class="hero">
        <span class="kicker">${esc(f.focus)}</span>
        <h2 class="h2"><span class="emoji" aria-hidden="true">${f.emoji}</span>${esc(f.name)}</h2>
        <p class="copy">${esc(f.copy)}</p>
      </div>
      <div class="effect-card">
        <span class="e-label">Operativ effekt</span>
        <span class="e-title">${esc(f.effectTitle)}</span>
        <span class="e-copy">${esc(f.effectCopy)}</span>
      </div>
    </div>

    <div class="card body-card">
      <span class="sec-kicker">Aktiv funktion</span>
      <strong class="outcome">${esc(f.outcome)}</strong>
      <p class="detail-p">${esc(f.detail)}</p>
      <div class="body-acts">
        <button class="btn btn--primary">${esc(f.primary)}</button>
        <button class="btn">${esc(f.secondary)}</button>
      </div>
    </div>

    <div class="detail-notes">
      <div class="card note">
        <span class="sec-kicker">Varför den här ytan finns</span>
        <strong class="n-strong">Behåll power features nära operatören</strong>
        <p>${esc(WHY_COPY)}</p>
      </div>
      <div class="card note">
        <span class="sec-kicker">Nästa steg</span>
        <strong class="n-strong">${esc(f.nextTitle)}</strong>
        <p>${esc(f.nextCopy)}</p>
      </div>
    </div>`;
      }

      function select(key) {
        const f = FEATURES.find((x) => x.key === key) || FEATURES[0];
        renderPills(f.key);
        renderDetail(f);
      }

      listEl.addEventListener('click', (e) => {
        const b = e.target.closest('.feat');
        if (!b) return;
        select(b.dataset.key);
      });

      select(FEATURES[0].key);
    </script>
    <script>
      (function () {
        var nav = document.querySelector('.botnav');
        if (!nav) return;
        nav.addEventListener('click', function (e) {
          var b = e.target.closest('.nav-i');
          if (!b) return;
          nav.querySelectorAll('.nav-i').forEach(function (x) {
            x.classList.remove('is-active');
            x.removeAttribute('aria-current');
          });
          void b.offsetWidth;
          b.classList.add('is-active');
          b.setAttribute('aria-current', 'page');
        });
      })();
    </script>
  </body>
</html>
