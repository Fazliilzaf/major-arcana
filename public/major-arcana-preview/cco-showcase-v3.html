<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>CCO Showcase — v3 responsiv</title>
<style>
/* ===== CCO AUX SHARED FOUNDATION — paste inside each prototype's <style> at the top =====
   WCAG-härdad varm palett (all text ≥4.5:1). rem/clamp + CSS Grid/flex. Touch ≥44px.
   Samma tokens/primitiver i alla aux-ytor → de hör ihop med varandra och resten av appen. */
:root{
  --bg-page:#faf6f2;--bg-surface:#fff;--bg-sunken:#f3ece3;--bg-rail:#fbf7f2;
  --text-primary:#221c15;--text-secondary:#574d40;--text-tertiary:#6d6354;
  --accent:#b0356e;--accent-weak:#fdeef4;
  --success:#2f6f54;--success-bg:rgba(47,111,84,.16);--warning:#9a6410;--warning-bg:rgba(154,100,16,.16);
  --danger:#a83838;--danger-bg:rgba(168,56,56,.14);--info:#2f6595;--info-bg:rgba(47,101,149,.14);
  --violet:#6b31c9;--violet-bg:rgba(107,49,201,.12);--gold:#8a5f1e;--gold-bg:rgba(138,95,30,.14);--slate:#475569;--slate-bg:rgba(71,85,105,.12);
  --sh-sm:0 1px 2px rgba(56,40,28,.06);--sh-md:0 3px 10px rgba(56,40,28,.08),inset 0 1px 0 rgba(255,255,255,.86);--sh-lg:0 10px 26px rgba(56,40,28,.14);
  --r-sm:10px;--r-md:14px;--r-lg:18px;--r-xl:24px;--r-pill:999px;
  --fs-kicker:.6875rem;--fs-meta:.75rem;--fs-body:.875rem;--fs-h1:clamp(1.25rem,1.05rem+1.4vw,1.85rem);--fs-num:clamp(1.35rem,1.1rem+1.4vw,1.9rem);
  --tap:2.75rem;--gap:clamp(.5rem,.4rem+.5vw,.85rem);--pad-x:clamp(.875rem,.5rem+1.6vw,1.5rem);--safe-bottom:env(safe-area-inset-bottom,0px);
  --maxw:1500px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:100%;overflow-x:clip}html,body{margin:0;padding:0;max-width:100%}
body{background:radial-gradient(ellipse at 12% 0%,rgba(255,225,200,.4),transparent 38%),radial-gradient(ellipse at 88% 4%,rgba(255,210,225,.3),transparent 42%),var(--bg-page);
  color:var(--text-primary);font-family:-apple-system,"SF Pro Display",Inter,system-ui,sans-serif;font-size:var(--fs-body);line-height:1.45;min-height:100vh;overflow-x:hidden}
button{font-family:inherit}:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.tabnum{font-variant-numeric:tabular-nums}

/* page wrapper — centrerad, max-bredd, plats för botnav på mobil */
.aux{max-width:var(--maxw);margin-inline:auto;padding:0 var(--pad-x) 6rem;min-height:100vh}
@media(min-width:1025px){.aux{padding-bottom:2rem}}

/* topbar (samma som Konversationer/Senare) */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:var(--gap);padding:.5rem var(--pad-x);padding-top:calc(.5rem + env(safe-area-inset-top,0px));
  margin:0 calc(-1*var(--pad-x));background:linear-gradient(180deg,rgba(250,246,242,.97),rgba(250,246,242,.82) 80%,transparent);backdrop-filter:blur(18px)}
.brand{flex-shrink:0;font-weight:800;letter-spacing:.08em;padding:.4rem .7rem;border-radius:var(--r-pill);background:linear-gradient(180deg,#fdeef4,#f6cfdc);color:var(--accent)}
.search{flex:1;min-width:0;position:relative;display:flex;align-items:center;height:var(--tap);border-radius:var(--r-md);background:rgba(255,255,255,.7);border:1px solid rgba(180,165,150,.35);box-shadow:var(--sh-sm);padding:0 .75rem 0 2.1rem}
.search svg{position:absolute;left:.7rem;width:1rem;height:1rem;color:var(--text-tertiary)}
.search input{appearance:none;border:0;background:transparent;width:100%;height:100%;font:inherit;font-size:var(--fs-meta);color:var(--text-primary);outline:none}
.icon-btn{flex-shrink:0;width:var(--tap);height:var(--tap);border-radius:var(--r-md);background:rgba(255,255,255,.7);border:1px solid rgba(180,165,150,.35);box-shadow:var(--sh-sm);display:inline-flex;align-items:center;justify-content:center;color:var(--text-primary);cursor:pointer}
.icon-btn svg{width:1.1rem;height:1.1rem}

/* head-zon */
.head{padding:.9rem 0 .4rem;display:flex;align-items:flex-end;justify-content:space-between;gap:var(--gap);flex-wrap:wrap}
.head-main{min-width:0}
.kicker{display:inline-flex;align-items:center;gap:.4rem;color:var(--text-tertiary);font-size:var(--fs-kicker);font-weight:800;letter-spacing:.14em;text-transform:uppercase;margin-bottom:.25rem}
.h1{margin:0;font-size:var(--fs-h1);font-weight:800;letter-spacing:-.02em}
.subtitle{margin:.3rem 0 0;color:var(--text-secondary);font-size:var(--fs-meta);max-width:46ch}

/* pill-rader (filter/period/segment) */
.pillrow{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
.pillrow.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.pillrow.scroll::-webkit-scrollbar{display:none}
.pill{flex-shrink:0;min-height:2.25rem;display:inline-flex;align-items:center;gap:.4rem;padding:0 .85rem;border-radius:var(--r-pill);border:1px solid rgba(180,165,150,.3);background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(244,238,232,.84));font-size:var(--fs-meta);font-weight:700;color:var(--text-secondary);cursor:pointer;white-space:nowrap}
.pill[aria-pressed="true"],.pill.is-active{background:linear-gradient(180deg,#fdeef4,#f6cfdc);color:var(--accent);border-color:rgba(176,53,110,.32)}
.pill .c{background:rgba(180,165,150,.18);padding:.05rem .4rem;border-radius:var(--r-pill);font-size:var(--fs-kicker);font-weight:800}
@media(pointer:coarse){.pill{min-height:var(--tap)}}

/* knappar */
.btn{min-height:2.5rem;padding:0 1rem;border-radius:var(--r-pill);border:1px solid rgba(180,165,150,.35);background:rgba(255,255,255,.85);font:inherit;font-size:var(--fs-meta);font-weight:700;color:var(--text-primary);cursor:pointer;display:inline-flex;align-items:center;gap:.35rem;white-space:nowrap}
.btn--primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn--danger{background:var(--danger-bg);border-color:rgba(168,56,56,.3);color:var(--danger)}
@media(pointer:coarse){.btn{min-height:var(--tap)}}

/* kort & paneler */
.card{padding:1rem;border-radius:var(--r-lg);background:linear-gradient(180deg,rgba(255,255,255,.94),rgba(247,241,236,.86));border:1px solid rgba(180,165,150,.25);box-shadow:var(--sh-md)}
.panel{padding:1.1rem;border-radius:var(--r-xl);background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(247,241,236,.88));border:1px solid rgba(180,165,150,.25);box-shadow:var(--sh-md)}
.panel-head{margin-bottom:.7rem}
.panel-head h2{margin:0;font-size:.95rem;font-weight:800;letter-spacing:-.01em}
.panel-head p{margin:.2rem 0 0;color:var(--text-tertiary);font-size:var(--fs-meta)}
.sec-kicker{font-size:var(--fs-kicker);font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--text-tertiary)}

/* metric-kort (KPI) */
.metric{padding:.9rem 1rem;border-radius:var(--r-lg);background:linear-gradient(180deg,rgba(255,255,255,.94),rgba(247,241,236,.84));border:1px solid rgba(180,165,150,.25);box-shadow:var(--sh-sm)}
.metric .m-label{font-size:var(--fs-kicker);font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text-tertiary)}
.metric .m-val{font-size:var(--fs-num);font-weight:800;letter-spacing:-.02em;margin-top:.15rem;line-height:1.05}
.metric .m-meta{font-size:var(--fs-kicker);color:var(--text-tertiary);margin-top:.25rem}
.metric .m-trend{font-size:var(--fs-kicker);font-weight:800}
.m-trend--up{color:var(--success)}.m-trend--down{color:var(--danger)}
.metric--green{border-left:3px solid var(--success)}.metric--blue{border-left:3px solid var(--info)}.metric--rose{border-left:3px solid var(--accent)}
.metric--violet{border-left:3px solid var(--violet)}.metric--gold{border-left:3px solid var(--gold)}.metric--slate{border-left:3px solid var(--slate)}

/* switch — 44px träffyta via track-storlek */
.switch{position:relative;flex-shrink:0;width:3rem;height:var(--tap);cursor:pointer}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.switch .track{position:absolute;top:50%;left:0;transform:translateY(-50%);width:3rem;height:1.6rem;border-radius:999px;background:rgba(120,108,95,.32);transition:background .2s}
.switch .track::after{content:"";position:absolute;top:2px;left:2px;width:1.2rem;height:1.2rem;border-radius:50%;background:#fff;box-shadow:var(--sh-sm);transition:transform .2s}
.switch input:checked + .track{background:var(--success)}
.switch input:checked + .track::after{transform:translateX(1.4rem)}
.switch input:focus-visible + .track{outline:2px solid var(--accent);outline-offset:2px}

/* bottom-nav (samma som Konversationer/Senare-prototyperna) — döljs ≥601 */
.botnav{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;align-items:center;justify-content:space-around;gap:.25rem;padding:.5rem .75rem calc(.5rem + var(--safe-bottom));background:linear-gradient(180deg,rgba(250,246,242,0),rgba(250,246,242,.94) 30%);backdrop-filter:blur(20px)}
.nav-i{flex:1;min-height:var(--tap);border:0;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.1rem;color:var(--text-tertiary);font-size:var(--fs-kicker);font-weight:700;text-transform:uppercase}
.nav-i svg{width:1.35rem;height:1.35rem}.nav-i.is-active{color:var(--accent)}
/* lekfull bottom-nav — duoton-ikoner, per-flik-färg, studs + sväv + badge */
.nav-i{gap:.2rem;transition:color .2s;position:relative}
.nav-i .ic-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center;width:3.1rem;height:1.9rem;border-radius:var(--r-pill);transition:background .25s,box-shadow .25s,transform .25s}
.nav-i .ic{width:1.5rem;height:1.5rem;transition:transform .2s}
.nav-i .ic-fill{fill:currentColor;opacity:.24;transition:fill .2s,opacity .2s}
.nav-i .ic-line{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav-i .ic-dot{fill:currentColor}
@media(hover:hover){.nav-i:not(.is-active):hover .ic{transform:translateY(-2px) rotate(-6deg)}.nav-i:not(.is-active):hover .ic-wrap{background:rgba(176,53,110,.08)}}
.nav-i:active .ic{transform:scale(.84)}
.nav-i.is-active{color:var(--ic,var(--accent))}
.nav-i.is-active .ic-wrap{background:var(--ic-bg,var(--accent-weak));box-shadow:0 7px 16px -6px var(--ic,var(--accent));animation:navfloat 2.8s ease-in-out infinite}
.nav-i.is-active .ic{animation:navpop .46s cubic-bezier(.34,1.56,.64,1)}
.nav-i.is-active .ic-fill{opacity:1;fill:var(--ic,var(--accent))}
.nav-i.is-active .ic-line{stroke:#fff}
.nav-i.is-active .ic-dot{fill:#fff}
.nav-badge{position:absolute;top:-.15rem;right:.4rem;min-width:1rem;height:1rem;padding:0 .25rem;border-radius:999px;background:var(--accent);color:#fff;font-size:.5625rem;font-weight:800;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--bg-page)}
@keyframes navpop{0%{transform:scale(.55)}55%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes navfloat{0%,100%{transform:translateY(-3px)}50%{transform:translateY(-6px)}}
@media(prefers-reduced-motion:reduce){.nav-i .ic,.nav-i .ic-wrap{animation:none!important}}
@media(min-width:601px){.botnav{display:none}.aux{padding-bottom:2rem}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== SHOWCASE-SPECIFIK STYLING (bygger på primitiverna ovan) ===== */

/* 2-kolumn showcase: pill-lista + detaljpanel */
.showcase-layout{display:grid;grid-template-columns:1fr;gap:var(--gap);margin-top:.8rem}

/* VÄNSTER: vertikal funktions-lista (mobil = wrappad grid) */
.feature-list{display:flex;flex-wrap:wrap;gap:.45rem;min-width:0}
.feat{flex:1 1 auto;min-height:var(--tap);display:inline-flex;align-items:center;gap:.5rem;padding:.55rem .85rem;border-radius:var(--r-md);border:1px solid rgba(180,165,150,.3);background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(244,238,232,.84));font-size:var(--fs-meta);font-weight:700;color:var(--text-secondary);cursor:pointer;text-align:left;white-space:nowrap}
.feat .fe{font-size:1.05rem;line-height:1;flex-shrink:0}
.feat .fl{min-width:0;overflow:hidden;text-overflow:ellipsis}
.feat[aria-pressed="true"]{background:linear-gradient(180deg,#fdeef4,#f6cfdc);color:var(--accent);border-color:rgba(176,53,110,.32);box-shadow:var(--sh-sm)}

/* HÖGER: detaljpanel */
.detail{display:flex;flex-direction:column;gap:var(--gap);min-width:0}

/* hero-rad: hero + effect-card */
.detail-top{display:grid;grid-template-columns:1fr;gap:var(--gap);align-items:start}
.hero{min-width:0}
.hero .h2{margin:.15rem 0 0;font-size:clamp(1.05rem,.95rem+.7vw,1.4rem);font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:.5rem}
.hero .h2 .emoji{font-size:1.3em;line-height:1}
.hero .copy{margin:.5rem 0 0;color:var(--text-secondary);font-size:var(--fs-body)}

/* effect-card */
.effect-card{display:flex;flex-direction:column;gap:.3rem;padding:1rem;border-radius:var(--r-lg);background:linear-gradient(180deg,#fdeef4,rgba(246,207,220,.55));border:1px solid rgba(176,53,110,.28);box-shadow:var(--sh-sm)}
.effect-card .e-label{font-size:var(--fs-kicker);font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.effect-card .e-title{font-size:1.05rem;font-weight:800;letter-spacing:-.01em;color:var(--text-primary)}
.effect-card .e-copy{font-size:var(--fs-meta);color:var(--text-secondary)}

/* body-card */
.body-card .outcome{display:block;font-size:1rem;font-weight:800;letter-spacing:-.01em;color:var(--text-primary)}
.body-card .detail-p{margin:.45rem 0 .9rem;color:var(--text-secondary);font-size:var(--fs-meta)}
.body-acts{display:flex;flex-wrap:wrap;gap:.5rem}

/* bottom 2-kort rad */
.detail-notes{display:grid;grid-template-columns:1fr;gap:var(--gap)}
.note{display:flex;flex-direction:column;gap:.4rem}
.note .n-strong{display:block;font-size:.95rem;font-weight:800;letter-spacing:-.01em;color:var(--text-primary)}
.note p{margin:0;color:var(--text-secondary);font-size:var(--fs-meta)}

/* iPad 601–1024: pill-rad ovanför panelen (wrappad grid), bottom-noteringar 1-kol via default */
@media(min-width:601px){
  .feat{flex:0 1 auto}
}

/* Desktop ≥1025: centrerad 2-kol — pill-lista ~16rem + panel; effect-card bredvid hero; noteringar 2-kol */
@media(min-width:1025px){
  .showcase-layout{grid-template-columns:16rem minmax(0,1fr);align-items:start}
  .feature-list{flex-direction:column;flex-wrap:nowrap;position:sticky;top:4.5rem}
  .feat{flex:0 0 auto;width:100%}
  .detail-top{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
  .detail-notes{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="aux">

  <!-- ===== TOPBAR ===== -->
  <div class="topbar"><span class="brand">CCO</span>

<script>
const WHY_COPY="Power features ska vara nära operatören i arbetsytan i stället för att gömmas i en separat meny.";

const FEATURES=[
  {key:'command_palette',emoji:'⌨️',name:'Kommandopalett',focus:'Snabbnavigering',
   copy:'Tryck ⌘K för att hoppa mellan konversationer, kunder, automationer och operativa actions utan att lämna arbetsflödet.',
   outcome:'Snabbare beslut med mindre klick mellan vyer.',
   detail:'Global sökning och snabbåtgärder gör att operatören kan byta yta utan att tappa fokus eller kontext.',
   effectTitle:'Fokus',effectCopy:'Mindre klick mellan vyer',
   nextTitle:'Knyt ihop genvägarna med rätt vyer',nextCopy:'Låt kommandopaletten hoppa direkt till de ytor där beslutet faktiskt tas.',
   primary:'Öppna makron',secondary:'Gå till konversationer'},
  {key:'bulk_ops',emoji:'🚀',name:'Massåtgärder',focus:'Batcharbete',
   copy:'Markera flera profiler, öppna massammanfoga och driv igenom identitetsstädning utan att lämna kundvyn.',
   outcome:'Färre manuella merge-pass och tydligare kundbild.',
   detail:'Massåtgärder samlar repetitiva kundoperationer i ett pass i stället för att kräva flera manuella rundor.',
   effectTitle:'Tempo',effectCopy:'Snabbare städning i kundregistret',
   nextTitle:'Öppna kundvyn i batch-läge',nextCopy:'Markera flera profiler och låt högerrailen driva merge-flödet.',
   primary:'Öppna kunder',secondary:'Öppna inställningar'},
  {key:'saved_views',emoji:'🗂️',name:'Sparade vyer',focus:'Filtrering',
   copy:'Lås återkommande urval för arbetskö, senare-listor och kundlistor så att teamet kan växla läge utan att bygga om filtren varje gång.',
   outcome:'Mindre omställningstid mellan prioriteringslägen.',

const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const listEl=document.getElementById('featureList');
const detailEl=document.getElementById('detail');

function renderPills(activeKey){
  listEl.innerHTML=FEATURES.map(f=>`<button class="feat" data-key="${f.key}" aria-pressed="${f.key===activeKey?'true':'false'}"><span class="fe" aria-hidden="true">${f.emoji}</span><span class="fl">${esc(f.name)}</span></button>`).join('');
}

function renderDetail(f){
  detailEl.innerHTML=`
    <div class="detail-top">
      <div class="hero">
        <span class="kicker">${esc(f.focus)}</span>
        <h2 class="h2"><span class="emoji" aria-hidden="true">${f.emoji}</span>${esc(f.name)}</h2>
        <p class="copy">${esc(f.copy)}</p>
      </div>
      <div class="effect-card">
        <span class="e-label">Operativ effekt</span>
        <span class="e-title">${esc(f.effectTitle)}</span>
        <span class="e-copy">${esc(f.effectCopy)}</span>
      </div>
    </div>

    <div class="card body-card">
      <span class="sec-kicker">Aktiv funktion</span>
      <strong class="outcome">${esc(f.outcome)}</strong>
      <p class="detail-p">${esc(f.detail)}</p>
      <div class="body-acts">
        <button class="btn btn--primary">${esc(f.primary)}</button>
        <button class="btn">${esc(f.secondary)}</button>
      </div>
    </div>

    <div class="detail-notes">
      <div class="card note">
        <span class="sec-kicker">Varför den här ytan finns</span>
        <strong class="n-strong">Behåll power features nära operatören</strong>
        <p>${esc(WHY_COPY)}</p>
      </div>
      <div class="card note">
        <span class="sec-kicker">Nästa steg</span>
        <strong class="n-strong">${esc(f.nextTitle)}</strong>
        <p>${esc(f.nextCopy)}</p>
      </div>
    </div>`;
}

function select(key){
  const f=FEATURES.find(x=>x.key===key)||FEATURES[0];
  renderPills(f.key);
  renderDetail(f);
}

listEl.addEventListener('click',e=>{
  const b=e.target.closest('.feat');
  if(!b)return;
  select(b.dataset.key);
});

select(FEATURES[0].key);
</script>
