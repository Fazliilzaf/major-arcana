<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>CCO Makron — v3 responsiv</title>
    <style>
      /* ===== CCO AUX SHARED FOUNDATION — paste inside each prototype's <style> at the top =====
   WCAG-härdad varm palett (all text ≥4.5:1). rem/clamp + CSS Grid/flex. Touch ≥44px.
   Samma tokens/primitiver i alla aux-ytor → de hör ihop med varandra och resten av appen. */
      :root {
        --bg-page: #faf6f2;
        --bg-surface: #ffffff;
        --bg-sunken: #f3ece3;
        --bg-rail: #fbf7f2;
        --text-primary: #221c15;
        --text-secondary: #574d40;
        --text-tertiary: #6d6354;
        --accent: #b0356e;
        --accent-weak: #fdeef4;
        --accent-weak-bg: #fdeef4;
        --accent-strong: #8e285699;
        --text-on-accent: #ffffff;
        --success: #2f6f54;
        --success-bg: rgba(47, 111, 84, 0.14);
        --warning: #9a6410;
        --warning-bg: rgba(154, 100, 16, 0.16);
        --danger: #a83838;
        --danger-bg: rgba(168, 56, 56, 0.14);
        --info: #2f6595;
        --info-bg: rgba(47, 101, 149, 0.14);
        --violet: #6b31c9;
        --violet-bg: rgba(107, 49, 201, 0.12);
        --gold: #8a5f1e;
        --gold-bg: rgba(138, 95, 30, 0.14);
        --slate: #475569;
        --slate-bg: rgba(71, 85, 105, 0.12);
        --sh-sm: 0 1px 2px rgba(56, 40, 28, 0.06);
        --sh-md: 0 3px 10px rgba(56, 40, 28, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.86);
        --sh-lg: 0 8px 22px rgba(56, 40, 28, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.92);
        --sh-xl: 0 24px 56px rgba(93, 74, 60, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.55);
        --r-sm: 10px;
        --r-md: 14px;
        --r-lg: 18px;
        --r-xl: 24px;
        --r-pill: 999px;
        --fs-kicker: 0.6875rem;
        --fs-meta: 0.75rem;
        --fs-body: 0.875rem;
        --fs-card-title: clamp(0.9rem, 0.85rem+0.4vw, 1.05rem);
        --fs-h1: clamp(1.5rem, 1.2rem+2vw, 2.25rem);
        --fs-num: clamp(1.35rem, 1.1rem+1.4vw, 1.9rem);
        --tap: 2.75rem;
        --gap: clamp(0.5rem, 0.4rem+0.5vw, 0.85rem);
        --pad-x: clamp(0.875rem, 0.5rem+1.6vw, 1.5rem);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --maxw: 1500px;
        --error-text: #962b2b;
        --error-border: #d8526b;
        --error-bg: #fdecec;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html {
        font-size: 100%;
        overflow-x: clip;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        max-width: 100%;
      }
      body {
        background:
          radial-gradient(ellipse at 12% 0%, rgba(255, 225, 200, 0.4), transparent 38%),
          radial-gradient(ellipse at 88% 4%, rgba(255, 210, 225, 0.3), transparent 42%),
          var(--bg-page);
        color: var(--text-primary);
        font-family: -apple-system, 'SF Pro Display', Inter, system-ui, sans-serif;
        font-size: var(--fs-body);
        line-height: 1.45;
        min-height: 100vh;
        overflow-x: hidden;
      }
      button {
        font-family: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        border-radius: 6px;
      }
      .tabnum {
        font-variant-numeric: tabular-nums;
      }

      /* page wrapper — centrerad, max-bredd, plats för botnav på mobil */
      .aux {
        max-width: var(--maxw);
        margin-inline: auto;
        padding: 0 var(--pad-x) 6rem;
        min-height: 100vh;
      }
      @media (min-width: 1025px) {
        .aux {
          padding-bottom: 2rem;
        }
      }

      /* topbar (samma som Konversationer/Senare) */
      .topbar {
        position: sticky;
        top: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        gap: var(--gap);
        padding: 0.5rem var(--pad-x);
        padding-top: calc(0.5rem + env(safe-area-inset-top, 0px));
        margin: 0 calc(-1 * var(--pad-x));
        background: linear-gradient(
          180deg,
          rgba(250, 246, 242, 0.97),
          rgba(250, 246, 242, 0.82) 80%,
          transparent
        );
        backdrop-filter: blur(18px);
      }
      .brand {
        flex-shrink: 0;
        font-weight: 800;
        letter-spacing: 0.08em;
        padding: 0.4rem 0.7rem;
        border-radius: var(--r-pill);
        background: linear-gradient(180deg, #fdeef4, #f6cfdc);
        color: var(--accent);
      }
      .search {
        flex: 1;
        min-width: 0;
        position: relative;
        display: flex;
        align-items: center;
        height: var(--tap);
        border-radius: var(--r-md);
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid rgba(180, 165, 150, 0.35);
        box-shadow: var(--sh-sm);
        padding: 0 0.75rem 0 2.1rem;
      }
      .search svg {
        position: absolute;
        left: 0.7rem;
        width: 1rem;
        height: 1rem;
        color: var(--text-tertiary);
      }
      .search input {
        appearance: none;
        border: 0;
        background: transparent;
        width: 100%;
        height: 100%;
        font: inherit;
        font-size: var(--fs-meta);
        color: var(--text-primary);
        outline: none;
      }
      .icon-btn {
        flex-shrink: 0;
        width: var(--tap);
        height: var(--tap);
        border-radius: var(--r-md);
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid rgba(180, 165, 150, 0.35);
        box-shadow: var(--sh-sm);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--text-primary);
        cursor: pointer;
      }

      .icon-btn svg {
        width: 1.1rem;
        height: 1.1rem;
      }

      /* sidoräls-primitiver (v11 facit) */
      .rail-brand {
        font-weight: 800;
        letter-spacing: 0.08em;
        color: var(--accent);
        padding: 0.4rem 0.6rem;
      }
      .rail-nav {
        min-height: var(--tap);
        display: flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0 0.7rem;
        border-radius: var(--r-md);
        cursor: pointer;
        color: var(--text-secondary);
        font-weight: 700;
        font-size: var(--fs-meta);
        border: 0;
        background: transparent;
        text-align: left;
      }
      .rail-nav.is-active {
        background: var(--accent-weak-bg);
        color: var(--accent);
      }
      .rail-nav svg {
        width: 1.1rem;
        height: 1.1rem;
      }
      .rail-sec {
        font-size: var(--fs-kicker);
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--text-tertiary);
        margin: 1rem 0.7rem 0.3rem;
      }

      /* head-zon */
      .head {
        padding: 0.9rem 0 0.4rem;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: var(--gap);
        flex-wrap: wrap;
      }
      .head-main {
        min-width: 0;
      }
      .kicker {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        color: var(--text-tertiary);
        font-size: var(--fs-kicker);
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        margin-bottom: 0.25rem;
      }
      .h1 {
        margin: 0;
        font-size: var(--fs-h1);
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .subtitle {
        margin: 0.3rem 0 0;
        color: var(--text-secondary);
        font-size: var(--fs-meta);
        max-width: 46ch;
      }

      /* pill-rader (filter/period/segment) */
      .pillrow {
        display: flex;
        gap: 0.4rem;
        flex-wrap: wrap;
        align-items: center;
      }
      .pillrow.scroll {
        flex-wrap: nowrap;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .pillrow.scroll::-webkit-scrollbar {
        display: none;
      }
      .pill {
        flex-shrink: 0;
        min-height: 2.25rem;
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0 0.85rem;
        border-radius: var(--r-pill);
        border: 1px solid rgba(180, 165, 150, 0.3);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(244, 238, 232, 0.84));
        font-size: var(--fs-meta);
        font-weight: 700;
        box-shadow: var(--sh-sm);
        color: var(--text-secondary);
        cursor: pointer;
        white-space: nowrap;
      }
      .pill[aria-pressed='true'],
      .pill.is-active {
        background: linear-gradient(180deg, #fdeef4, #f6cfdc);
        color: var(--accent);
        border-color: rgba(176, 53, 110, 0.32);
      }
      .pill .c {
        background: rgba(180, 165, 150, 0.18);
        padding: 0.05rem 0.4rem;
        border-radius: var(--r-pill);
        font-size: var(--fs-kicker);
        font-weight: 800;
      }
      @media (pointer: coarse) {
        .pill {
          min-height: var(--tap);
        }
      }
      .pill .dot {
        width: 0.4rem;
        height: 0.4rem;
        border-radius: 999px;
      }
      .pill--success {
        color: var(--success);
      }
      .pill--success .dot {
        background: var(--success);
      }
      .pill--warning {
        color: var(--warning);
      }
      .pill--warning .dot {
        background: var(--warning);
      }
      .pill--info {
        color: var(--info);
      }
      .pill--info .dot {
        background: var(--info);
      }
      .pill--vip {
        background: linear-gradient(180deg, #fdeef4, #f6cfdc);
        color: var(--accent);
        border-color: rgba(176, 53, 110, 0.32);
      }
      .pill--vip .dot {
        background: var(--accent);
      }

      /* knappar */
      .btn {
        min-height: 2.5rem;
        padding: 0 1rem;
        border-radius: var(--r-pill);
        border: 1px solid rgba(180, 165, 150, 0.35);
        background: rgba(255, 255, 255, 0.85);
        font: inherit;
        font-size: var(--fs-meta);
        font-weight: 700;
        color: var(--text-primary);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        white-space: nowrap;
      }
      .btn--primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .btn--danger {
        background: var(--danger-bg);
        border-color: rgba(168, 56, 56, 0.3);
        color: var(--danger);
      }
      @media (pointer: coarse) {
        .btn {
          min-height: var(--tap);
        }
      }

      /* kort & paneler */
      .card {
        position: relative;
        cursor: pointer;
        padding: 1rem;
        border-radius: var(--r-lg);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.94), rgba(247, 241, 236, 0.86));
        border: 1px solid rgba(180, 165, 150, 0.25);
        box-shadow: var(--sh-md);
        transition:
          transform 0.12s ease,
          box-shadow 0.12s ease,
          border-color 0.12s ease;
      }
      .card:hover {
        box-shadow: var(--sh-lg);
        border-color: rgba(176, 53, 110, 0.25);
      }
      .card:active {
        transform: scale(0.99);
      }
      .card.is-selected {
        border-color: var(--accent);
        box-shadow:
          0 0 0 2px rgba(176, 53, 110, 0.25),
          var(--sh-md);
      }
      .card.is-open {
        border-color: var(--accent);
      }
      .panel {
        padding: 1.1rem;
        border-radius: var(--r-xl);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.95), rgba(247, 241, 236, 0.88));
        border: 1px solid rgba(180, 165, 150, 0.25);
        box-shadow: var(--sh-md);
      }
      .panel-head {
        margin-bottom: 0.7rem;
      }
      .panel-head h2 {
        margin: 0;
        font-size: 0.95rem;
        font-weight: 800;
        letter-spacing: -0.01em;
      }
      .panel-head p {
        margin: 0.2rem 0 0;
        color: var(--text-tertiary);
        font-size: var(--fs-meta);
      }
      .sec-kicker {
        font-size: var(--fs-kicker);
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--text-tertiary);
      }

      /* metric-kort (KPI) */
      .metric {
        padding: 0.9rem 1rem;
        border-radius: var(--r-lg);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.94), rgba(247, 241, 236, 0.84));
        border: 1px solid rgba(180, 165, 150, 0.25);
        box-shadow: var(--sh-sm);
      }
      .metric .m-label {
        font-size: var(--fs-kicker);
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--text-tertiary);
      }
      .metric .m-val {
        font-size: var(--fs-num);
        font-weight: 800;
        letter-spacing: -0.02em;
        margin-top: 0.15rem;
        line-height: 1.05;
      }
      .metric .m-meta {
        font-size: var(--fs-kicker);
        color: var(--text-tertiary);
        margin-top: 0.25rem;
      }
      .metric .m-trend {
        font-size: var(--fs-kicker);
        font-weight: 800;
      }
      .m-trend--up {
        color: var(--success);
      }
      .m-trend--down {
        color: var(--danger);
      }
      .metric--green {
        border-left: 3px solid var(--success);
      }
      .metric--blue {
        border-left: 3px solid var(--info);
      }
      .metric--rose {
        border-left: 3px solid var(--accent);
      }
      .metric--violet {
        border-left: 3px solid var(--violet);
      }
      .metric--gold {
        border-left: 3px solid var(--gold);
      }
      .metric--slate {
        border-left: 3px solid var(--slate);
      }

      /* switch — 44px träffyta via track-storlek */
      .switch {
        position: relative;
        flex-shrink: 0;
        width: 3rem;
        height: var(--tap);
        cursor: pointer;
      }
      .switch input {
        position: absolute;
        inset: 0;
        opacity: 0;
        margin: 0;
        cursor: pointer;
      }
      .switch .track {
        position: absolute;
        top: 50%;
        left: 0;
        transform: translateY(-50%);
        width: 3rem;
        height: 1.6rem;
        border-radius: 999px;
        background: rgba(120, 108, 95, 0.32);
        transition: background 0.2s;
      }
      .switch .track::after {
        content: '';
        position: absolute;
        top: 2px;
        left: 2px;
        width: 1.2rem;
        height: 1.2rem;
        border-radius: 50%;
        background: #fff;
        box-shadow: var(--sh-sm);
        transition: transform 0.2s;
      }
      .switch input:checked + .track {
        background: var(--success);
      }
      .switch input:checked + .track::after {
        transform: translateX(1.4rem);
      }
      .switch input:focus-visible + .track {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      /* bottom-nav (samma som Konversationer/Senare-prototyperna) — döljs ≥601 */
      .botnav {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 60;
        display: flex;
        align-items: center;
        justify-content: space-around;
        gap: 0.25rem;
        padding: 0.5rem 0.75rem calc(0.5rem + var(--safe-bottom));
        background: linear-gradient(180deg, rgba(250, 246, 242, 0), rgba(250, 246, 242, 0.94) 30%);
        backdrop-filter: blur(20px);
      }
      .nav-i {
        flex: 1;
        min-height: var(--tap);
        border: 0;
        background: transparent;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.1rem;
        color: var(--text-tertiary);
        font-size: var(--fs-kicker);
        font-weight: 700;
        text-transform: uppercase;
      }
      .nav-i svg {
        width: 1.35rem;
        height: 1.35rem;
      }
      .nav-i.is-active {
        color: var(--accent);
      }
      /* lekfull bottom-nav — duoton-ikoner, per-flik-färg, studs + sväv + badge */
      .nav-i {
        gap: 0.2rem;
        transition: color 0.2s;
        position: relative;
      }
      .nav-i .ic-wrap {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 3.1rem;
        height: 1.9rem;
        border-radius: var(--r-pill);
        transition:
          background 0.25s,
          box-shadow 0.25s,
          transform 0.25s;
      }
      .nav-i .ic {
        width: 1.5rem;
        height: 1.5rem;
        transition: transform 0.2s;
      }
      .nav-i .ic-fill {
        fill: currentColor;
        opacity: 0.24;
        transition:
          fill 0.2s,
          opacity 0.2s;
      }
      .nav-i .ic-line {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .nav-i .ic-dot {
        fill: currentColor;
      }
      @media (hover: hover) {
        .nav-i:not(.is-active):hover .ic {
          transform: translateY(-2px) rotate(-6deg);
        }
        .nav-i:not(.is-active):hover .ic-wrap {
          background: rgba(176, 53, 110, 0.08);
        }
      }
      .nav-i:active .ic {
        transform: scale(0.84);
      }
      .nav-i.is-active {
        color: var(--ic, var(--accent));
      }
      .nav-i.is-active .ic-wrap {
        background: var(--ic-bg, var(--accent-weak));
        box-shadow: 0 7px 16px -6px var(--ic, var(--accent));
        animation: navfloat 2.8s ease-in-out infinite;
      }
      .nav-i.is-active .ic {
        animation: navpop 0.46s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .nav-i.is-active .ic-fill {
        opacity: 1;
        fill: var(--ic, var(--accent));
      }
      .nav-i.is-active .ic-line {
        stroke: #fff;
      }
      .nav-i.is-active .ic-dot {
        fill: #fff;
      }
      .nav-badge {
        position: absolute;
        top: -0.15rem;
        right: 0.4rem;
        min-width: 1rem;
        height: 1rem;
        padding: 0 0.25rem;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        font-size: 0.5625rem;
        font-weight: 800;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 0 2px var(--bg-page);
      }
      @keyframes navpop {
        0% {
          transform: scale(0.55);
        }
        55% {
          transform: scale(1.2);
        }
        100% {
          transform: scale(1);
        }
      }
      @keyframes navfloat {
        0%,
        100% {
          transform: translateY(-3px);
        }
        50% {
          transform: translateY(-6px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .nav-i .ic,
        .nav-i .ic-wrap {
          animation: none !important;
        }
      }
      @media (min-width: 601px) {
        .botnav {
          display: none;
        }
        .aux {
          padding-bottom: 2rem;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }

      /* ===== MAKRON-SPECIFIK STYLING (bygger på primitiverna ovan) ===== */

      /* metric-rad — mobil: horisontellt scrollbar; ≥601: 3-up */
      .metrics {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: var(--gap);
        margin: 0.6rem 0 0.2rem;
      }
      @media (max-width: 600px) {
        .metrics {
          grid-auto-flow: column;
          grid-auto-columns: minmax(8.5rem, 1fr);
          grid-template-columns: none;
          overflow-x: auto;
          scroll-snap-type: x mandatory;
          scrollbar-width: none;
          margin-inline: calc(-1 * var(--pad-x));
          padding-inline: var(--pad-x);
        }
        .metrics::-webkit-scrollbar {
          display: none;
        }
        .metric {
          scroll-snap-align: start;
        }
      }

      /* makro-grid — auto-fit, 1-kol mobil → 2-3-up desktop */
      .macro-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(18rem, 1fr));
        gap: var(--gap);
        margin: 1rem 0 0.2rem;
      }
      @media (max-width: 600px) {
        .macro-grid {
          grid-template-columns: 1fr;
        }
      }

      /* makro-kort */
      .macro {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 0.55rem;
        padding: 1rem;
        border-radius: var(--r-lg);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.95), rgba(247, 241, 236, 0.86));
        border: 1px solid rgba(180, 165, 150, 0.25);
        border-left-width: 4px;
        box-shadow: var(--sh-md);
        min-width: 0;
      }
      .macro--violet {
        border-left-color: var(--violet);
      }
      .macro--blue {
        border-left-color: var(--info);
      }
      .macro--green {
        border-left-color: var(--success);
      }
      .macro-label {
        font-size: var(--fs-kicker);
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--text-tertiary);
      }
      .macro--violet .macro-label {
        color: var(--violet);
      }
      .macro--blue .macro-label {
        color: var(--info);
      }
      .macro--green .macro-label {
        color: var(--success);
      }
      .macro-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 0.5rem;
      }
      .macro-title {
        margin: 0;
        font-size: 0.95rem;
        font-weight: 800;
        letter-spacing: -0.01em;
        color: var(--text-primary);
        min-width: 0;
      }
      .steg-chip {
        flex-shrink: 0;
        padding: 0.1rem 0.5rem;
        border-radius: var(--r-pill);
        font-size: var(--fs-kicker);
        font-weight: 800;
        background: rgba(180, 165, 150, 0.18);
        color: var(--text-secondary);
        white-space: nowrap;
      }
      .macro-desc {
        margin: 0;
        font-size: var(--fs-meta);
        color: var(--text-secondary);
      }
      .macro-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 0.3rem;
      }
      .mchip {
        padding: 0.1rem 0.5rem;
        border-radius: var(--r-pill);
        font-size: var(--fs-kicker);
        font-weight: 800;
      }
      .mchip--mode-violet {
        background: var(--violet-bg);
        color: var(--violet);
      }
      .mchip--mode-blue {
        background: var(--info-bg);
        color: var(--info);
      }
      .mchip--mode-green {
        background: var(--success-bg);
        color: var(--success);
      }
      .mchip--tone {
        background: rgba(180, 165, 150, 0.16);
        color: var(--text-secondary);
      }
      .macro-foot {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        margin-top: auto;
        padding-top: 0.55rem;
        box-shadow: inset 0 1px 0 rgba(180, 165, 150, 0.28);
      }
      .macro-foot .btn {
        flex: 1 1 auto;
        justify-content: center;
        padding: 0 0.7rem;
      }

      /* desktop ≥1025: håll korten 2-3-up via maxw + auto-fit redan ovan */

      /* ===== STATUS-BAR ===== */
      .macro-status {
        margin: 0.5rem 0 0.2rem;
        padding: 0.45rem 0.85rem;
        border-radius: var(--r-md);
        font-size: var(--fs-meta);
        font-weight: 700;
      }
      .macro-status[hidden] {
        display: none;
      }
      .macro-status--success {
        background: var(--success-bg);
        color: var(--success);
      }
      .macro-status--error {
        background: var(--danger-bg);
        color: var(--danger);
      }
      .macro-status--warn {
        background: var(--warning-bg);
        color: var(--warning);
      }

      /* ===== EMPTY STATE ===== */
      .macro-empty {
        padding: 1.6rem 0.5rem;
        text-align: center;
        color: var(--text-tertiary);
        font-size: var(--fs-meta);
      }

      /* ===== MODAL ===== */
      .macro-modal {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: var(--pad-x);
        background: rgba(34, 28, 21, 0.5);
        backdrop-filter: blur(6px);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.18s;
      }
      .macro-modal.is-open {
        opacity: 1;
        pointer-events: auto;
      }
      .macro-modal-box {
        width: 100%;
        max-width: 28rem;
        background: var(--bg-surface);
        border-radius: var(--r-xl);
        box-shadow: var(--sh-xl);
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .macro-modal-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
      }
      .macro-modal-title {
        margin: 0;
        font-size: 1.05rem;
        font-weight: 800;
        letter-spacing: -0.01em;
      }
      .macro-modal-form {
        display: flex;
        flex-direction: column;
        gap: 0.85rem;
      }
      .macro-field {
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
        font-size: var(--fs-meta);
        font-weight: 700;
        color: var(--text-secondary);
      }
      .macro-field input,
      .macro-field textarea,
      .macro-field select {
        padding: 0.6rem 0.8rem;
        border-radius: var(--r-md);
        border: 1px solid rgba(180, 165, 150, 0.4);
        background: var(--bg-sunken);
        font: inherit;
        font-size: var(--fs-body);
        color: var(--text-primary);
        outline: none;
        resize: vertical;
      }
      .macro-field input:focus,
      .macro-field textarea:focus,
      .macro-field select:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px rgba(176, 53, 110, 0.18);
      }
      .macro-modal-actions {
        display: flex;
        gap: 0.5rem;
        justify-content: flex-end;
        padding-top: 0.25rem;
      }
      .modal-feedback {
        font-size: var(--fs-meta);
        font-weight: 700;
        padding: 0.4rem 0.65rem;
        border-radius: var(--r-md);
      }
      .modal-feedback[hidden] {
        display: none;
      }
      .modal-feedback--error {
        background: var(--danger-bg);
        color: var(--danger);
      }
      .modal-feedback--success {
        background: var(--success-bg);
        color: var(--success);
      }
      /* CCO unified navigation */
      .cco-top-nav {
        display: flex;

          Inter,

      .cco-top-nav a {

      }
      .cco-top-nav a:hover {

        color: #bb4779;

      .cco-top-nav a.is-demo::after {

    </style>
  </head>

    <script>
      // ===== Fallback library (shown when API is unreachable) =====
      const FALLBACK_MACROS = [
        {
          id: 'pricing-followup',
          title: 'Pris & finansieringsspår',
          mode: 'Manuell',
          steg: 3,
          tone: 'violet',
          desc: 'Fyller svarsutkastet med prissteg, delbetalning och nästa tydliga drag.',
          modeLabel: 'Manuell körning',
        },
        {
          id: 'vip-recovery',
          title: 'VIP återhämtning',
          mode: 'Auto',
          steg: 2,
          tone: 'blue',
          desc: 'Aktiveras när en VIP-tråd närmar sig SLA-brott och öppnar rätt studioflöde direkt.',
          modeLabel: 'Auto-körning',
        },
        {
          id: 'post-treatment',
          title: 'Eftervårdssteg',
          mode: 'Manuell',
          steg: 3,
          tone: 'green',
          desc: 'Skapar anteckning, schemalägger uppföljning och markerar kundhistorik med rätt behandlingsspår.',
          modeLabel: 'Manuell körning',
        },
      ];

      // ===== State =====
      let MACROS = [];

      // ===== API helpers =====
      const TONE_BY_TYPE = {
        template: 'violet',
        tag: 'rose',
        assign: 'blue',
        snooze: 'gold',
        sla: 'red',
        archive: 'green',
      };

      function toneFor(record) {
        const t = record.actions && record.actions[0] && record.actions[0].type;
        return TONE_BY_TYPE[t] || (record.trigger === 'auto' ? 'blue' : 'violet');
      }

      function recordToCard(record) {
        const trigger = record.trigger === 'auto' ? 'auto' : 'manual';
        return {
          id: record.id,
          title: record.name,
          mode: trigger === 'auto' ? 'Auto' : 'Manuell',
          steg: Math.max(1, (record.actions || []).length),
          tone: toneFor(record),
          desc: record.description || 'Makrot är redo att köras i arbetsytan.',
          modeLabel: trigger === 'auto' ? 'Auto-körning' : 'Manuell körning',
          _raw: record,
        };
      }

      function ikey(tag) {
        return 'mkrn-' + tag + '-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7);
      }

      async function apiFetch(path, opts) {
        opts = opts || {};
        var headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
        var res = await fetch('/api/v1' + path, Object.assign({}, opts, { headers: headers }));
        if (!res.ok) {
          var err = new Error(res.status + ' ' + res.statusText);
          err.status = res.status;
          throw err;
        }
        return res.json();
      }

      // ===== DOM refs =====
      var grid = document.getElementById('macroGrid');
      var statusBar = document.getElementById('macroStatus');
      var modal = document.getElementById('macroModal');
      var modalTitle = document.getElementById('macroModalTitle');
      var modalName = document.getElementById('macroModalName');
      var modalDesc = document.getElementById('macroModalDesc');
      var modalTrigger = document.getElementById('macroModalTrigger');
      var modalFeedback = document.getElementById('macroModalFeedback');
      var modalSubmit = document.getElementById('macroModalSubmit');
      var editingId = null;

      var esc = function (s) {
        return String(s).replace(/[&<>"]/g, function (m) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m];
        });
      };

      // ===== Status bar =====
      function setStatus(msg, type) {
        statusBar.textContent = msg || '';
        statusBar.className = 'macro-status' + (type ? ' macro-status--' + type : '');
        statusBar.hidden = !msg;
      }

      // ===== Render =====
      function card(m) {
        return (
          '<article class="macro macro--' +
          esc(m.tone) +
          '" data-id="' +
          esc(m.id) +
          '">' +
          '<span class="macro-label">' +
          esc(m.mode) +
          '</span>' +
          '<div class="macro-head"><h2 class="macro-title">' +
          esc(m.title) +
          '</h2><span class="steg-chip">' +
          esc(m.steg) +
          ' steg</span></div>' +
          '<p class="macro-desc">' +
          esc(m.desc) +
          '</p>' +
          '<div class="macro-chips">' +
          '<span class="mchip mchip--mode-' +
          esc(m.tone) +
          '">' +
          esc(m.modeLabel) +
          '</span>' +
          '<span class="mchip mchip--tone">Standard</span>' +
          '</div>' +
          '<div class="macro-foot">' +
          '<button class="btn" data-act="run">Kör</button>' +
          '<button class="btn" data-act="open">Öppna</button>' +
          '<button class="btn" data-act="edit">Redigera</button>' +
          '<button class="btn btn--danger" data-act="delete">Radera</button>' +
          '</div></article>'
        );
      }

      function render() {
        grid.innerHTML = MACROS.length
          ? MACROS.map(card).join('')
          : '<div class="macro-empty">Inga makron ännu — skapa ditt första.</div>';
        updateStats();
      }

      function updateStats() {
        var active = MACROS.filter(function (m) {
          return m.mode !== 'Auto';
        }).length;
        var auto = MACROS.filter(function (m) {
          return m.mode === 'Auto';
        }).length;
        var steps = MACROS.reduce(function (s, m) {
          return s + m.steg;
        }, 0);
        document.getElementById('statActive').textContent = active;
        document.getElementById('statAuto').textContent = auto;
        document.getElementById('statSteps').textContent = steps;
      }

      // ===== Load from API =====
      async function loadMacros() {
        try {
          var payload = await apiFetch('/cco/macros');
          var records = (payload && payload.macros) || [];
          MACROS = records.length ? records.map(recordToCard) : FALLBACK_MACROS.slice();
        } catch (err) {
          MACROS = FALLBACK_MACROS.slice();
          if (err.status === 401 || err.status === 403) {
            setStatus('Inloggning krävs för makrobiblioteket.', 'error');
          }
        }
        render();
      }

      // ===== Modal =====
      function openModal(mode, macro) {
        editingId = mode === 'edit' && macro ? macro.id : null;
        modalTitle.textContent = mode === 'edit' ? 'Redigera makro' : 'Skapa makro';
        modalSubmit.textContent = mode === 'edit' ? 'Spara ändringar' : 'Spara makro';
        modalName.value = (macro && macro.title) || '';
        modalDesc.value = (macro && macro.desc) || '';
        modalTrigger.value = macro && macro.mode === 'Auto' ? 'auto' : 'manual';
        modalFeedback.hidden = true;
        modalFeedback.textContent = '';
        modal.classList.add('is-open');
        modal.setAttribute('aria-hidden', 'false');
        modalName.focus();
      }

      function closeModal() {
        modal.classList.remove('is-open');
        modal.setAttribute('aria-hidden', 'true');
        editingId = null;
      }

      function setModalFeedback(msg, type) {
        modalFeedback.textContent = msg || '';
        modalFeedback.className = 'modal-feedback' + (type ? ' modal-feedback--' + type : '');
        modalFeedback.hidden = !msg;
      }

      document.getElementById('macroModalClose').addEventListener('click', closeModal);
      document.getElementById('macroModalCancel').addEventListener('click', closeModal);
      modal.addEventListener('click', function (e) {
        if (e.target === modal) closeModal();
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && modal.classList.contains('is-open')) closeModal();
      });

      // ===== Modal submit =====
      document.getElementById('macroModalForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        var name = modalName.value.trim();
        if (!name) {
          setModalFeedback('Makronamn krävs.', 'error');
          modalName.focus();
          return;
        }
        var trigger = modalTrigger.value;
        var body = {
          name: name,
          description: modalDesc.value.trim(),
          trigger: trigger,
          actions: editingId
            ? (
                MACROS.find(function (m) {
                  return m.id === editingId;
                }) || {}
              )._raw
              ? MACROS.find(function (m) {
                  return m.id === editingId;
                })._raw.actions || [{ type: 'template', config: {} }]
              : [{ type: 'template', config: {} }]
            : [{ type: 'template', config: {} }],
        };

        modalSubmit.disabled = true;
        modalSubmit.textContent = editingId ? 'Sparar…' : 'Skapar…';
        setModalFeedback('', '');

        try {
          if (editingId) {
            var payload = await apiFetch('/cco/macros/' + encodeURIComponent(editingId), {
              method: 'PUT',
              body: JSON.stringify(body),
              headers: { 'x-idempotency-key': ikey('edit') },
            });
            var updated = recordToCard(payload.macro);
            MACROS = MACROS.map(function (m) {
              return m.id === editingId ? updated : m;
            });
            setStatus('Makrot "' + updated.title + '" uppdaterades.', 'success');
          } else {
            var payload = await apiFetch('/cco/macros', {
              method: 'POST',
              body: JSON.stringify(body),
              headers: { 'x-idempotency-key': ikey('create') },
            });
            MACROS.push(recordToCard(payload.macro));
            setStatus('Makrot "' + payload.macro.name + '" skapades.', 'success');
          }
          closeModal();
          render();
        } catch (err) {
          setModalFeedback(err.message || 'Kunde inte spara makrot.', 'error');
        } finally {
          modalSubmit.disabled = false;
          modalSubmit.textContent = editingId ? 'Spara ändringar' : 'Spara makro';
        }
      });

      // ===== Create button =====
      document.getElementById('createMacro').addEventListener('click', function () {
        openModal('create', null);
      });

      // ===== Grid action handler =====
      grid.addEventListener('click', async function (e) {
        var btn = e.target.closest('button[data-act]');
        if (!btn) return;
        var art = btn.closest('.macro');
        if (!art) return;
        var id = art.dataset.id;
        var macro = MACROS.find(function (m) {
          return m.id === id;
        });
        if (!macro) return;
        var act = btn.dataset.act;

        if (act === 'edit') {
          openModal('edit', macro);
          return;
        }

        if (act === 'open') {
          setStatus('Makrot "' + macro.title + '" är redo i automationsbyggaren.', 'success');
          return;
        }

        if (act === 'delete') {
          if (!window.confirm('Radera makrot "' + macro.title + '"?')) return;
          btn.disabled = true;
          try {
            await apiFetch('/cco/macros/' + encodeURIComponent(id), {
              method: 'DELETE',
              headers: { 'x-idempotency-key': ikey('del') },
            });
            MACROS = MACROS.filter(function (m) {
              return m.id !== id;
            });
            render();
            setStatus('Makrot "' + macro.title + '" raderades.', 'success');
          } catch (err) {
            setStatus(err.message || 'Kunde inte radera makrot.', 'error');
            btn.disabled = false;
          }
          return;
        }

        if (act === 'run') {
          if (btn.dataset.busy) return;
          btn.dataset.busy = '1';
          btn.disabled = true;
          var orig = btn.textContent;
          btn.textContent = 'Kör…';
          try {
            var payload = await apiFetch('/cco/macros/' + encodeURIComponent(id) + '/run', {
              method: 'POST',
              headers: { 'x-idempotency-key': ikey('run') },
            });
            if (payload && payload.macro) {
              var updated = recordToCard(payload.macro);
              MACROS = MACROS.map(function (m) {
                return m.id === id ? updated : m;
              });
              render();
            }
            setStatus('Makrot "' + macro.title + '" kördes.', 'success');
          } catch (err) {
            setStatus(err.message || 'Kunde inte köra makrot.', 'error');
          } finally {
            btn.disabled = false;
            btn.textContent = orig;
            delete btn.dataset.busy;
          }
          return;
        }
      });

      // ===== Init =====
      loadMacros();
    </script>
    <script>
      (function () {
        var nav = document.querySelector('.botnav');
        if (!nav) return;
        nav.addEventListener('click', function (e) {
          var b = e.target.closest('.nav-i');
          if (!b) return;
          nav.querySelectorAll('.nav-i').forEach(function (x) {
            x.classList.remove('is-active');
            x.removeAttribute('aria-current');
          });
          void b.offsetWidth;
          b.classList.add('is-active');
          b.setAttribute('aria-current', 'page');
        });
      })();
    </script>
  </body>
</html>
