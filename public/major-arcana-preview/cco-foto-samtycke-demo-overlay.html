<!doctype html>
<html lang="sv" data-v9-enabled="on" data-v9-demo="on">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Steg 9 — Foto-samtycke · UAT</title>
    <link rel="stylesheet" href="/cco-polish.css" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(ellipse at 50% 0%, rgba(255, 210, 225, 0.35), transparent 45%), #faf6f2;
        font-family: Inter, system-ui, sans-serif;
      }
      #uat-shell {
        width: 100%;
        max-width: 420px;
        margin: 48px 24px;
        padding: 40px 32px;
        text-align: center;
        color: rgba(70, 60, 50, 0.55);
        font-size: 15px;
        line-height: 1.45;
        background: rgba(252, 248, 244, 0.92);
        border: 1px solid rgba(120, 105, 90, 0.16);
        border-radius: 20px;
        box-shadow:
          0 8px 24px rgba(70, 50, 30, 0.08),
          0 2px 6px rgba(70, 50, 30, 0.05),
          inset 0 1px 0 rgba(255, 255, 255, 0.55);
      }
      #uat-shell strong {
        display: block;
        color: #2b251f;
        font-size: 22px;
        font-weight: 700;
        line-height: 1.15;
        margin-bottom: 12px;
      }
      #uat-shell::after {
        content: '';
        display: inline-block;
        width: 20px;
        height: 20px;
        margin-top: 16px;
        border-radius: 999px;
        border: 2px solid rgba(200, 130, 30, 0.2);
        border-top-color: #c8821e;
        animation: uat-spin 0.9s linear infinite;
      }
      @keyframes uat-spin {
        to {
          transform: rotate(360deg);
        }
      }
      #uat-error {
        color: #b94a4a;
        margin-top: 12px;
      }
    </style>
    <script src="/cco-polish.js" defer></script>
    <script
      src="/major-arcana-preview/app/cco-step-modal-design.js?v=hairtp-step789-kundkort-v5"

      defer
    ></script>
  </head>

      <div id="uat-error" hidden></div>
