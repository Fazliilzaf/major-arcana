<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CCO · Skicka mall med variabler</title>
    <style>
      /* Samma tokens som hela CCO (design-tokens.css) — kräm bakgrund, vita ytor, grön accent. */
      :root {
        --cco-bg-page: #fbf7f1;
        --cco-bg-surface: #ffffff;
        --cco-bg-surface-sunken: #f5efe6;
        --cco-color-brand: #2b251f;
        --cco-color-brand-soft: #4a4036;
        --cco-color-accent: #4a8268;
        --cco-color-accent-soft: #6fa68a;
        --cco-color-accent-strong: #2e5a47;
        --cco-text-primary: #2b251f;
        --cco-text-secondary: #5d544a;
        --cco-text-tertiary: #8a8174;
        --cco-text-on-accent: #ffffff;
        --cco-border-subtle: rgba(43, 37, 31, 0.08);
        --cco-border-default: rgba(43, 37, 31, 0.15);
        --cco-border-strong: rgba(43, 37, 31, 0.3);
        --cco-status-success: #4a8268;
        --cco-status-success-bg: rgba(74, 130, 104, 0.12);
        --cco-status-warning: #c8821e;
        --cco-status-warning-bg: rgba(200, 130, 30, 0.12);
        --cco-status-danger: #b94a4a;
        --cco-status-danger-bg: rgba(185, 74, 74, 0.12);
        --cco-status-info: #4a7ba8;
        --cco-status-info-bg: rgba(74, 123, 168, 0.12);
        --cco-shadow-md: 0 4px 8px rgba(43, 37, 31, 0.08), 0 2px 4px rgba(43, 37, 31, 0.04);
        --cco-shadow-sm: 0 1px 3px rgba(43, 37, 31, 0.08), 0 1px 2px rgba(43, 37, 31, 0.04);
        --cco-focus-ring: #4a8268;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 28px;
        background: var(--cco-bg-page);
        color: var(--cco-text-primary);
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        line-height: 1.45;
      }
      .wrap {
        max-width: 980px;
        margin: 0 auto;
      }
      h1 {
        font-size: 22px;
        font-weight: 700;
        color: var(--cco-color-brand);
        margin: 0 0 4px;
      }
      .sub {
        color: var(--cco-text-secondary);
        margin: 0 0 18px;
        font-size: 14px;
      }
      .panel {
        background: var(--cco-bg-surface);
        border: 1px solid var(--cco-border-default);
        border-radius: 14px;
        box-shadow: var(--cco-shadow-md);
        padding: 20px;
        margin-bottom: 16px;
      }
      label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        margin: 12px 0 4px;
        color: var(--cco-text-secondary);
      }
      input,
      select,
      textarea {
        width: 100%;
        padding: 10px 11px;
        border: 1px solid var(--cco-border-default);
        border-radius: 10px;
        background: #fff;
        color: var(--cco-text-primary);
        font-size: 14px;
      }
      input:focus,
      select:focus,
      textarea:focus {
        outline: 2px solid var(--cco-color-accent);
        border-color: var(--cco-color-accent);
      }
      textarea {
        min-height: 120px;
        resize: vertical;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .btn {
        display: inline-block;
        border: 0;
        border-radius: 10px;
        padding: 10px 18px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        background: var(--cco-color-accent);
        color: var(--cco-text-on-accent);
        box-shadow: var(--cco-shadow-sm);
      }
      .btn:hover {
        background: var(--cco-color-accent-strong);
      }
      .btn.secondary {
        background: var(--cco-bg-surface-sunken);
        color: var(--cco-color-brand);
        border: 1px solid var(--cco-border-default);
        box-shadow: none;
      }
      .btn.secondary:hover {
        background: #eee5d8;
      }
      .btn[disabled] {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .var {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 7px 0;
        font-size: 13px;
      }
      .var.auto {
        color: var(--cco-text-tertiary);
      }
      .var input {
        flex: 1;
      }
      .chip {
        border-radius: 6px;
        padding: 2px 8px;
        font-size: 11px;
        font-weight: 600;
        display: inline-block;
      }
      .c-auto {
        background: var(--cco-status-success-bg);
        color: var(--cco-status-success);
      }
      .c-man {
        background: var(--cco-status-warning-bg);
        color: var(--cco-status-warning);
      }
      #preview {
        border: 1px solid var(--cco-border-default);
        border-radius: 12px;
        padding: 16px;
        background: var(--cco-bg-surface-sunken);
        min-height: 90px;
      }
      #preview b {
        display: block;
        margin-bottom: 8px;
        color: var(--cco-color-brand);
      }
      #missing {
        color: var(--cco-status-danger);
        font-weight: 600;
        margin-top: 10px;
      }
      .tag {
        font-size: 12px;
        color: var(--cco-text-tertiary);
      }
      .note {
        background: var(--cco-status-info-bg);
        color: #2f5d80;
        border-radius: 10px;
        padding: 12px 14px;
        font-size: 13.5px;
        margin-bottom: 16px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Skicka mall med variabler</h1>
      <p class="sub">
        Välj mall → ✨ AI-förslag → ändra → fyll variabler → skicka (dry-run). Ingen ofylld variabel
        går ut.
      </p>

      <div class="note">
        Skicka alltid i <b>dry-run</b> (CCO_SEND_LIVE osatt) — ingen skarp sändning förrän du
        aktiverar det.
      </div>

      <div class="panel">
        <div class="row">
          <div>
            <label>Mall</label
            ><select id="tpl"></select>
          </div>
          <div>
            <label>Kundnamn (→ {{firstName}})</label
            ><input id="customerName" placeholder="Anna Andersson" />
          </div>
        </div>
        <div class="row">
          <div>
            <label>Behandling (→ {{treatment}})</label
            ><select id="treatment"></select>
          </div>
          <div>
            <label>E-post</label><input id="customerEmail" placeholder="anna@example.com" />
          </div>
        </div>
        <div style="margin-top: 14px">
          <button class="btn secondary" id="aiBtn">✨ AI-förslag</button>
          <span class="tag">Fyller mallens egna variabler — du kan ändra</span>
        </div>
      </div>

      <div class="panel">
        <label>Ämne (redigerbart)</label><input id="subject" /> <label>Brödtext (redigerbart)</label
        ><textarea id="body"></textarea>
        <div id="manualVars" style="margin-top: 10px"></div>
      </div>

      <div class="panel">
        <label>Förhandsvisning</label>
        <div id="preview">—</div>
        <div id="missing"></div>
        <div style="margin-top: 14px">
          <button class="btn" id="send">Skicka (dry-run)</button>
          <span id="status" class="tag"></span>
        </div>
      </div>
    </div>

    <script>
      const HDR = { 'Content-Type': 'application/json', 'x-cco-role': 'owner' };
      async function api(path, opts) {
        const r = await fetch('/api/v1' + path, {
          ...opts,
          headers: { ...HDR, ...(opts?.headers || {}) },
        });
        return r.json();
      }
      function $(id) {
        return document.getElementById(id);
      }
      function esc(s) {
        return String(s || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }
      const TREAT = [
        ['hair_tp', 'FUE (hårtransplantation)', 'hårtransplantation'],
        ['hair_tp', 'DHI (hårtransplantation)', 'hårtransplantation'],
        ['beard', 'Skäggtransplantation', 'skäggtransplantation'],
        ['eyebrow', 'Ögonbrynstransplantation', 'ögonbrynstransplantation'],
        ['hair_tp', 'PRP hår', 'PRP hår'],
        ['curatiio', 'botulinumtoxin', 'botox'],
      ];
      async function loadTemplates() {
        const d = await api('/cco-templates?type=followup');
        const tpl = $('tpl');
        tpl.innerHTML = '';
        (d.templates || [])
          .sort((a, b) => a.id.localeCompare(b.id))
          .forEach((t) => {
            const o = document.createElement('option');
            o.value = t.id;
            o.textContent = t.id;
            tpl.appendChild(o);
          });
        const t = $('treatment');
        TREAT.forEach((r) => {
          const o = document.createElement('option');
          o.value = r[0] + '::' + r[2];
          o.textContent = r[1];
          t.appendChild(o);
        });
        onTemplateChange();
      }
      async function loadVars() {
        const id = $('tpl').value;
        if (!id) return;
        const d = await api('/cco-templates/' + id + '/variables');
        const box = $('manualVars');
        box.innerHTML = '<label style="margin-top:14px">Variabler</label>';
        (d.variables || []).forEach((v) => {
          const div = document.createElement('div');
          div.className = 'var' + (v.autoFillable ? ' auto' : '');
          div.innerHTML =
            '<span>' +
            esc(v.name) +
            '</span><span class="chip ' +
            (v.autoFillable ? 'c-auto' : 'c-man') +
            '">' +
            (v.autoFillable ? 'auto' : 'manuell') +
            '</span>';
          if (!v.autoFillable) {
            const i = document.createElement('input');
            i.dataset.var = v.name;
            i.placeholder = v.name;
            div.appendChild(i);
          }
          box.appendChild(div);
        });
        render();
      }
      function mergedVariables() {
        const v = {};
        document.querySelectorAll('#manualVars input[data-var]').forEach((i) => {
          v[i.dataset.var] = i.value;
        });
        return v;
      }
      async function render() {
        const id = $('tpl').value;
        const d = await api('/cco-send/render', {
          method: 'POST',
          body: JSON.stringify({
            templateId: id,
            customerName: $('customerName').value,
            treatmentLabel: $('treatment').value.split('::')[1] || '',
            treatmentKey: $('treatment').value.split('::')[0] || '',
            customerEmail: $('customerEmail').value,
            variables: mergedVariables(),
          }),
        });
        if (d.ok) {
          $('#preview').innerHTML =
            '<b>' + esc(d.subject) + '</b>' + esc(d.text).replace(/\n/g, '<br>');
          $('#missing').innerHTML = '';
        } else {
          $('#missing').textContent = 'Saknar variabel: {{' + (d.missing || '?') + '}}';
        }
      }
      async function aiSuggestion() {
        const id = $('tpl').value;
        const parts = $('treatment').value.split('::');
        const d = await api('/cco-ai/template-draft', {
          method: 'POST',
          body: JSON.stringify({
            templateId: id,
            customerName: $('customerName').value,
            treatmentLabel: parts[1] || '',
            treatmentKey: parts[0] || '',
            customerEmail: $('customerEmail').value,
          }),
        });
        if (d.ok) {
          $('subject').value = d.subject;
          $('body').value = d.text;
          render();
        } else if (d.missing) {
          $('#missing').textContent = 'Saknar variabel: {{' + d.missing + '}}';
        }
      }
      function onTemplateChange() {
        loadVars();
      }
      $('tpl').addEventListener('change', onTemplateChange);
      $('customerName').addEventListener('input', render);
      $('treatment').addEventListener('change', render);
      $('customerEmail').addEventListener('input', render);
      $('subject').addEventListener('input', render);
      $('body').addEventListener('input', render);
      $('aiBtn').addEventListener('click', aiSuggestion);
      $('send').addEventListener('click', async () => {
        const d = await api('/cco-send/render', {
          method: 'POST',
          body: JSON.stringify({
            templateId: $('tpl').value,
            customerName: $('customerName').value,
            treatmentLabel: $('treatment').value.split('::')[1] || '',
            treatmentKey: $('treatment').value.split('::')[0] || '',
            customerEmail: $('customerEmail').value,
            variables: mergedVariables(),
          }),
        });
        if (!d.ok) {
          $('#missing').textContent = 'Stoppad: saknar {{' + d.missing + '}}';
          return;
        }
        $('#status').textContent = 'Dry-run OK (CCO_SEND_LIVE osatt). Skickas ej skarpt.';
      });
      loadTemplates();
    </script>
  </body>
</html>
