<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CCO · Skicka mall med variabler (AI-förslag) · V13</title>
    <style>
      :root {
        --paper: #efe9e2;
        --card: #fffdf9;
        --ink: #2b251f;
        --muted: #6f6457;
        --line: rgba(120, 105, 90, 0.2);
        --accent: #b26bb1;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 28px;
        background: var(--paper);
        color: var(--ink);
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        line-height: 1.45;
      }
      .wrap {
        max-width: 960px;
        margin: 0 auto;
      }
      h1 {
        font-size: 30px;
        line-height: 1.12;
        font-weight: 800;
        margin: 0 0 4px;
        letter-spacing: -0.2px;
      }
      h2 {
        font-size: 22px;
        font-weight: 750;
        margin: 0 0 10px;
      }
      .sub {
        color: var(--muted);
        margin: 0 0 20px;
        font-size: 15px;
      }
      .panel {
        background: var(--card);
        border-radius: 18px;
        box-shadow:
          0 8px 24px rgba(70, 50, 30, 0.1),
          inset 0 1px 0 rgba(255, 255, 255, 0.65);
        padding: 20px;
        border: 1px solid var(--line);
        margin-bottom: 16px;
      }
      label {
        display: block;
        font-size: 13px;
        font-weight: 700;
        margin: 12px 0 4px;
        color: var(--ink);
      }
      input,
      select,
      textarea {
        width: 100%;
        padding: 10px 11px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.9);
        font-size: 14px;
        color: var(--ink);
        box-shadow: inset 0 1px 2px rgba(70, 50, 30, 0.05);
      }
      input:focus,
      select:focus,
      textarea:focus {
        outline: 2px solid rgba(178, 107, 177, 0.35);
      }
      textarea {
        min-height: 120px;
        resize: vertical;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .btn {
        display: inline-block;
        border: 0;
        border-radius: 12px;
        padding: 10px 18px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        background: linear-gradient(180deg, rgba(178, 107, 177, 0.94), rgba(140, 80, 140, 0.98));
        color: #fff;
        box-shadow:
          0 4px 10px rgba(45, 28, 18, 0.2),
          inset 0 1px 0 rgba(255, 255, 255, 0.3),
          inset 0 -2px 0 rgba(0, 0, 0, 0.14);
      }
      .btn.secondary {
        background: linear-gradient(180deg, rgba(74, 134, 184, 0.94), rgba(50, 105, 150, 0.98));
      }
      .btn[disabled] {
        opacity: 0.5;
        cursor: not-allowed;
        filter: saturate(0.6);
      }
      .var {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 7px 0;
        font-size: 13px;
      }
      .var.auto {
        color: var(--muted);
      }
      .var input {
        flex: 1;
      }
      .chip {
        border-radius: 8px;
        padding: 2px 8px;
        font-size: 11px;
        font-weight: 700;
        display: inline-block;
      }
      .c-auto {
        background: rgba(0, 152, 61, 0.14);
        color: #0b6b2e;
      }
      .c-man {
        background: rgba(198, 80, 150, 0.16);
        color: #a82368;
      }
      #preview {
        border: 1px dashed var(--line);
        border-radius: 14px;
        padding: 16px;
        background: #fff;
        min-height: 90px;
      }
      #preview b {
        display: block;
        margin-bottom: 8px;
      }
      #missing {
        color: #a82328;
        font-weight: 700;
        margin-top: 10px;
      }
      .tag {
        font-size: 12px;
        color: var(--muted);
      }
      .legend {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        background: var(--card);
        border-radius: 16px;
        box-shadow:
          0 6px 18px rgba(70, 50, 30, 0.1),
          inset 0 1px 0 rgba(255, 255, 255, 0.6);
        padding: 12px 16px;
        margin-bottom: 18px;
      }
      .legend .l {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 600;
      }
      .dot {
        width: 13px;
        height: 13px;
        border-radius: 999px;
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>CCO · Skicka mall med variabler</h1>
      <p class="sub">
        Välj mall → ✨ AI-förslag → ändra → fyll variabler → skicka (dry-run). Ingen ofylld variabel
        går ut.
      </p>

      <div class="legend">
        <div class="l"><span class="dot" style="background: #b26bb1"></span>Manuell variabel</div>
        <div class="l">
          <span class="dot" style="background: #3e8f57"></span>Auto (fylls av systemet)
        </div>
        <div class="l"><span class="tag">Skicka alltid i dry-run — CCO_SEND_LIVE osatt</span></div>
      </div>

      <div class="panel">
        <div class="row">
          <div>
            <label>Mall</label
            ><select id="tpl"></select>
          </div>
          <div>
            <label>Kundnamn (→ {{firstName}})</label
            ><input id="customerName" placeholder="Anna Andersson" />
          </div>
        </div>
        <div class="row">
          <div>
            <label>Behandling (→ {{treatment}})</label
            ><select id="treatment"></select>
          </div>
          <div>
            <label>E-post</label><input id="customerEmail" placeholder="anna@example.com" />
          </div>
        </div>
        <div style="margin-top: 14px">
          <button class="btn secondary" id="aiBtn">✨ AI-förslag på färdigt utkast</button>
          <span class="tag">Fyller mallens egna variabler — du kan ändra</span>
        </div>
      </div>

      <div class="panel">
        <h2>Utkast</h2>
        <label>Ämne (redigerbart)</label><input id="subject" /> <label>Brödtext (redigerbart)</label
        ><textarea id="body"></textarea>
        <div id="manualVars" style="margin-top: 10px"></div>
      </div>

      <div class="panel">
        <h2>Förhandsvisning</h2>
        <div id="preview">—</div>
        <div id="missing"></div>
        <div style="margin-top: 14px">
          <button class="btn" id="send">Skicka (dry-run)</button>
          <span id="status" class="tag"></span>
        </div>
      </div>
    </div>

    <script>
      const HDR = { 'Content-Type': 'application/json', 'x-cco-role': 'owner' };
      async function api(path, opts) {
        const r = await fetch('/api/v1' + path, {
          ...opts,
          headers: { ...HDR, ...(opts?.headers || {}) },
        });
        return r.json();
      }
      function $(id) {
        return document.getElementById(id);
      }
      function esc(s) {
        return String(s || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }

      const TREAT = [
        ['hair_tp', 'FUE (hårtransplantation)', 'hårtransplantation'],
        ['hair_tp', 'DHI (hårtransplantation)', 'hårtransplantation'],
        ['beard', 'Skäggtransplantation', 'skäggtransplantation'],
        ['eyebrow', 'Ögonbrynstransplantation', 'ögonbrynstransplantation'],
        ['hair_tp', 'PRP hår', 'PRP hår'],
        ['curatiio', 'Botox', 'botox'],
      ];

      async function loadTemplates() {
        const d = await api('/cco-templates?type=followup');
        const tpl = $('tpl');
        tpl.innerHTML = '';
        (d.templates || [])
          .sort((a, b) => a.id.localeCompare(b.id))
          .forEach((t) => {
            const o = document.createElement('option');
            o.value = t.id;
            o.textContent = t.id;
            tpl.appendChild(o);
          });
        const t = $('treatment');
        TREAT.forEach((r) => {
          const o = document.createElement('option');
          o.value = r[0] + '::' + r[2];
          o.textContent = r[1];
          t.appendChild(o);
        });
        onTemplateChange();
      }
      async function loadVars() {
        const id = $('tpl').value;
        if (!id) return;
        const d = await api('/cco-templates/' + id + '/variables');
        const box = $('manualVars');
        box.innerHTML = '<h2 style="margin:12px 0 4px">Variabler</h2>';
        (d.variables || []).forEach((v) => {
          const div = document.createElement('div');
          div.className = 'var' + (v.autoFillable ? ' auto' : '');
          div.innerHTML =
            '<span>' +
            esc(v.name) +
            '</span><span class="chip ' +
            (v.autoFillable ? 'c-auto' : 'c-man') +
            '">' +
            (v.autoFillable ? 'auto' : 'manuell') +
            '</span>';
          if (!v.autoFillable) {
            const i = document.createElement('input');
            i.dataset.var = v.name;
            i.placeholder = v.name;
            div.appendChild(i);
          }
          box.appendChild(div);
        });
        render();
      }
      function mergedVariables() {
        const vars = {};
        document.querySelectorAll('#manualVars input[data-var]').forEach((i) => {
          vars[i.dataset.var] = i.value;
        });
        return vars;
      }
      async function render() {
        const id = $('tpl').value;
        const d = await api('/cco-send/render', {
          method: 'POST',
          body: JSON.stringify({
            templateId: id,
            customerName: $('customerName').value,
            treatmentLabel: $('treatment').value.split('::')[1] || '',
            treatmentKey: $('treatment').value.split('::')[0] || '',
            customerEmail: $('customerEmail').value,
            variables: mergedVariables(),
          }),
        });
        if (d.ok) {
          $('#preview').innerHTML =
            '<b>' + esc(d.subject) + '</b>' + esc(d.text).replace(/\n/g, '<br>');
          $('#missing').innerHTML = '';
        } else {
          $('#missing').textContent = 'Saknar variabel: {{' + (d.missing || '?') + '}}';
        }
      }
      async function aiSuggestion() {
        const id = $('tpl').value;
        const parts = $('treatment').value.split('::');
        const d = await api('/cco-ai/template-draft', {
          method: 'POST',
          body: JSON.stringify({
            templateId: id,
            customerName: $('customerName').value,
            treatmentLabel: parts[1] || '',
            treatmentKey: parts[0] || '',
            customerEmail: $('customerEmail').value,
          }),
        });
        if (d.ok) {
          $('subject').value = d.subject;
          $('body').value = d.text;
          render();
        } else if (d.missing) {
          $('#missing').textContent = 'Saknar variabel: {{' + d.missing + '}}';
        }
      }
      function onTemplateChange() {
        loadVars();
      }

      $('tpl').addEventListener('change', onTemplateChange);
      $('customerName').addEventListener('input', render);
      $('treatment').addEventListener('change', render);
      $('customerEmail').addEventListener('input', render);
      $('subject').addEventListener('input', render);
      $('body').addEventListener('input', render);
      $('aiBtn').addEventListener('click', aiSuggestion);
      $('send').addEventListener('click', async () => {
        const d = await api('/cco-send/render', {
          method: 'POST',
          body: JSON.stringify({
            templateId: $('tpl').value,
            customerName: $('customerName').value,
            treatmentLabel: $('treatment').value.split('::')[1] || '',
            treatmentKey: $('treatment').value.split('::')[0] || '',
            customerEmail: $('customerEmail').value,
            variables: mergedVariables(),
          }),
        });
        if (!d.ok) {
          $('#missing').textContent = 'Stoppad: saknar {{' + d.missing + '}}';
          return;
        }
        $('#status').textContent = 'Dry-run OK (CCO_SEND_LIVE osatt). Skickas ej skarpt.';
      });
      loadTemplates();
    </script>
  </body>
</html>
