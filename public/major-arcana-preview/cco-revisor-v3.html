<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>CCO Revisor-portal — v3 responsiv</title>
    <style>
      /* ===== CCO AUX SHARED FOUNDATION — paste inside each prototype's <style> at the top =====
   WCAG-härdad varm palett (all text ≥4.5:1). rem/clamp + CSS Grid/flex. Touch ≥44px.
   Samma tokens/primitiver i alla aux-ytor → de hör ihop med varandra och resten av appen. */
      :root {
        --bg-page: #faf6f2;
        --bg-surface: #ffffff;
        --bg-sunken: #f3ece3;
        --bg-rail: #fbf7f2;
        --text-primary: #221c15;
        --text-secondary: #574d40;
        --text-tertiary: #6d6354;
        --accent: #b0356e;
        --accent-weak: #fdeef4;
        --accent-weak-bg: #fdeef4;
        --accent-strong: #8e285699;
        --text-on-accent: #ffffff;
        --success: #2f6f54;
        --success-bg: rgba(47, 111, 84, 0.14);
        --warning: #9a6410;
        --warning-bg: rgba(154, 100, 16, 0.16);
        --danger: #a83838;
        --danger-bg: rgba(168, 56, 56, 0.14);
        --info: #2f6595;
        --info-bg: rgba(47, 101, 149, 0.14);
        --violet: #6b31c9;
        --violet-bg: rgba(107, 49, 201, 0.12);
        --gold: #8a5f1e;
        --gold-bg: rgba(138, 95, 30, 0.14);
        --slate: #475569;
        --slate-bg: rgba(71, 85, 105, 0.12);
        --sh-sm: 0 1px 2px rgba(56, 40, 28, 0.06);
        --sh-md: 0 3px 10px rgba(56, 40, 28, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.86);
        --sh-lg: 0 8px 22px rgba(56, 40, 28, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.92);
        --sh-xl: 0 24px 56px rgba(93, 74, 60, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.55);
        --r-sm: 10px;
        --r-md: 14px;
        --r-lg: 18px;
        --r-xl: 24px;
        --r-pill: 999px;
        --fs-kicker: 0.6875rem;
        --fs-meta: 0.75rem;
        --fs-body: 0.875rem;
        --fs-card-title: clamp(0.9rem, 0.85rem+0.4vw, 1.05rem);
        --fs-h1: clamp(1.5rem, 1.2rem+2vw, 2.25rem);
        --fs-num: clamp(1.35rem, 1.1rem+1.4vw, 1.9rem);
        --tap: 2.75rem;
        --gap: clamp(0.5rem, 0.4rem+0.5vw, 0.85rem);
        --pad-x: clamp(0.875rem, 0.5rem+1.6vw, 1.5rem);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --maxw: 1500px;
        --error-text: #962b2b;
        --error-border: #d8526b;
        --error-bg: #fdecec;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html {
        font-size: 100%;
        overflow-x: clip;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        max-width: 100%;
      }
      body {
        background:
          radial-gradient(ellipse at 12% 0%, rgba(255, 225, 200, 0.4), transparent 38%),
          radial-gradient(ellipse at 88% 4%, rgba(255, 210, 225, 0.3), transparent 42%),
          var(--bg-page);
        color: var(--text-primary);
        font-family: -apple-system, 'SF Pro Display', Inter, system-ui, sans-serif;
        font-size: var(--fs-body);
        line-height: 1.45;
        min-height: 100vh;
        overflow-x: hidden;
      }
      button {
        font-family: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        border-radius: 6px;
      }
      .tabnum {
        font-variant-numeric: tabular-nums;
      }

      /* page wrapper — centrerad, max-bredd, plats för botnav på mobil */
      .aux {
        max-width: var(--maxw);
        margin-inline: auto;
        padding: 0 var(--pad-x) 6rem;
        min-height: 100vh;
      }
      @media (min-width: 1025px) {
        .aux {
          padding-bottom: 2rem;
        }
      }

      /* topbar (samma som Konversationer/Senare) */
      .topbar {
        position: sticky;
        top: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        gap: var(--gap);
        padding: 0.5rem var(--pad-x);
        padding-top: calc(0.5rem + env(safe-area-inset-top, 0px));
        margin: 0 calc(-1 * var(--pad-x));
        background: linear-gradient(
          180deg,
          rgba(250, 246, 242, 0.97),
          rgba(250, 246, 242, 0.82) 80%,
          transparent
        );
        backdrop-filter: blur(18px);
      }
      .brand {
        flex-shrink: 0;
        font-weight: 800;
        letter-spacing: 0.08em;
        padding: 0.4rem 0.7rem;
        border-radius: var(--r-pill);
        background: linear-gradient(180deg, #fdeef4, #f6cfdc);
        color: var(--accent);
      }
      .search {
        flex: 1;
        min-width: 0;
        position: relative;
        display: flex;
        align-items: center;
        height: var(--tap);
        border-radius: var(--r-md);
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid rgba(180, 165, 150, 0.35);
        box-shadow: var(--sh-sm);
        padding: 0 0.75rem 0 2.1rem;
      }
      .search svg {
        position: absolute;
        left: 0.7rem;
        width: 1rem;
        height: 1rem;
        color: var(--text-tertiary);
      }
      .search input {
        appearance: none;
        border: 0;
        background: transparent;
        width: 100%;
        height: 100%;
        font: inherit;
        font-size: var(--fs-meta);
        color: var(--text-primary);
        outline: none;
      }
      .icon-btn {
        flex-shrink: 0;
        width: var(--tap);
        height: var(--tap);
        border-radius: var(--r-md);
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid rgba(180, 165, 150, 0.35);
        box-shadow: var(--sh-sm);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--text-primary);
        cursor: pointer;
      }

      .icon-btn svg {
        width: 1.1rem;
        height: 1.1rem;
      }

      /* sidoräls-primitiver (v11 facit) */
      .rail-brand {
        font-weight: 800;
        letter-spacing: 0.08em;
        color: var(--accent);
        padding: 0.4rem 0.6rem;
      }
      .rail-nav {
        min-height: var(--tap);
        display: flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0 0.7rem;
        border-radius: var(--r-md);
        cursor: pointer;
        color: var(--text-secondary);
        font-weight: 700;
        font-size: var(--fs-meta);
        border: 0;
        background: transparent;
        text-align: left;
      }
      .rail-nav.is-active {
        background: var(--accent-weak-bg);
        color: var(--accent);
      }
      .rail-nav svg {
        width: 1.1rem;
        height: 1.1rem;
      }
      .rail-sec {
        font-size: var(--fs-kicker);
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--text-tertiary);
        margin: 1rem 0.7rem 0.3rem;
      }

      /* head-zon */
      .head {
        padding: 0.9rem 0 0.4rem;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: var(--gap);
        flex-wrap: wrap;
      }
      .head-main {
        min-width: 0;
      }
      .kicker {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        color: var(--text-tertiary);
        font-size: var(--fs-kicker);
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        margin-bottom: 0.25rem;
      }
      .h1 {
        margin: 0;
        font-size: var(--fs-h1);
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .subtitle {
        margin: 0.3rem 0 0;
        color: var(--text-secondary);
        font-size: var(--fs-meta);
        max-width: 46ch;
      }

      /* pill-rader (filter/period/segment) */
      .pillrow {
        display: flex;
        gap: 0.4rem;
        flex-wrap: wrap;
        align-items: center;
      }
      .pillrow.scroll {
        flex-wrap: nowrap;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .pillrow.scroll::-webkit-scrollbar {
        display: none;
      }
      .pill {
        flex-shrink: 0;
        min-height: 2.25rem;
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0 0.85rem;
        border-radius: var(--r-pill);
        border: 1px solid rgba(180, 165, 150, 0.3);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(244, 238, 232, 0.84));
        font-size: var(--fs-meta);
        font-weight: 700;
        box-shadow: var(--sh-sm);
        color: var(--text-secondary);
        cursor: pointer;
        white-space: nowrap;
      }
      .pill[aria-pressed='true'],
      .pill.is-active {
        background: linear-gradient(180deg, #fdeef4, #f6cfdc);
        color: var(--accent);
        border-color: rgba(176, 53, 110, 0.32);
      }
      .pill .c {
        background: rgba(180, 165, 150, 0.18);
        padding: 0.05rem 0.4rem;
        border-radius: var(--r-pill);
        font-size: var(--fs-kicker);
        font-weight: 800;
      }
      @media (pointer: coarse) {
        .pill {
          min-height: var(--tap);
        }
      }
      .pill .dot {
        width: 0.4rem;
        height: 0.4rem;
        border-radius: 999px;
      }
      .pill--success {
        color: var(--success);
      }
      .pill--success .dot {
        background: var(--success);
      }
      .pill--warning {
        color: var(--warning);
      }
      .pill--warning .dot {
        background: var(--warning);
      }
      .pill--info {
        color: var(--info);
      }
      .pill--info .dot {
        background: var(--info);
      }
      .pill--vip {
        background: linear-gradient(180deg, #fdeef4, #f6cfdc);
        color: var(--accent);
        border-color: rgba(176, 53, 110, 0.32);
      }
      .pill--vip .dot {
        background: var(--accent);
      }

      /* knappar */
      .btn {
        min-height: 2.5rem;
        padding: 0 1rem;
        border-radius: var(--r-pill);
        border: 1px solid rgba(180, 165, 150, 0.35);
        background: rgba(255, 255, 255, 0.85);
        font: inherit;
        font-size: var(--fs-meta);
        font-weight: 700;
        color: var(--text-primary);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        white-space: nowrap;
      }
      .btn--primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .btn--danger {
        background: var(--danger-bg);
        border-color: rgba(168, 56, 56, 0.3);
        color: var(--danger);
      }
      @media (pointer: coarse) {
        .btn {
          min-height: var(--tap);
        }
      }

      /* kort & paneler */
      .card {
        position: relative;
        cursor: pointer;
        padding: 1rem;
        border-radius: var(--r-lg);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.94), rgba(247, 241, 236, 0.86));
        border: 1px solid rgba(180, 165, 150, 0.25);
        box-shadow: var(--sh-md);
        transition:
          transform 0.12s ease,
          box-shadow 0.12s ease,
          border-color 0.12s ease;
      }
      .card:hover {
        box-shadow: var(--sh-lg);
        border-color: rgba(176, 53, 110, 0.25);
      }
      .card:active {
        transform: scale(0.99);
      }
      .card.is-selected {
        border-color: var(--accent);
        box-shadow:
          0 0 0 2px rgba(176, 53, 110, 0.25),
          var(--sh-md);
      }
      .card.is-open {
        border-color: var(--accent);
      }
      .panel {
        padding: 1.1rem;
        border-radius: var(--r-xl);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.95), rgba(247, 241, 236, 0.88));
        border: 1px solid rgba(180, 165, 150, 0.25);
        box-shadow: var(--sh-md);
      }
      .panel-head {
        margin-bottom: 0.7rem;
      }
      .panel-head h2 {
        margin: 0;
        font-size: 0.95rem;
        font-weight: 800;
        letter-spacing: -0.01em;
      }
      .panel-head p {
        margin: 0.2rem 0 0;
        color: var(--text-tertiary);
        font-size: var(--fs-meta);
      }
      .sec-kicker {
        font-size: var(--fs-kicker);
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--text-tertiary);
      }

      /* metric-kort (KPI) */
      .metric {
        padding: 0.9rem 1rem;
        border-radius: var(--r-lg);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.94), rgba(247, 241, 236, 0.84));
        border: 1px solid rgba(180, 165, 150, 0.25);
        box-shadow: var(--sh-sm);
      }
      .metric .m-label {
        font-size: var(--fs-kicker);
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--text-tertiary);
      }
      .metric .m-val {
        font-size: var(--fs-num);
        font-weight: 800;
        letter-spacing: -0.02em;
        margin-top: 0.15rem;
        line-height: 1.05;
      }
      .metric .m-meta {
        font-size: var(--fs-kicker);
        color: var(--text-tertiary);
        margin-top: 0.25rem;
      }
      .metric .m-trend {
        font-size: var(--fs-kicker);
        font-weight: 800;
      }
      .m-trend--up {
        color: var(--success);
      }
      .m-trend--down {
        color: var(--danger);
      }
      .metric--green {
        border-left: 3px solid var(--success);
      }
      .metric--blue {
        border-left: 3px solid var(--info);
      }
      .metric--rose {
        border-left: 3px solid var(--accent);
      }
      .metric--violet {
        border-left: 3px solid var(--violet);
      }
      .metric--gold {
        border-left: 3px solid var(--gold);
      }
      .metric--slate {
        border-left: 3px solid var(--slate);
      }

      /* switch — 44px träffyta via track-storlek */
      .switch {
        position: relative;
        flex-shrink: 0;
        width: 3rem;
        height: var(--tap);
        cursor: pointer;
      }
      .switch input {
        position: absolute;
        inset: 0;
        opacity: 0;
        margin: 0;
        cursor: pointer;
      }
      .switch .track {
        position: absolute;
        top: 50%;
        left: 0;
        transform: translateY(-50%);
        width: 3rem;
        height: 1.6rem;
        border-radius: 999px;
        background: rgba(120, 108, 95, 0.32);
        transition: background 0.2s;
      }
      .switch .track::after {
        content: '';
        position: absolute;
        top: 2px;
        left: 2px;
        width: 1.2rem;
        height: 1.2rem;
        border-radius: 50%;
        background: #fff;
        box-shadow: var(--sh-sm);
        transition: transform 0.2s;
      }
      .switch input:checked + .track {
        background: var(--success);
      }
      .switch input:checked + .track::after {
        transform: translateX(1.4rem);
      }
      .switch input:focus-visible + .track {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      /* bottom-nav (samma som Konversationer/Senare-prototyperna) — döljs ≥601 */
      .botnav {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 60;
        display: flex;
        align-items: center;
        justify-content: space-around;
        gap: 0.25rem;
        padding: 0.5rem 0.75rem calc(0.5rem + var(--safe-bottom));
        background: linear-gradient(180deg, rgba(250, 246, 242, 0), rgba(250, 246, 242, 0.94) 30%);
        backdrop-filter: blur(20px);
      }
      .nav-i {
        flex: 1;
        min-height: var(--tap);
        border: 0;
        background: transparent;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.1rem;
        color: var(--text-tertiary);
        font-size: var(--fs-kicker);
        font-weight: 700;
        text-transform: uppercase;
      }
      .nav-i svg {
        width: 1.35rem;
        height: 1.35rem;
      }
      .nav-i.is-active {
        color: var(--accent);
      }
      /* lekfull bottom-nav — duoton-ikoner, per-flik-färg, studs + sväv + badge */
      .nav-i {
        gap: 0.2rem;
        transition: color 0.2s;
        position: relative;
      }
      .nav-i .ic-wrap {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 3.1rem;
        height: 1.9rem;
        border-radius: var(--r-pill);
        transition:
          background 0.25s,
          box-shadow 0.25s,
          transform 0.25s;
      }
      .nav-i .ic {
        width: 1.5rem;
        height: 1.5rem;
        transition: transform 0.2s;
      }
      .nav-i .ic-fill {
        fill: currentColor;
        opacity: 0.24;
        transition:
          fill 0.2s,
          opacity 0.2s;
      }
      .nav-i .ic-line {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .nav-i .ic-dot {
        fill: currentColor;
      }
      @media (hover: hover) {
        .nav-i:not(.is-active):hover .ic {
          transform: translateY(-2px) rotate(-6deg);
        }
        .nav-i:not(.is-active):hover .ic-wrap {
          background: rgba(176, 53, 110, 0.08);
        }
      }
      .nav-i:active .ic {
        transform: scale(0.84);
      }
      .nav-i.is-active {
        color: var(--ic, var(--accent));
      }
      .nav-i.is-active .ic-wrap {
        background: var(--ic-bg, var(--accent-weak));
        box-shadow: 0 7px 16px -6px var(--ic, var(--accent));
        animation: navfloat 2.8s ease-in-out infinite;
      }
      .nav-i.is-active .ic {
        animation: navpop 0.46s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .nav-i.is-active .ic-fill {
        opacity: 1;
        fill: var(--ic, var(--accent));
      }
      .nav-i.is-active .ic-line {
        stroke: #fff;
      }
      .nav-i.is-active .ic-dot {
        fill: #fff;
      }
      .nav-badge {
        position: absolute;
        top: -0.15rem;
        right: 0.4rem;
        min-width: 1rem;
        height: 1rem;
        padding: 0 0.25rem;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        font-size: 0.5625rem;
        font-weight: 800;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 0 2px var(--bg-page);
      }
      @keyframes navpop {
        0% {
          transform: scale(0.55);
        }
        55% {
          transform: scale(1.2);
        }
        100% {
          transform: scale(1);
        }
      }
      @keyframes navfloat {
        0%,
        100% {
          transform: translateY(-3px);
        }
        50% {
          transform: translateY(-6px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .nav-i .ic,
        .nav-i .ic-wrap {
          animation: none !important;
        }
      }
      @media (min-width: 601px) {
        .botnav {
          display: none;
        }
        .aux {
          padding-bottom: 2rem;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }

      /* ===== REVISOR-PORTAL-SPECIFIK STYLING (bygger på primitiverna ovan) ===== */

      /* head meta + role chip */
      .head-meta {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex-wrap: wrap;
        margin-top: 0.35rem;
      }
      .head-meta .ml {
        color: var(--text-secondary);
        font-size: var(--fs-meta);
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        padding: 0.2rem 0.55rem;
        border-radius: var(--r-pill);
        font-size: var(--fs-kicker);
        font-weight: 800;
        letter-spacing: 0.02em;
        background: var(--slate-bg);
        color: var(--slate);
      }

      /* read-only info note (full width) */
      .note-info {
        display: flex;
        gap: 0.6rem;
        align-items: flex-start;
        padding: 0.85rem 1rem;
        border-radius: var(--r-lg);
        background: var(--info-bg);
        border: 1px solid rgba(47, 101, 149, 0.28);
        color: var(--text-primary);
        font-size: var(--fs-meta);
        line-height: 1.5;
        margin: 0.4rem 0 0.9rem;
      }
      .note-info .ni-ic {
        flex-shrink: 0;
        font-size: 1rem;
        line-height: 1.3;
      }

      /* filter-rad — responsiv grid; mobil: 1-kol */
      .filters {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr));
        gap: 0.6rem;
        align-items: end;
        margin: 0 0 1rem;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
        min-width: 0;
      }
      .field label {
        font-size: var(--fs-kicker);
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--text-tertiary);
      }
      .field select,
      .field input {
        appearance: none;
        width: 100%;
        min-height: var(--tap);
        height: var(--tap);

      </div>
      <div class="br-date">${esc(b.date)}</div>
      <div class="br-meta">
        <span>${b.expenses} expenses</span>
        <span>${noteTxt}</span>
        ${b.manifest ? '<span class="ok">✓ manifest</span>' : ''}
      </div>
    </div>
    ${chev()}
  </button>`;
      }

      function detailHTML(b) {
        const tone = STATUS[b.status] || 'warning';
        const stats = [
          ['Batch-ID', b.id, true],
          ['Exporterad datum', b.exported, false],
          ['Antal expenses', b.expenses, false],
          ['Antal kvitton', b.receipts, false],
          ['Totalt brutto kr', b.gross, false],
          ['Total moms kr', b.vat, false],
          ['Avdragsgill moms kr', b.deductible, false],
          ['Review-status', b.status, false],
        ]
          .map(
            (s) =>
              `<div class="stat"><div class="s-l">${esc(s[0])}</div><div class="s-v${s[2] ? ' mono' : ''}">${esc(s[1])}</div></div>`
          )
          .join('');

        const acts = ACTIONS.map((a) => {
          let cls = 'btn';
          if (a === 'Acceptera för bokföring') cls = 'btn btn--primary';
          if (a === 'Avvisa') cls = 'btn btn--danger';
          return `<button class="${cls}">${esc(a)}</button>`;
        }).join('');

        const exps = b.exp
          .map(
            (e) => `<div class="exp-row">
      <span class="e-sup">${esc(e.sup)}</span>
      <span class="e-cat">${esc(e.cat)}</span>
      <span class="e-amt tabnum">${esc(e.amt)} kr</span>
      <span class="e-vat tabnum">moms ${esc(e.vat)}</span>
      <span class="e-date">${esc(e.date)}</span>
    </div>`
          )
          .join('');

        const notes = b.noteList.length
          ? b.noteList
              .map(
                (n) => `<div class="note-item">
        <div class="n-top"><span class="n-rev">${esc(n.rev)}</span><span>${esc(n.date)}</span></div>
        <div class="n-text">${esc(n.text)}</div>
      </div>`
              )
              .join('')
          : '<div class="detail-empty" style="padding:.8rem .5rem">Inga noteringar än.</div>';

        return `
    <div class="detail-head">
      <span class="dh-id">${esc(b.id)}</span>
      <span class="badge badge--${tone}" style="margin-left:auto">${esc(b.status)}</span>
    </div>
    <div class="dgrid">${stats}</div>
    <div class="actions">${acts}</div>
    <div class="dsub">
      <h4>Expenses</h4>
      <div class="exp-list">${exps}</div>
    </div>
    <div class="dsub">
      <h4>Noteringar</h4>
      <div class="notes-list">${notes}</div>
      <div class="add-note">
        <textarea placeholder="Skriv en notering till denna batch…" aria-label="Lägg till notering"></textarea>
        <button class="btn btn--primary">Lägg till notering</button>
      </div>
    </div>`;
      }

      function renderList() {
        list.innerHTML = BATCHES.map(rowHTML).join('');
        if (selectedId) {
          const sel = list.querySelector(`.batch-row[data-id="${CSS.escape(selectedId)}"]`);
          if (sel) {
            sel.classList.add('is-selected');
            sel.setAttribute('aria-pressed', 'true');
          }
        }
      }

      function selectBatch(id) {
        selectedId = id;
        list.querySelectorAll('.batch-row').forEach((r) => {
          const on = r.dataset.id === id;
          r.classList.toggle('is-selected', on);
          r.setAttribute('aria-pressed', on ? 'true' : 'false');
        });
        const b = BATCHES.find((x) => x.id === id);
        detail.innerHTML = b
          ? detailHTML(b)
          : '<div class="detail-empty">Välj en export-batch för att se detaljer.</div>';
      }

      list.addEventListener('click', (e) => {
        const r = e.target.closest('.batch-row');
        if (!r) return;
        selectBatch(r.dataset.id);
      });

      document.getElementById('refresh').addEventListener('click', () => {
        renderList();
        if (selectedId) selectBatch(selectedId);
      });

      renderList();
      // Default-select first batch on desktop (≥601) so panel isn't empty
      if (window.matchMedia('(min-width:601px)').matches) {
        selectBatch(BATCHES[0].id);
      }
    </script>
    <script>
      (function () {
        var nav = document.querySelector('.botnav');
        if (!nav) return;
        nav.addEventListener('click', function (e) {
          var b = e.target.closest('.nav-i');
          if (!b) return;
          nav.querySelectorAll('.nav-i').forEach(function (x) {
            x.classList.remove('is-active');
            x.removeAttribute('aria-current');
          });
          void b.offsetWidth;
          b.classList.add('is-active');
          b.setAttribute('aria-current', 'page');
        });
      })();
    </script>
  </body>
</html>
