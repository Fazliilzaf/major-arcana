<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#bb4779" />
    <meta name="robots" content="noindex,nofollow" />

    />
    <title>Meddelanden · Hair TP Clinic</title>
    <style>
      :root {
        --bg: #faf6f2;
        --ink: #2b251f;
        --ink-2: rgba(70, 60, 50, 0.62);
        --ink-3: #8a8174;
        --studio: #bb4779;
        --line: rgba(120, 100, 90, 0.16);
        --sunken: #f2ece6;
        --rose-top: rgba(252, 233, 240, 0.98);
        --rose-bottom: rgba(241, 207, 220, 0.95);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        background:
          radial-gradient(ellipse at 12% 0%, rgba(255, 225, 200, 0.42), transparent 38%), var(--bg);
        color: var(--ink);
        font-family:
          Inter,
          -apple-system,
          system-ui,
          sans-serif;
        font-size: 15px;
        line-height: 1.5;
        min-height: 100vh;
        display: flex;
        justify-content: center;
      }
      .wrap {
        width: 100%;
        max-width: 560px;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        padding: 16px 14px 12px;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 10px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--line);
      }
      .mark {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        background: linear-gradient(135deg, var(--rose-top), var(--rose-bottom));
        display: grid;
        place-items: center;
        font-weight: 800;
        color: var(--studio);
        font-size: 15px;
      }
      .top h1 {
        font-size: 15px;
        margin: 0;
        font-weight: 700;
      }
      .top p {
        margin: 1px 0 0;
        font-size: 12px;
        color: var(--ink-3);
      }
      .thread {
        flex: 1;
        overflow-y: auto;
        padding: 14px 2px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .msg {
        display: flex;
      }
      .msg.out {
        justify-content: flex-start;
      }
      .msg.in {
        justify-content: flex-end;
      }
      .bubble {
        max-width: 82%;
        padding: 9px 12px;
        border-radius: 14px;
        font-size: 14.5px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .msg.out .bubble {
        background: #fff;
        border: 1px solid var(--line);
        border-bottom-left-radius: 4px;
      }
      .msg.in .bubble {
        background: linear-gradient(135deg, var(--rose-top), var(--rose-bottom));
        color: var(--ink);
        border-bottom-right-radius: 4px;
      }
      .meta {
        font-size: 10.5px;
        color: var(--ink-3);
        margin-top: 3px;
      }
      .empty,
      .state {
        text-align: center;
        color: var(--ink-3);
        font-size: 13px;
        padding: 40px 16px;
      }
      .composer {
        display: flex;
        gap: 8px;
        padding-top: 10px;
        border-top: 1px solid var(--line);
      }
      textarea {
        flex: 1;
        min-width: 0;
        resize: none;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px 12px;
        font: inherit;
        font-size: 15px;
        background: #fff;
        color: var(--ink);
        max-height: 120px;
      }
      button {
        border: 0;
        border-radius: 12px;
        padding: 0 18px;
        font: inherit;
        font-weight: 700;
        font-size: 14.5px;
        cursor: pointer;
        background: var(--studio);
        color: #fff;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .foot {
        text-align: center;
        font-size: 10.5px;
        color: var(--ink-3);
        padding-top: 8px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="top">
        <div class="mark">TP</div>
        <div>
          <h1>Hair TP Clinic</h1>
          <p>Säker meddelandekanal med kliniken</p>
        </div>
      </div>
      <!-- Nivå-2-panel: offert/journal/bokningar bakom BankID-login (renderas av cco-portal-level2.js) -->
      <div data-cco-portal-level2 aria-live="polite"></div>
      <div class="thread" id="thread">
        <div class="state" id="state">Laddar…</div>
      </div>
      <div class="composer" id="composer" style="display: none">
        <textarea
          id="input"
          rows="1"
          placeholder="Skriv ett meddelande…"
          maxlength="8000"
        ></textarea>
        <button id="send" type="button">Skicka</button>
      </div>
      <div class="foot">
        Endast för icke-akuta frågor. Vid akut vård ring 1177 eller 112. Journal och medicinska
        beslut hanteras av kliniken.
      </div>
    </div>

    <script>
      (function () {
        'use strict';
        // Token från /portal-chat/:token (path) med query som fallback.
        function readToken() {
          var m = location.pathname.match(/\/portal-chat\/([^/?#]+)/);
          if (m && m[1]) return decodeURIComponent(m[1]);
          var q = new URLSearchParams(location.search).get('token');
          return q ? q.trim() : '';
        }
        var TOKEN = readToken();
        var API = '/api/patient-portal/' + encodeURIComponent(TOKEN) + '/messages';
        var thread = document.getElementById('thread');
        var stateEl = document.getElementById('state');
        var composer = document.getElementById('composer');
        var input = document.getElementById('input');
        var sendBtn = document.getElementById('send');

        function esc(s) {
          return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
          });
        }
        function fmt(iso) {
          if (!iso) return '';
          try {
            var d = new Date(iso);
            return d.toLocaleDateString('sv-SE') + ' ' + d.toTimeString().slice(0, 5);
          } catch (e) {
            return '';
          }
        }
        function showState(msg) {
          thread.innerHTML = '';
          var d = document.createElement('div');
          d.className = 'state';
          d.textContent = msg;
          thread.appendChild(d);
        }
        function render(messages) {
          thread.innerHTML = '';
          if (!messages || !messages.length) {
            var e = document.createElement('div');
            e.className = 'empty';
            e.textContent = 'Inga meddelanden än. Skriv gärna till oss nedan.';
            thread.appendChild(e);
            return;
          }
          messages.forEach(function (m) {
            // outbound = från kliniken (vänster), inbound = patientens egna (höger)
            var out = m.direction === 'outbound';
            var row = document.createElement('div');
            row.className = 'msg ' + (out ? 'out' : 'in');
            var b = document.createElement('div');
            b.innerHTML =
              '<div class="bubble">' +
              esc(m.body) +
              '</div>' +
              '<div class="meta" style="text-align:' +
              (out ? 'left' : 'right') +
              '">' +
              (out ? 'Kliniken · ' : '') +
              fmt(m.createdAt) +
              '</div>';
            row.appendChild(b);
            thread.appendChild(row);
          });
          thread.scrollTop = thread.scrollHeight;
        }

        function load() {
          return fetch(API, { cache: 'no-store', headers: { Accept: 'application/json' } })
            .then(function (r) {
              return r
                .json()
                .catch(function () {
                  return {};
                })
                .then(function (j) {
                  return { ok: r.ok, j: j };
                });
            })
            .then(function (res) {
              if (!res.ok || !res.j.ok) {
                showState('Länken är inte giltig längre. Kontakta kliniken för en ny länk.');
                return false;
              }
              composer.style.display = 'flex';
              render(res.j.messages || []);
              return true;
            })
            .catch(function () {
              showState('Kunde inte kontakta servern. Försök igen om en stund.');
              return false;
            });
        }

        function send() {
          var body = input.value.trim();
          if (!body) return;
          sendBtn.disabled = true;
          fetch(API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
            body: JSON.stringify({ body: body }),
          })
            .then(function (r) {
              return r.ok;
            })
            .then(function (ok) {
              if (ok) {
                input.value = '';
                input.style.height = 'auto';
                return load();
              }
            })
            .catch(function () {})
            .finally(function () {
              sendBtn.disabled = false;
              input.focus();
            });
        }

        input.addEventListener('input', function () {
          input.style.height = 'auto';
          input.style.height = Math.min(input.scrollHeight, 120) + 'px';
        });
        input.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            send();
          }
        });
        sendBtn.addEventListener('click', send);

        if (!TOKEN) {
          showState('Länken saknar en giltig kod. Kontakta kliniken för en ny länk.');
        } else {
          load();
        }
      })();
    </script>
    <script src="/major-arcana-preview/app/cco-portal-level2.js"></script>
  </body>
</html>
