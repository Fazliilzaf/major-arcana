<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#faf6f2" />
    <title>CCO · Kunder (mobil)</title>
    <link rel="stylesheet" href="/cco-journal-feed.css" />
    <link rel="stylesheet" href="/cco-komm-panel.css" />
    <style>
      :root {
        --cco-bg-page: #faf6f2;
        --cco-color-brand: #2b251f;
        --cco-text-secondary: rgba(70, 60, 50, 0.62);
        --cco-text-tertiary: #8a8174;
        --cco-status-success: #4a8268;
        --cco-status-warning: #c8821e;
        --cco-status-danger: #b94a4a;
        --cco-status-info: #4a7ba8;
        --mk-touch: 44px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          'SF Pro Text',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: var(--cco-bg-page);
        color: var(--cco-color-brand);
        min-height: 100dvh;
        padding-bottom: env(safe-area-inset-bottom, 0);
      }
      .mk-header {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
        padding-top: calc(12px + env(safe-area-inset-top, 0));
        background: rgba(250, 246, 242, 0.94);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(132, 117, 107, 0.14);
      }
      .mk-header a {
        color: var(--cco-color-brand);
        text-decoration: none;
        font-size: 22px;
        line-height: 1;
        min-width: var(--mk-touch);
        min-height: var(--mk-touch);
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .mk-header h1 {
        margin: 0;
        font-size: 17px;
        font-weight: 800;
        flex: 1;
      }
      .mk-header-meta {
        font-size: 11px;
        color: var(--cco-text-secondary);
        font-weight: 700;
      }
      .mk-auth {
        margin: 10px 14px;
        padding: 10px 12px;
        border-radius: 12px;
        background: rgba(200, 130, 30, 0.12);
        border: 1px solid rgba(200, 130, 30, 0.3);
        font-size: 12px;
      }
      .mk-auth a {
        font-weight: 700;
        margin-left: 6px;
      }
      .mk-search-wrap {
        padding: 0 14px 8px;
      }
      .mk-search {
        width: 100%;
        min-height: var(--mk-touch);
        border-radius: 12px;
        border: 1px solid rgba(132, 117, 107, 0.22);
        padding: 10px 14px;
        font-size: 16px;
        background: #fff;
      }
      .mk-segments {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 4px 14px 10px;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }
      .mk-segments::-webkit-scrollbar {
        display: none;
      }
      .mk-seg {
        flex: 0 0 auto;
        min-height: 36px;
        padding: 8px 12px;
        border-radius: 999px;
        border: 1px solid rgba(132, 117, 107, 0.2);
        background: rgba(255, 255, 255, 0.7);
        font-size: 11px;
        font-weight: 700;
        color: var(--cco-text-secondary);
        white-space: nowrap;
      }
      .mk-seg.is-active {
        background: #2b251f;
        color: #fff;
        border-color: #2b251f;
      }
      .mk-seg:disabled {
        opacity: 0.45;
      }
      .mk-meta {
        padding: 0 14px 6px;
        font-size: 11px;
        color: var(--cco-text-secondary);
      }
      .mk-list {
        padding: 0 10px 16px;
      }
      .mk-row {
        display: grid;
        grid-template-columns: 40px 1fr auto;
        gap: 10px;
        align-items: start;
        padding: 12px;
        margin-bottom: 8px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid rgba(132, 117, 107, 0.12);
        min-height: var(--mk-touch);
      }
      .mk-row:active {
        transform: scale(0.99);
      }
      .mk-avatar {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 800;
        background: linear-gradient(180deg, #e8d4ff, #b894e8);
      }
      .mk-name {
        font-size: 14px;
        font-weight: 800;
        line-height: 1.25;
      }
      .mk-sub {
        font-size: 11px;
        color: var(--cco-text-secondary);
        margin-top: 2px;
      }
      .mk-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 6px;
      }
      .mk-tag {
        font-size: 9px;
        font-weight: 800;
        padding: 2px 6px;
        border-radius: 6px;
        background: rgba(132, 117, 107, 0.1);
      }
      .mk-tag--risk {
        background: rgba(185, 74, 74, 0.14);
        color: var(--cco-status-danger);
      }
      .mk-tag--warn {
        background: rgba(200, 130, 30, 0.14);
        color: var(--cco-status-warning);
      }
      .mk-tag--ready {
        background: rgba(74, 130, 104, 0.14);
        color: var(--cco-status-success);
      }
      .mk-step {
        font-size: 10px;
        color: var(--cco-text-tertiary);
        margin-top: 4px;
        max-width: 200px;
      }
      .mk-chevron {
        font-size: 20px;
        color: var(--cco-text-tertiary);
        padding-top: 8px;
      }
      .mk-status {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 10px;
        font-weight: 700;
        margin-top: 4px;
      }
      .mk-status .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--cco-status-info);
      }
      .mk-load-wrap {
        padding: 8px 14px 24px;
        text-align: center;
      }
      .mk-load-wrap button {
        min-height: var(--mk-touch);
        padding: 10px 18px;
        border-radius: 12px;
        border: 1px solid rgba(132, 117, 107, 0.25);
        background: #fff;
        font-weight: 700;
      }
      .mk-empty {
        padding: 24px;
        text-align: center;
        color: var(--cco-text-secondary);
        font-size: 13px;
      }
      .mk-dossier {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: var(--cco-bg-page);
        display: flex;
        flex-direction: column;
      }
      .mk-dossier[hidden] {
        display: none !important;
      }
      .mk-dossier-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        padding-top: calc(10px + env(safe-area-inset-top, 0));
        border-bottom: 1px solid rgba(132, 117, 107, 0.14);
        background: rgba(250, 246, 242, 0.96);
      }
      .mk-dossier-head button {
        min-width: var(--mk-touch);
        min-height: var(--mk-touch);
        border: none;
        background: transparent;
        font-size: 28px;
        line-height: 1;
      }
      .mk-dossier-title {
        flex: 1;
        min-width: 0;
      }
      .mk-dossier-title h2 {
        margin: 0;
        font-size: 16px;
      }
      .mk-dossier-title p {
        margin: 2px 0 0;
        font-size: 11px;
        color: var(--cco-text-secondary);
      }
      .mk-dossier-body {
        flex: 1;
        overflow-y: auto;
        padding: 12px 14px 32px;
        -webkit-overflow-scrolling: touch;
      }
      .mk-panel {
        margin-bottom: 12px;
        padding: 12px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid rgba(132, 117, 107, 0.12);
      }
      .mk-panel h3 {
        margin: 0 0 8px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--cco-text-secondary);
      }
      .mk-grid2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        font-size: 12px;
      }
      .mk-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .mk-actions a,
      .mk-actions button {
        min-height: 40px;
        padding: 8px 12px;
        border-radius: 10px;
        border: 1px solid rgba(132, 117, 107, 0.2);
        background: #fff;
        font-size: 11px;
        font-weight: 700;
        text-decoration: none;
        color: var(--cco-color-brand);
      }
      .mk-actions button:disabled {
        opacity: 0.5;
      }
      .mk-data-missing {
        font-size: 12px;
        color: var(--cco-text-secondary);
      }
      .cco-assets-badge {
        display: inline-block;
        margin: 2px 4px 2px 0;
        padding: 2px 6px;
        border-radius: 6px;
        font-size: 9px;
        font-weight: 700;
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid rgba(132, 117, 107, 0.2);
      }
    </style>
    <script src="/cco-kunder-staff-owner.js" defer></script>
    <script src="/cco-kunder-actions.js" defer></script>
    <script src="/cco-journal-feed.js" defer></script>
    <script src="/cco-komm-panel.js" defer></script>
    <script src="/cco-kunder-mobil-real.js" defer></script>
  </head>
  <body data-cco-surface="mobile-kunder">
    <header class="mk-header">
      <a href="/cco-demo.html" aria-label="Välkommen">‹</a>
      <h1>Kunder</h1>
      <span class="mk-header-meta" id="mkTotal">—</span>
    </header>
    <div id="mkAuthBanner" hidden></div>
    <div class="mk-search-wrap">
      <input
        class="mk-search"
        id="mkSearch"
        type="search"
        placeholder="Sök hela registret (namn, e-post, telefon)…"
        autocomplete="off"
      />
    </div>
    <div class="mk-segments" id="mkSegmentChips" role="tablist" aria-label="Segment"></div>
    <div class="mk-meta" id="mkListMeta"></div>
    <div class="mk-list" id="mkCustomerList"></div>
    <div class="mk-load-wrap">
      <button type="button" id="mkLoadMore" hidden>Ladda fler</button>
    </div>

    <div class="mk-dossier" id="mkDossier" hidden>
      <header class="mk-dossier-head">
        <button type="button" id="mkDossierBack" aria-label="Tillbaka">‹</button>
        <div class="mk-dossier-title" id="mkDossierTitle"></div>
      </header>
      <div class="mk-dossier-body" id="mkDossierBody"></div>
    </div>
  </body>
</html>
