services:
  - type: web
    name: arcana-cco
    runtime: node
    # Uppgraderad från starter till standard 2026-05-12: 512MB RAM räckte
    # inte för Playwright + Node + Express + ~25 deps under last (orsakade
    # 20+ deploy-fails med status 134 SIGABRT pga OOM). Standard ger 2GB
    # RAM + 1 dedikerad CPU, vilket ger ~3x headroom för current load
    # och stöd för samtidiga PDF/screenshot-genereringar.
    plan: standard
    # Build: standard npm ci + post-install playwright-chromium till
    # persistent disk så browsers cachas mellan deploys.
    # (Status 134 var runtime-crash, INTE build-fail — server.js har
    # nu lazy-load av playwright så startup inte längre kraschar om
    # browsers saknas.)
    buildCommand: npm ci && PLAYWRIGHT_BROWSERS_PATH=/var/data/playwright-browsers npx playwright install chromium || echo "Playwright install non-fatal, fortsätter ändå"
    startCommand: npm start
    disk:
      name: arcana-cco-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ARCANA_STATE_ROOT
        value: /var/data
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /var/data/playwright-browsers
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: ARCANA_AI_PROVIDER
        value: fallback
      - key: ARCANA_GRAPH_READ_ENABLED
        value: "true"
      - key: ARCANA_GRAPH_SEND_ENABLED
        value: "true"
      - key: ARCANA_GRAPH_TENANT_ID
        sync: false
      - key: ARCANA_GRAPH_CLIENT_ID
        sync: false
      - key: ARCANA_GRAPH_CLIENT_SECRET
        sync: false
      - key: ARCANA_GRAPH_USER_ID
        sync: false
      - key: ARCANA_GRAPH_FULL_TENANT
        value: "true"
      - key: ARCANA_GRAPH_USER_SCOPE
        value: all
      - key: ARCANA_GRAPH_READ_DEFAULT_ALLOWLIST
        sync: false
      - key: ARCANA_MAILBOX_ALLOWLIST
        sync: false
      - key: ARCANA_GRAPH_SEND_ALLOWLIST
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ARCANA_BOOTSTRAP_MAILBOX_BACKFILL
        value: "true"
      # Sänkt 2026-05-14 från 90 till 14 dagar. SIGABRT 134-grävning visade
      # att bootstrap laddade 4340 messages × 4 folders × 6 mailboxar i
      # ETT svep -> OOM på Standard 2GB. 14 d ger ~624 messages per
      # mailbox -> under RAM-cap. Delta-sync (var 5 min) fyller på senaste
      # mail efter bootstrap, så äldre historik läses on-demand vid behov.
      - key: ARCANA_BOOTSTRAP_MAILBOX_LOOKBACK_DAYS
        value: "14"
      - key: ARCANA_BOOTSTRAP_PREFERRED_MAILBOX
        value: contact@hairtpclinic.com
      - key: ARCANA_BOOTSTRAP_TENANT_ID
        value: hair-tp-clinic
      - key: ARCANA_BOOTSTRAP_DELAY_MS
        value: "5000"
