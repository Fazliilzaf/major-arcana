services:
  - type: web
    # Frankfurt prod (srv-d8b3i3tckfvc73clgeng) — arcana.hairtpclinic.com
    # Oregon srv-d6b11o0boq4c73chm7f0 ("major-arcana") raderad 2026-06-06 — endast Frankfurt prod kvar.
    name: arcana
    runtime: node
    repo: https://github.com/Fazliilzaf/major-arcana
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /readyz
    # plan utelämnad medvetet — prod kör Pro; Render behåller befintlig plan vid sync.
    # Build: standard npm ci + post-install playwright-chromium till
    # persistent disk så browsers cachas mellan deploys.
    # (Status 134 var runtime-crash, INTE build-fail — server.js har
    # nu lazy-load av playwright så startup inte längre kraschar om
    # browsers saknas.)
    # Build-pipeline (i ordning):
    #   1. npm ci             → installerar deps inkl. esbuild
    #   2. npm run build:bundle → bygger app.bundle.<hash>.min.js från index.html-script-tags
    #   3. node bin/inject-bundle.js → uppdaterar index.html till nya hashen
    #   4. Meridiq preview JSON (gitignored under data/) för steg 7–9 + 36-doc bundle
    #   5. playwright install (non-fatal, samma som tidigare)
    buildCommand: npm ci && npm run build:bundle && node ./bin/inject-bundle.js && npm run build:meridiq-step789-preview && npm run build:hairtp-document-content && (PLAYWRIGHT_BROWSERS_PATH=/var/data/playwright-browsers npx playwright install chromium || echo "Playwright install non-fatal, fortsätter ändå")
    startCommand: NODE_OPTIONS='--max-old-space-size=6144' npm start
    disk:
      # OBS: namn + storlek MASTE matcha live-disken (dsk-d8b3i3tckfvc73clgetg).
      # Live-disken heter "disk" och ar 450 GB (hojd 2026-07-17, +100 GB fran 350). Mismatch har
      # (10 GB i yaml mot 20+ GB live) gjorde att VARJE blueprint-sync failade
      # med "cannot decrease disk size" fran ~06-06 till 06-10 - vilket i sin tur
      # gjorde att envVars-andringar i denna fil aldrig nadde tjansten.
      # Vid diskhojning i Dashboard: uppdatera sizeGB har OMEDELBART.
      name: disk
      mountPath: /var/data
      sizeGB: 450
    envVars:
      - key: ARCANA_STATE_ROOT
        value: /var/data
      - key: ARCANA_CCO_BOOKING_STORE_PATH
        value: /var/data/cco-booking.json
      - key: ARCANA_CCO_BOOKING_ENGINE_STORE_PATH
        value: /var/data/cco-booking-engine.json
      - key: ARCANA_CCO_PATIENT_ASSETS_PATH
        value: /var/data/cco-patient-assets.json
      - key: ARCANA_CCO_ASSET_IMPORT_RUNS_PATH
        value: /var/data/cco-asset-import-runs.json
      - key: ARCANA_CCO_ASSET_REVIEW_QUEUE_PATH
        value: /var/data/cco-asset-review-queue.json
      - key: ARCANA_CCO_HALSO_HD_INGEST_ENABLED
        value: "false"
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /var/data/playwright-browsers
      - key: NODE_ENV
        value: production
      # Pro Plus 8 GB RAM — default V8 heap ~2 GB gav exit 134 vid boot-backfill.
      - key: NODE_OPTIONS
        value: "--max-old-space-size=6144"
      # En heap-snapshot kan själv använda flera GB RAM när Drive-inventeringen
      # bygger ett stort index. Behåll larmet, men skriv inte snapshot automatiskt
      # i den skarpa tjänsten.
      - key: ARCANA_MEMORY_WATCHDOG_SNAPSHOT_ENABLED
        value: "false"
      - key: TRUST_PROXY
        value: "true"
      - key: ARCANA_AI_PROVIDER
        value: fallback
      - key: ARCANA_STAFF_JOURNAL_OPEN_ACCESS
        value: "false"
      - key: ARCANA_GRAPH_READ_ENABLED
        value: "true"
      - key: ARCANA_GRAPH_SEND_ENABLED
        value: "true"
      - key: ARCANA_GRAPH_TENANT_ID
        sync: false
      - key: ARCANA_GRAPH_CLIENT_ID
        sync: false
      - key: ARCANA_GRAPH_CLIENT_SECRET
        sync: false
      - key: ARCANA_GRAPH_USER_ID
        sync: false
      - key: ARCANA_GRAPH_FULL_TENANT
        value: "true"
      - key: ARCANA_GRAPH_USER_SCOPE
        value: all
      - key: ARCANA_GRAPH_READ_DEFAULT_ALLOWLIST
        value: kons@hairtpclinic.com,info@hairtpclinic.com,contact@hairtpclinic.com,egzona@hairtpclinic.com,fazli@hairtpclinic.com,marknad@hairtpclinic.com,kvitto@hairtpclinic.com,halso@hairtpclinic.com
      - key: ARCANA_MAILBOX_ALLOWLIST
        value: kons@hairtpclinic.com,info@hairtpclinic.com,contact@hairtpclinic.com,egzona@hairtpclinic.com,fazli@hairtpclinic.com,marknad@hairtpclinic.com,kvitto@hairtpclinic.com,halso@hairtpclinic.com
      - key: ARCANA_GRAPH_SEND_ALLOWLIST
        sync: false
      - key: ARCANA_CCO_MARK_ANSWERED_CATEGORY
        value: "true"
      - key: OPENAI_API_KEY
        sync: false
      # Resend för transactional emails — INTE deklarerade här. Med
      # blueprint-managed services blockerar sync:false runtime-
      # exposure även om värdet finns i UI. Vi lägger dem som rent
      # UI-managed istället (Render exponerar dem då direkt till
      # process.env utan blueprint-rundtripp).
      # PUBLIC_BASE_URL maste matcha den faktiska basen (mejl-logga + lankar).
      # Prod custom domain (ORD-74 avstämning 2026-07-17 mot Dashboard).
      - key: PUBLIC_BASE_URL
        value: https://arcana.hairtpclinic.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ARCANA_BOOTSTRAP_MAILBOX_BACKFILL
        value: "true"
      # Sänkt 2026-05-14 från 90 till 14 dagar. SIGABRT 134-grävning visade
      # att bootstrap laddade 4340 messages × 4 folders × 6 mailboxar i
      # ETT svep -> OOM på Standard 2GB. 14 d ger ~624 messages per
      # mailbox -> under RAM-cap. Delta-sync (var 5 min) fyller på senaste
      # mail efter bootstrap, så äldre historik läses on-demand vid behov.
      - key: ARCANA_BOOTSTRAP_MAILBOX_LOOKBACK_DAYS
        value: "14"
      - key: ARCANA_BOOTSTRAP_PREFERRED_MAILBOX
        value: contact@hairtpclinic.com
      - key: ARCANA_BOOTSTRAP_TENANT_ID
        value: hair-tp-clinic
      - key: ARCANA_BOOTSTRAP_DELAY_MS
        value: "5000"
      # Endast preferred mailbox vid start — minskar OOM-risk (502) på Render Standard.
      - key: ARCANA_BOOTSTRAP_PHASE1_ONLY
        value: "true"
      # Byggfas: MFA av tills allt är klart (sätt true + owner_mfa_enforced vid go-live).
      # Webb-bokning: MEDVETET AV, se .cursor/rules/website-booking-policy.mdc.
      # 2026-08-08: bekräftat i Render Dashboard att värdet redan är explicit
      # "false" (inte tomt, inte borttaget). Den tidigare ORD-74-kommentaren här
      # instruerade felaktigt att TA BORT variabeln så config.js default (true)
      # skulle gälla — det hade brutit mot policyn. Ersatt med denna rad så
      # Blueprint-synk inte kan skriva över det skyddande värdet i Dashboard.
      - key: ARCANA_PUBLIC_WEB_BOOKING_ENABLED
        value: "false"
      - key: ARCANA_CLIENTO_INTEGRATION_ENABLED
        value: "false"
      - key: ARCANA_AUTH_OWNER_MFA_REQUIRED
        value: "false"
      - key: ARCANA_PREFLIGHT_READINESS_CHECKS
        value: cors_strict
      # MFA reset: sätt till true manuellt i Render UI vid kontrollerad heal, sedan tillbaka false
      - key: ARCANA_BOOTSTRAP_RESET_OWNER_MFA
        value: "false"
      # CMO marketing connectors (Fas O) — enable in Render UI after secrets set
      - key: ARCANA_MARKETING_CONNECTORS_ENABLED
        value: "true"
      - key: ARCANA_MARKETING_CONNECTORS_MODE
        value: "fixture"
      - key: ARCANA_MARKETING_CONNECTORS_LIVE_FETCH
        value: "false"
      - key: ARCANA_MARKETING_GOOGLE_ADS_ENABLED
        value: "true"
      - key: ARCANA_MARKETING_META_ENABLED
        value: "true"
      - key: ARCANA_MARKETING_LINKEDIN_ENABLED
        value: "true"
      - key: ARCANA_MARKETING_GOOGLE_ADS_CUSTOMER_ID
        sync: false
      - key: ARCANA_MARKETING_GOOGLE_ADS_DEVELOPER_TOKEN
        sync: false
      - key: ARCANA_MARKETING_GOOGLE_ADS_ACCESS_TOKEN
        sync: false
      - key: ARCANA_MARKETING_META_AD_ACCOUNT_ID
        sync: false
      - key: ARCANA_MARKETING_META_ACCESS_TOKEN
        sync: false
      - key: ARCANA_MARKETING_LINKEDIN_AD_ACCOUNT_ID
        sync: false
      - key: ARCANA_MARKETING_LINKEDIN_ACCESS_TOKEN
        sync: false
      - key: ARCANA_GOOGLE_DRIVE_FOLDER_ID
        sync: false
      - key: ARCANA_GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: ARCANA_MIGRATION_INDEX_PATH
        value: /var/data/arcana/migration-index.json
      # CCO inkorg: scoped-analys. Truth-delta-interval 0 = av (Dashboard-läge ORD-74).
      - key: ARCANA_SCHEDULER_CCO_TRUTH_DELTA_INTERVAL_MINUTES
        value: "0"
      - key: ARCANA_SCHEDULER_CCO_HISTORY_MAILBOX_IDS
        value: kons@hairtpclinic.com,info@hairtpclinic.com,contact@hairtpclinic.com,halso@hairtpclinic.com,egzona@hairtpclinic.com,fazli@hairtpclinic.com,marknad@hairtpclinic.com,kvitto@hairtpclinic.com
      - key: ARCANA_SCHEDULER_CCO_INBOX_SCOPED_LOOKBACK_DAYS
        value: "3"
      - key: ARCANA_SCHEDULER_CCO_INBOX_SCOPED_MAX_MESSAGES_PER_USER
        value: "20"
      # CCO Mail Ingestion Pipeline (read-only default; webhooks off until subscription created).
      - key: ARCANA_CCO_MAIL_INGESTION_ENABLED
        value: "true"
      # Narrow prod-safe carveout: enable only the read-only CCO ingestion store/queue.
      # Global ARCANA_PROD_SAFE_MODE stays on; live-send remains gated separately.
      - key: ARCANA_CCO_MAIL_INGESTION_PROD_SAFE_ENABLED
        value: "true"
      - key: ARCANA_CCO_MAIL_INGESTION_MODE
        value: "read_only"
      - key: ARCANA_CCO_MAIL_INGESTION_DEFAULT_MAILBOX
        value: "kons@hairtpclinic.com"
      # Graph change notifications — live Dashboard-läge (ORD-74 avstämning).
      - key: ARCANA_GRAPH_CHANGE_NOTIFICATIONS_ENABLED
        value: "true"
      - key: ARCANA_GRAPH_CHANGE_NOTIFICATION_CLIENT_STATE
        value: "arcana-cco-mail-ingestion"
      - key: ARCANA_CCO_MAIL_INGESTION_QUEUE_BATCH_SIZE
        value: "50"
      - key: ARCANA_CCO_MAIL_INGESTION_STARTUP_RESUME_DELAY_MS
        value: "180000"
      # När den globala schedulern är avstängd synkar denna smala poller alla
      # synliga CCO-mailboxar via read-only Graph delta (inkorg + skickat).
      # Den kör fortfarande en mailbox åt gången för att inte bygga en bred
      # Graph- eller minnestopp under den pågående stabiliseringen.
      - key: ARCANA_CCO_MAIL_INGESTION_POLL_ENABLED
        value: "true"
      - key: ARCANA_CCO_MAIL_INGESTION_POLL_INTERVAL_MINUTES
        value: "1"
      - key: ARCANA_CCO_MAIL_INGESTION_POLL_MAX_MAILBOXES_PER_CYCLE
        value: "1"
      - key: ARCANA_CCO_MAIL_INGESTION_POLL_MAILBOXES
        value: kons@hairtpclinic.com,info@hairtpclinic.com,contact@hairtpclinic.com,egzona@hairtpclinic.com,fazli@hairtpclinic.com,marknad@hairtpclinic.com,kvitto@hairtpclinic.com,halso@hairtpclinic.com
      # One.com/externa CCO-mailboxar pollas separat och read-only.
      # ORD-78: håll POLL_ENABLED=false i blueprint tills strömningsfix + RSS
      # verifierats. Claude/Fazli slår på flaggorna manuellt efter gate.
      - key: ARCANA_CCO_IMAP_POLL_ENABLED
        value: "false"
      # ORD-78: 3 minuter var intervallet som körde slut på minnet mot just
      # den här brevlådan. 30 minuter ger varje cykel tid att slutföra och
      # frigöra innan nästa startar. Måste vara på plats INNAN POLL_ENABLED
      # sätts till true.
      - key: ARCANA_CCO_IMAP_POLL_INTERVAL_MINUTES
        value: "30"
      - key: ARCANA_CCO_IMAP_MAX_MESSAGES_PER_CYCLE
        value: "25"
      # Separat queue-jobb avstangt; truth-delta-jobbet kor en liten ingestion-batch efter ny mail.
      - key: ARCANA_SCHEDULER_CCO_MAIL_INGESTION_QUEUE_INTERVAL_MINUTES
        value: "0"
      # Truth-store får växa till ~2GB (10GB disk). 150MB-cap raderade store vid varje omstart.
      - key: ARCANA_STARTUP_CCO_MAILBOX_TRUTH_STORE_MAX_BYTES
        value: "2147483648"
      # ORD-74 2026-07-17: Drive-ingest klar — schedulern PÅ. Dashboard hade ENABLED=false
      # medan override-filen tände den; yaml behåller true så sync+DELETE override blir ren env-styrning.
      - key: ARCANA_SCHEDULER_ENABLED
        value: "true"
      - key: ARCANA_SCHEDULER_PROD_SAFE_MODE
        value: "false"
      # Tom = alla obligatoriska jobb (inkl. tenant access-check, ORD-73). Kända gröna
      # läget från 13/7; allowlisten saknade ORD-73-jobbet.
      - key: ARCANA_SCHEDULER_JOBS
        value: ""
      # Dashboard-läge (ORD-74): startup-jobb på efter fryslyft.
      - key: ARCANA_SCHEDULER_RUN_ON_STARTUP
        value: "true"
      # Retention för state-backups (backup_prune) — defaults, explicit i blueprint.
      - key: ARCANA_BACKUP_RETENTION_MAX_FILES
        value: "50"
      - key: ARCANA_BACKUP_RETENTION_MAX_AGE_DAYS
        value: "30"
      # Photo Review canary — Dashboard-tak (ORD-74 avstämning).
      - key: ENABLE_CCO_OPERATOR_CANARY
        value: "true"
      - key: ENABLE_PHOTO_REVIEW_WRITE
        value: "true"
      - key: ENABLE_PHOTO_REVIEW_CANARY_ON_PROD
        value: "true"
      - key: PHOTO_REVIEW_CANARY_MAX_DECISIONS
        value: "500"
      # Import Review — controlled completion canary (max 25 beslut/batch, stark match only)
      - key: ENABLE_IMPORT_REVIEW_WRITE
        value: "true"
      - key: IMPORT_REVIEW_CANARY_MAX_DECISIONS
        value: "25"
      # Drive Import Review R2 — Dashboard-tak (ORD-74 avstämning).
      - key: ENABLE_DRIVE_IMPORT_REVIEW_WRITE
        value: "true"
      - key: DRIVE_IMPORT_REVIEW_CANARY_MAX_DECISIONS
        value: "317"
