    <script>
      /* CCO Sprint 19B.3 — Offer from Plan-bridge UI
       *
       * Modal som öppnas från patientkortets Behandlingsplan-sektion.
       * Hämtar plan-detaljer + bygger offert-draft via POST /api/v1/cco-offers/from-plan.
       *
       * Flöde:
       *  1. Klick "💼 Skapa offert" på en plan-rad
       *  2. Modal hämtar plan (teknik, areaSpecs, totalGrafts, providerComment, assetId, annotationId)
       *  3. Visar förslag: items pre-fyllda från areaSpecs, pris-ruta tom
       *  4. Spara → POST → offerId tillbaka → notify + refresh
       *  5. Plan markeras 'sent_to_offer' automatiskt av backend
       */
      (function () {
        'use strict';

        function esc(s) {
          return String(s == null ? '' : s).replace(
            /[&<>"']/g,
            (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]
          );
        }

        async function audit(kind, detail) {
          try {
            await fetch('/api/v1/cco-audit', {
              method: 'POST',
              credentials: 'same-origin',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                kind,
                surface: 'cco.offer_from_plan.ui',
                ts: new Date().toISOString(),
                detail,
              }),
              keepalive: true,
            });
          } catch {}
        }

        function close() {
          document.querySelectorAll('.ofp-backdrop').forEach((b) => b.remove());
        }

        async function fetchPlan(planId) {
          try {
            const r = await fetch(`/api/v1/cco-treatment-plans/${encodeURIComponent(planId)}`, {
              credentials: 'same-origin',
            });
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return await r.json();
          } catch (err) {
            return null;
          }
        }

        function estimatePrice(plan) {
          // Standard-pris/graft baserat på teknik (kan justeras av user)
          const PRICE_PER_GRAFT = {
            fue: 30,
            dhi: 35,
            beard_fue: 32,
            eyebrow_dhi: 40,
            prp_hair: 0,
            prp_skin: 0,
          };
          const per = PRICE_PER_GRAFT[plan.technique] || 30;
          return plan.totalGraftEstimate ? plan.totalGraftEstimate * per : 0;
        }

        async function open({ customerId, planId, onCreated }) {
          close();
          const back = document.createElement('div');
          back.className = 'ofp-backdrop';
          back.innerHTML = `
      <div class="ofp-modal" role="dialog" aria-modal="true">
        <header class="ofp-head">
          <h3>💼 Skapa offert från behandlingsplan</h3>
          <button class="ofp-close" aria-label="Stäng">✕</button>
        </header>
        <div class="ofp-body" data-ofp-body><div class="ofp-loading">Hämtar plan-detaljer…</div></div>
        <footer class="ofp-foot" data-ofp-foot></footer>
      </div>`;
          document.body.appendChild(back);
          back.querySelector('.ofp-close').onclick = () => {
            audit('offer_from_plan.cancelled', { customerId, planId });
            close();
          };
          back.addEventListener('click', (e) => {
            if (e.target === back) close();
          });
          document.addEventListener('keydown', function esc2(ev) {
            if (ev.key === 'Escape') {
              close();
              document.removeEventListener('keydown', esc2);
            }
          });

          audit('offer_from_plan.opened', { customerId, planId });

          const plan = await fetchPlan(planId);
          if (!plan) {
            back.querySelector('[data-ofp-body]').innerHTML =
              `<div class="ofp-error">Kunde inte hämta plan ${esc(planId)}.</div>`;
            return;
          }
          if (plan.status === 'converted_to_offer') {
            back.querySelector('[data-ofp-body]').innerHTML =
              `<div class="ofp-warn">Denna plan är redan kopplad till offert <code>${esc(plan.offerId)}</code>.</div>`;
            back.querySelector('[data-ofp-foot]').innerHTML =
              `<button class="ofp-btn ofp-btn--ghost" data-ofp-close-btn>Stäng</button>`;
            back.querySelector('[data-ofp-close-btn]').onclick = close;
            return;
          }

          renderForm(back, customerId, plan, onCreated);
        }

        function renderForm(back, customerId, plan, onCreated) {
          const body = back.querySelector('[data-ofp-body]');
          const foot = back.querySelector('[data-ofp-foot]');
          const suggestedPrice = estimatePrice(plan);

          const treatmentLabel = `${(plan.technique || '').toUpperCase()}${plan.totalGraftEstimate ? ` · ~${plan.totalGraftEstimate} grafts` : ''}`;
          const items = (plan.areaSpecs || []).map((s, i) => ({
            i,
            label: `${s.area} (${s.technique || plan.technique || 'fue'})`,
            estimatedGrafts: s.estimatedGrafts || '',
            sessionCount: s.sessionCount || 1,
            note: s.note || '',
          }));

          body.innerHTML = `
      <div class="ofp-context">
        <div class="ofp-context-row">
          <span class="ofp-context-label">Plan</span>
          <span class="ofp-context-value">${esc(treatmentLabel)} · v${plan.version}</span>
        </div>
        ${plan.annotationId ? `<div class="ofp-context-row"><span class="ofp-context-label">Ritning</span><span class="ofp-context-value">Kopplad: ${esc(plan.annotationId.slice(0, 8))}</span></div>` : ''}
        ${plan.assetId ? `<div class="ofp-context-row"><span class="ofp-context-label">Bild</span><span class="ofp-context-value">${esc(plan.assetId.slice(0, 8))}</span></div>` : ''}
        ${plan.providerComment ? `<div class="ofp-context-row"><span class="ofp-context-label">Kommentar</span><span class="ofp-context-value">${esc(plan.providerComment)}</span></div>` : ''}
      </div>

      <div class="ofp-items">
        <div class="ofp-section-title">Områden från plan (auto-importerade)</div>
        ${
          items.length
            ? items
                .map(
                  (it) => `
          <div class="ofp-item-row">
            <span class="ofp-item-label">${esc(it.label)}</span>
            <span class="ofp-item-grafts">${it.estimatedGrafts ? esc(it.estimatedGrafts) + ' grafts' : '—'}</span>
            <span class="ofp-item-sessions">${it.sessionCount} session</span>
          </div>`
                )
                .join('')
            : '<em>Inga områden i planen.</em>'
        }
      </div>

      <div class="ofp-form">
        <label class="ofp-field">
          <span>Pris totalt (SEK)</span>
          <input type="number" min="0" step="100" value="${suggestedPrice}" data-ofp-price>
          <small>Förslag baserat på teknik × graft-estimat.</small>
        </label>
        <label class="ofp-field">
          <span>Giltighet (dagar)</span>
          <input type="number" min="1" max="365" value="14" data-ofp-validity>
        </label>
        <label class="ofp-field">
          <span>Kundnamn (visas på offert)</span>
          <input type="text" placeholder="Lämna tomt = hämta från kundregister" data-ofp-customer-name>
        </label>
        <label class="ofp-field">
          <span>Anteckning (visas i offert)</span>
          <textarea rows="3" data-ofp-notes>${esc(plan.providerComment || '')}</textarea>
        </label>
      </div>

      <div class="ofp-safety">
        ⚖️ Offerten skapas som <b>draft</b> och måste manuellt skickas/godkännas. Inga Drive-länkar.
        Offerten kopplas till bild, ritning och plan via referens-IDs.
      </div>`;
          foot.innerHTML = `
      <button class="ofp-btn ofp-btn--ghost" data-ofp-cancel>Avbryt</button>
      <button class="ofp-btn ofp-btn--primary" data-ofp-create>✓ Skapa offert-draft</button>`;

          foot.querySelector('[data-ofp-cancel]').onclick = close;
          foot.querySelector('[data-ofp-create]').onclick = () =>
            createOffer(back, customerId, plan, onCreated);
        }

        async function createOffer(back, customerId, plan, onCreated) {
          const priceTotal = parseInt(back.querySelector('[data-ofp-price]').value, 10) || 0;
          const validityDays = parseInt(back.querySelector('[data-ofp-validity]').value, 10) || 14;
          const customerName = back.querySelector('[data-ofp-customer-name]').value || null;
          const notes = back.querySelector('[data-ofp-notes]').value || '';

          audit('offer_from_plan.submit', { customerId, planId: plan.planId, priceTotal });

          try {
            const r = await fetch('/api/v1/cco-offers/from-plan', {
              method: 'POST',
              credentials: 'same-origin',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                planId: plan.planId,
                priceTotal,
                customerName,
                notes,
                validityDays,
              }),
            });
            const j = await r.json();
            if (!r.ok) throw new Error(j.error || 'HTTP ' + r.status);

            audit('offer_from_plan.created', {
              customerId,
              planId: plan.planId,
              offerId: j.offerId,
              priceTotal,
            });
            // Visa eftersteg: preview PDF + skapa kundlänk
            renderAfterCreateActions(back, customerId, j.offerId, plan.planId, onCreated);
          } catch (err) {
            alert('Kunde inte skapa offert: ' + err.message);
          }
        }

        function renderAfterCreateActions(back, customerId, offerId, planId, onCreated) {
          const body = back.querySelector('[data-ofp-body]');
          const foot = back.querySelector('[data-ofp-foot]');
          body.innerHTML = `
      <div class="ofp-success">
        <div style="font-size:32px;text-align:center;margin-bottom:6px">✓</div>
        <div class="ofp-section-title">Offert-draft skapad</div>
        <p>Offert <code>${offerId.slice(0, 8)}</code> är sparad som draft. Vad vill du göra härnäst?</p>
      </div>
      <div class="ofp-after-actions">
        <button class="ofp-action-card" data-ofp-do="preview">
          <div class="ofp-action-ico">👁</div>
          <div class="ofp-action-text"><strong>Förhandsvisa PDF</strong><br><small>Öppna A4-vy med DRAFT-stämpel</small></div>
        </button>
        <button class="ofp-action-card" data-ofp-do="generate-pdf">
          <div class="ofp-action-ico">📄</div>
          <div class="ofp-action-text"><strong>Generera & spara PDF</strong><br><small>Spara i secure storage + lägg på patientkort</small></div>
        </button>
        <button class="ofp-action-card" data-ofp-do="portal-link">
          <div class="ofp-action-ico">🔗</div>
          <div class="ofp-action-text"><strong>Skapa säker kundlänk</strong><br><small>Riskbaserad token · BankID ej default</small></div>
        </button>
      </div>`;
          foot.innerHTML = `<button class="ofp-btn ofp-btn--ghost" data-ofp-done>Klar</button>`;

          body.querySelector('[data-ofp-do="preview"]').onclick = () => {
            audit('offer.preview_clicked', { offerId, customerId });
            window.open(`/api/v1/cco-offers/${offerId}/preview.html`, '_blank', 'noopener');
          };
          body.querySelector('[data-ofp-do="generate-pdf"]').onclick = async () => {
            audit('offer.generate_pdf_clicked', { offerId, customerId });
            try {
              const r = await fetch(`/api/v1/cco-offers/${offerId}/pdf`, {
                method: 'POST',
                credentials: 'same-origin',
                headers: { 'Content-Type': 'application/json' },
                body: '{}',
              });
              const j = await r.json();
              if (!r.ok) throw new Error(j.error || 'HTTP ' + r.status);
              const note = j.storageKey
                ? `Sparad: ${j.storageKey}`
                : 'PDF genererad (secure storage saknas i denna miljö)';
              alert(
                `✓ PDF genererad (${(j.sizeBytes / 1024).toFixed(1)} KB).\n${note}\nLäggs på patientkortet under Offert.`
              );
              if (window.CCOPatientCardSections?.refresh) window.CCOPatientCardSections.refresh();
            } catch (err) {
              alert('PDF-render: ' + err.message);
            }
          };
          body.querySelector('[data-ofp-do="portal-link"]').onclick = async () => {
            audit('offer.create_portal_link_clicked', { offerId, customerId });
            try {
              const r = await fetch('/api/v1/cco-portal-links', {
                method: 'POST',
                credentials: 'same-origin',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  customerId,
                  resourceKind: 'offer_view',
                  resourceId: offerId,
                  contextNote: `Offert ${offerId}`,
                }),
              });
              const j = await r.json();
              if (!r.ok) throw new Error(j.error || 'HTTP ' + r.status);
              const url = `${location.origin}/portal/r/${j.token}`;
              await navigator.clipboard?.writeText(url).catch(() => {});
              alert(
                `✓ Säker länk skapad (risk: ${j.riskClass}, giltig till ${j.expiresAt.slice(0, 16).replace('T', ' ')})\n\nKopierad till clipboard:\n${url}\n\nIngen patientdata i URL — token är opaque.`
              );
            } catch (err) {
              alert('Kundlänk: ' + err.message);
            }
          };
          foot.querySelector('[data-ofp-done]').onclick = () => {
            close();
            if (typeof onCreated === 'function') onCreated({ offerId, planId });
          };
        }

        window.CCOOfferFromPlan = { open, close };
      })();
    </script>
    <script>
      /* CCO Sprint 19C.3 — Ta bild för patientkort
       *
       * UI: modal med två alternativ:
       *  1. 📷 Använd kameran (getUserMedia → canvas capture)
       *  2. 📁 Ladda upp fil (input[type=file])
       *
       * Per upload:
       *  - patientId (krävs)
       *  - encounterId (om besök finns/valt)
       *  - takenBy (auto från role)
       *  - takenAt (now)
       *  - phase (treatment/consultation/follow_up/before/after)
       *  - subject (scalp/hairline/donor/recipient/portrait/...)
       *  - kategori-fallback NEEDS_REVIEW om subject inte angivet
       *
       * Backend: POST /api/v1/cco/assets (skapar patient_asset)
       * Audit + timeline-event.
       * INGA Drive-länkar. Lagras i CCO secure storage.
       */
      (function () {
        'use strict';

        const PHASES = [
          { id: 'consultation', label: 'Konsultation' },
          { id: 'pre_treatment', label: 'Före behandling' },
          { id: 'treatment', label: 'Under behandling' },
          { id: 'post_treatment', label: 'Efter behandling' },
          { id: 'follow_up', label: 'Uppföljning' },
        ];
        const SUBJECTS = [
          { id: 'scalp', label: 'Skalp' },
          { id: 'hairline', label: 'Hairline' },
          { id: 'donor', label: 'Donor' },
          { id: 'recipient', label: 'Recipient' },
          { id: 'top', label: 'Ovanifrån' },
          { id: 'back', label: 'Bakifrån' },
          { id: 'side_left', label: 'Vänster sida' },
          { id: 'side_right', label: 'Höger sida' },
          { id: 'portrait', label: 'Porträtt' },
          { id: 'other', label: 'Annat' },
        ];

        function esc(s) {
          return String(s == null ? '' : s).replace(
            /[&<>"']/g,
            (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]
          );
        }

        async function audit(kind, detail) {
          try {
            await fetch('/api/v1/cco-audit', {
              method: 'POST',
              credentials: 'same-origin',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                kind,
                surface: 'cco.take_photo',
                ts: new Date().toISOString(),
                detail,
              }),
              keepalive: true,
            });
          } catch {}
        }

        let state = null;

        function close() {
          document.querySelectorAll('.tp-backdrop').forEach((b) => b.remove());
          state = null;
        }

        async function open({ customerId, encounterId = null, onCaptured }) {
          if (!customerId) {
            alert('customerId saknas');
            return;
          }
          close();
          state = {
            customerId,
            encounterId,
            capturedBlob: null,
            capturedDataUrl: null,
            mediaStream: null,
          };
          const back = document.createElement('div');
          back.className = 'tp-backdrop';
          back.innerHTML = `
      <div class="tp-modal" role="dialog" aria-modal="true">
        <header class="tp-head">
          <h3>📷 Ta bild för patientkort</h3>
          <button class="tp-close" aria-label="Stäng">✕</button>
        </header>
        <div class="tp-body" data-tp-body></div>
        <footer class="tp-foot" data-tp-foot></footer>
      </div>`;
          document.body.appendChild(back);
          back.querySelector('.tp-close').onclick = () => {
            stopCamera();
            audit('take_photo.cancelled', { customerId });
            close();
          };
          back.addEventListener('click', (e) => {
            if (e.target === back) {
              stopCamera();
              close();
            }
          });
          document.addEventListener('keydown', function escH(ev) {
            if (ev.key === 'Escape') {
              stopCamera();
              close();
              document.removeEventListener('keydown', escH);
            }
          });

          audit('take_photo.opened', { customerId, encounterId });
          renderSourcePicker(back);
        }

        function renderSourcePicker(back) {
          const body = back.querySelector('[data-tp-body]');
          const foot = back.querySelector('[data-tp-foot]');
          body.innerHTML = `
      <div class="tp-step-kicker">Steg 1 av 2 · Välj källa</div>
      <div class="tp-source-cards">
        <button class="tp-source-card" data-tp-source="camera">
          <div class="tp-source-ico">📷</div>
          <div class="tp-source-text"><strong>Använd kameran</strong><br><small>Klinik-kamera eller mobil</small></div>
        </button>
        <button class="tp-source-card" data-tp-source="upload">
          <div class="tp-source-ico">📁</div>
          <div class="tp-source-text"><strong>Ladda upp fil</strong><br><small>JPEG / PNG / HEIC</small></div>
        </button>
      </div>
      <input type="file" accept="image/*" capture="environment" data-tp-file-input style="display:none">`;
          foot.innerHTML = `<button class="tp-btn tp-btn--ghost" data-tp-cancel>Avbryt</button>`;
          foot.querySelector('[data-tp-cancel]').onclick = () => {
            stopCamera();
            close();
          };
          body.querySelector('[data-tp-source="camera"]').onclick = () => startCamera(back);
          body.querySelector('[data-tp-source="upload"]').onclick = () =>
            body.querySelector('[data-tp-file-input]').click();
          body.querySelector('[data-tp-file-input]').onchange = async (e) => {
            const file = e.target.files?.[0];
            if (!file) return;
            const dataUrl = await blobToDataUrl(file);
            state.capturedBlob = file;
            state.capturedDataUrl = dataUrl;
            audit('take_photo.uploaded', {
              customerId: state.customerId,
              sizeBytes: file.size,
              mimeType: file.type,
            });
            renderMetadataForm(back);
          };
        }

        async function startCamera(back) {
          const body = back.querySelector('[data-tp-body]');
          body.innerHTML = `
      <div class="tp-step-kicker">Steg 1 av 2 · Kamera</div>
      <div class="tp-camera-wrap">
        <video data-tp-video autoplay playsinline muted style="width:100%;border-radius:12px;background:#000"></video>
      </div>
      <div class="tp-camera-actions">
        <button class="tp-btn tp-btn--primary" data-tp-capture>📷 Ta bild</button>
        <button class="tp-btn tp-btn--ghost" data-tp-camera-cancel>Avbryt</button>
      </div>`;
          const video = body.querySelector('[data-tp-video]');
          try {
            state.mediaStream = await navigator.mediaDevices.getUserMedia({
              video: { facingMode: 'environment' },
            });
            video.srcObject = state.mediaStream;
            audit('take_photo.camera_started', { customerId: state.customerId });
          } catch (err) {
            body.innerHTML = `<div class="tp-error">Kunde inte starta kamera: ${esc(err.message)}<br><small>Använd "Ladda upp fil" istället.</small></div>
        <button class="tp-btn tp-btn--ghost" data-tp-back>← Tillbaka</button>`;
            body.querySelector('[data-tp-back]').onclick = () => renderSourcePicker(back);
            return;
          }
          body.querySelector('[data-tp-capture]').onclick = () => captureFromVideo(back, video);
          body.querySelector('[data-tp-camera-cancel]').onclick = () => {
            stopCamera();
            renderSourcePicker(back);
          };
        }

        function stopCamera() {
          if (state?.mediaStream) {
            state.mediaStream.getTracks().forEach((t) => t.stop());
            state.mediaStream = null;
          }
        }

        function captureFromVideo(back, video) {
          const canvas = document.createElement('canvas');
          canvas.width = video.videoWidth || 1280;
          canvas.height = video.videoHeight || 720;
          canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
          canvas.toBlob(
            (blob) => {
              state.capturedBlob = blob;
              state.capturedDataUrl = canvas.toDataURL('image/jpeg', 0.85);
              stopCamera();
              audit('take_photo.captured', {
                customerId: state.customerId,
                sizeBytes: blob.size,
                width: canvas.width,
                height: canvas.height,
              });
              renderMetadataForm(back);
            },
            'image/jpeg',
            0.85
          );
        }

        function renderMetadataForm(back) {
          const body = back.querySelector('[data-tp-body]');
          const foot = back.querySelector('[data-tp-foot]');
          body.innerHTML = `
      <div class="tp-step-kicker">Steg 2 av 2 · Metadata</div>
      <div class="tp-preview-wrap">
        <img src="${state.capturedDataUrl}" alt="Förhandsvisning" class="tp-preview">
      </div>
      <div class="tp-form">
        <label class="tp-field">
          <span>Fas</span>
          <select data-tp-phase>
            ${PHASES.map((p) => `<option value="${p.id}">${esc(p.label)}</option>`).join('')}
          </select>
        </label>
        <label class="tp-field">
          <span>Bildtyp</span>
          <select data-tp-subject>
            <option value="">— välj —</option>
            ${SUBJECTS.map((s) => `<option value="${s.id}">${esc(s.label)}</option>`).join('')}
          </select>
        </label>
        <label class="tp-field">
          <span>Behandling (om relevant)</span>
          <select data-tp-treatment>
            <option value="">—</option>
            <option value="fue">FUE</option>
            <option value="dhi">DHI</option>
            <option value="prp_hair">PRP hår</option>
            <option value="botox">Botox</option>
            <option value="bleph">Bleph</option>
          </select>
        </label>
        <label class="tp-field">
          <span>Anteckning (frivilligt)</span>
          <input type="text" placeholder="t.ex. Före session 3 av 6" data-tp-note maxlength="200">
        </label>
      </div>
      <div class="tp-safety">🔒 Bilden sparas i CCO secure storage. EXIF rensas automatiskt. Inga Drive-länkar.</div>`;
          foot.innerHTML = `
      <button class="tp-btn tp-btn--ghost" data-tp-back>← Ta ny bild</button>
      <button class="tp-btn tp-btn--primary" data-tp-save>✓ Spara på patientkort</button>`;
          foot.querySelector('[data-tp-back]').onclick = () => renderSourcePicker(back);
          foot.querySelector('[data-tp-save]').onclick = () => savePhoto(back);
        }

        async function savePhoto(back) {
          const phase = back.querySelector('[data-tp-phase]').value;
          const subject = back.querySelector('[data-tp-subject]').value || null;
          const treatmentKey = back.querySelector('[data-tp-treatment]').value || null;
          const note = back.querySelector('[data-tp-note]').value || '';

          const formData = new FormData();
          formData.append(
            'file',
            state.capturedBlob,
            `patient-${state.customerId}-${Date.now()}.jpg`
          );
          if (state.encounterId) formData.append('encounterId', state.encounterId);
          formData.append('phase', phase);
          if (subject) formData.append('subject', subject);
          if (treatmentKey) formData.append('treatmentKey', treatmentKey);
          if (note) formData.append('note', note);
          formData.append('takenAt', new Date().toISOString());
          formData.append('needsReview', subject ? 'false' : 'true');

          try {
            // Använd den nya wrapper-endpointen som tar patientId i URL
            const r = await fetch(
              `/api/v1/cco/patient/${encodeURIComponent(state.customerId)}/take-photo`,
              {
                method: 'POST',
                credentials: 'same-origin',
                body: formData,
              }
            );
            const j = await r.json();
            if (!r.ok) throw new Error(j.error || 'HTTP ' + r.status);
            audit('take_photo.saved', {
              customerId: state.customerId,
              encounterId: state.encounterId,
              assetId: j.assetId || j.id,
              phase,
              subject,
              treatmentKey,
              sizeBytes: state.capturedBlob.size,
              needsReview: !subject,
            });
            alert(
              `✓ Bild sparad på patientkort (${(state.capturedBlob.size / 1024).toFixed(1)} KB).${!subject ? '\n⚠️ Markerad NEEDS_REVIEW — saknar bildtyp.' : ''}`
            );
            const cb = back.dataset.onCaptured;
            close();
            if (typeof window.__tpOnCaptured === 'function') window.__tpOnCaptured();
          } catch (err) {
            alert('Kunde inte spara bild: ' + err.message);
          }
        }

        function blobToDataUrl(blob) {
          return new Promise((res, rej) => {
            const r = new FileReader();
            r.onload = () => res(r.result);
            r.onerror = rej;
            r.readAsDataURL(blob);
          });
        }

        // Public API
        window.CCOTakePhoto = {
          open: ({ customerId, encounterId, onCaptured }) => {
            window.__tpOnCaptured = onCaptured;
            return open({ customerId, encounterId });
          },
          close,
        };
      })();
    </script>
  </body>
</html>
