      function svgUrl(id) {
        const i = id && id.length ? id.charCodeAt(id.length - 1) % SVG_TEMPLATES.length : 0;
        return 'data:image/svg+xml;utf8,' + encodeURIComponent(SVG_TEMPLATES[i]);
      }
      function rewriteImgs(root) {
        (root || document)
          .querySelectorAll('img.pc-row-thumb, img.pc-tile-img, .pc-summary-thumb img')
          .forEach((img) => {
            const s = img.getAttribute('src') || '';
            if (s.includes('/cco/assets/') && s.includes('/download')) {
              const m = s.match(/\/assets\/([^/?]+)/);
              img.removeAttribute('onerror');
              img.style.display = '';
              img.src = svgUrl(m ? m[1] : '');
            }
          });
      }

        _obs.observe(document.body, { childList: true, subtree: true });

        if (u.startsWith('/api/v1/cco-treatment-plans') && o && o.method === 'POST')

        if (u.startsWith('/api/v1/cco-offers/from-plan')) {

              needsReview: false,

          };
        return _of ? _of(u, o) : { ok: false, status: 404 };

        border-radius: 8px;
        background: #f5efe6;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        font-size: 20px;
        border: 1px solid rgba(132, 117, 107, 0.18);
        object-fit: cover;
      }
      .pc-row-thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .pc-row-thumb--svg svg {
        width: 32px;
        height: 32px;
      }
      .pc-row-thumb--plan,
      .pc-row-thumb--offer {
        flex-direction: column;
        gap: 1px;
        font-size: 18px;
      }
      .pc-row-thumb-meta {
        font-size: 7.5px;
        font-weight: 800;
        color: #84756b;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        line-height: 1.1;
        text-align: center;
        max-width: 46px;
      }
      .pc-row-thumb--doc {
        background: linear-gradient(180deg, #fff, #f5efe6);
      }

      /* === Galleri-grid för Bilder + Ritningar === */
      .pc-gallery {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 14px;
        padding: 8px 12px 14px;
      }

      /* Tilen är transparent — bara bilden bär en ram. Text + bubblor flyter mot dossier-bg */
      .pc-tile {
        position: relative;
        cursor: pointer;
        background: transparent;
        border: 0;
        box-shadow: none;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .pc-tile:hover .pc-tile-img,
      .pc-tile:hover .pc-tile-svg,
      .pc-tile:hover .pc-tile-needs {
        transform: translateY(-2px);
        box-shadow:
          0 10px 22px rgba(56, 40, 28, 0.18),
          0 3px 6px rgba(56, 40, 28, 0.1),
          inset 0 1px 0 rgba(255, 255, 255, 0.85);
      }
      .pc-tile.is-needs-review .pc-tile-img,
      .pc-tile.is-needs-review .pc-tile-needs {
        box-shadow:
          0 6px 14px rgba(200, 130, 30, 0.22),
          0 0 0 2px rgba(200, 130, 30, 0.55),
          inset 0 1px 0 rgba(255, 255, 255, 0.85);
      }

      /* Bilden — fristående pop-kort med tydlig skugga */
      .pc-tile-img,
      .pc-tile-svg,
      .pc-tile-needs {
        width: 100%;
        aspect-ratio: 1/1;
        object-fit: cover;
        background: #d4c4b8;
        display: block;
        border-radius: 14px;
        transition:
          transform 0.16s ease,
          box-shadow 0.16s ease;
        box-shadow:
          0 6px 16px rgba(56, 40, 28, 0.14),
          0 1px 3px rgba(56, 40, 28, 0.06),
          inset 0 1px 0 rgba(255, 255, 255, 0.45);
      }
      .pc-tile-svg,
      .pc-tile-needs {
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #f5efe6, #e8d8c8);
      }
      .pc-tile-needs {
        background: linear-gradient(135deg, rgba(200, 130, 30, 0.18), rgba(200, 130, 30, 0.08));
        color: #c8821e;
        font-size: 28px;
        font-weight: 800;
      }

      /* Meta — fristående text under bilden, ingen bakgrund */
      .pc-tile-meta {
        padding: 0 4px;
        background: transparent;
        border: 0;
      }
      .pc-tile-date {
        font-size: 9.5px;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #84756b;
      }
      .pc-tile-label {
        font-size: 11.5px;
        font-weight: 700;
        color: #2b251f;
        line-height: 1.35;
        margin-top: 2px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        min-height: 31px;
      }
      .pc-tile-warn {
        font-size: 10px;
        color: #c8821e;
        font-weight: 700;
        margin-top: 3px;
      }

      /* Knappar — EXAKT Svarstudio-token (.tba-pill från konversationer.html bottom-bar) */
      .pc-tile-actions {
        display: flex;
        gap: 6px;
        justify-content: flex-start;
        padding: 0 0 2px;
        background: transparent;
        border: 0;
      }
      .pc-tile-btn {
        flex: 0 0 auto;
        appearance: none;
        cursor: pointer;
        padding: 4px 9px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.82);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(248, 241, 232, 0.88));
        font-family: inherit;
        font-size: 9.5px;
        font-weight: 800;
        letter-spacing: -0.005em;
        color: #2b251f;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        line-height: 1.1;
        white-space: nowrap;
        transition:
          transform 0.14s ease,
          box-shadow 0.14s ease;
        box-shadow:
          0 5px 12px rgba(56, 40, 28, 0.08),
          0 2px 5px rgba(56, 40, 28, 0.05),
          inset 0 1px 0 rgba(255, 255, 255, 0.92);
      }
      .pc-tile-btn:hover {
        transform: translateY(-1px);
        box-shadow:
          0 8px 18px rgba(56, 40, 28, 0.12),
          0 3px 7px rgba(56, 40, 28, 0.06),
          inset 0 1px 0 rgba(255, 255, 255, 0.92);
      }
      .pc-tile-btn:active {
        transform: translateY(0);
      }
      .pc-tile-btn-ico {
        display: inline-flex;
        align-items: center;
        color: currentColor;
      }
      .pc-tile-btn-ico svg {
        display: block;
        width: 10px;
        height: 10px;
      }
      /* Rita = grönt (kreativt/gå-vidare), Radera = ALLTID rött (universell delete) */
      .pc-tile-btn--draw {
        color: #4a8268;
      }
      .pc-tile-btn--delete {
        color: #b94a4a;
      }
      @media (max-width: 720px) {
        .pc-gallery {
          grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
          gap: 8px;
        }
        .pc-tile-btn {
          font-size: 10px;
        }
        .pc-tile-label {
          font-size: 11px;
          min-height: 30px;
        }
      }

      /* Mini-thumbnail-strip i sektion-summary (innan expand) */
      .pc-summary-strip {
        display: inline-flex;
        gap: 3px;
        margin-left: 8px;
        align-items: center;
      }
      .pc-summary-thumb {
        width: 28px;
        height: 28px;
        border-radius: 6px;
        object-fit: cover;
        background: #f5efe6;
        border: 1px solid rgba(132, 117, 107, 0.22);
        box-shadow: 0 1px 3px rgba(56, 40, 28, 0.1);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        overflow: hidden;
      }
      .pc-summary-thumb--svg svg {
        width: 22px;
        height: 22px;
      }
      .pc-summary-thumb--needs {
        background: rgba(200, 130, 30, 0.14);
        color: #c8821e;
        font-size: 14px;
        font-weight: 800;
      }
      .pc-summary-more {
        font-size: 10.5px;
        font-weight: 800;
        color: #84756b;
        padding: 4px 8px;
        background: rgba(132, 117, 107, 0.1);
        border-radius: 999px;
        margin-left: 2px;
      }
      @media (max-width: 720px) {
        .pc-summary-thumb {
          width: 24px;
          height: 24px;
        }
      }

      .pc-toolbar-action--primary {
        background: linear-gradient(180deg, #6fb595, #4a8268);
        color: #fff;
        border-color: #4a8268;
        font-weight: 800;
      }
      .pc-toolbar-action--primary:hover {
        background: linear-gradient(180deg, #7fc5a5, #5a9278);
      }

      .pc-loading,
      .pc-error,
      .pc-empty {
        padding: 10px 12px;
        font-size: 11.5px;
        color: var(--cco-text-tertiary, #84756b);
        font-style: italic;
        text-align: center;
        background: rgba(255, 255, 255, 0.5);
        border-radius: 10px;
      }
      .pc-error {
        color: var(--cco-status-danger, #b94a4a);
        font-style: normal;
        font-weight: 600;
      }

      .pc-toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        padding: 6px 4px 10px;
        margin-bottom: 4px;
        border-bottom: 1px solid rgba(132, 117, 107, 0.18);
      }
      .pc-toolbar-kicker {
        font-size: 9.5px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--accent-studio, #bb4779);
        margin-right: auto;
      }
      .pc-toolbar-action {
        appearance: none;
        border: 1px solid rgba(132, 117, 107, 0.24);
        cursor: pointer;
        padding: 4px 9px;
        border-radius: 999px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(244, 238, 232, 0.84));
        font-family: inherit;
        font-size: 10.5px;
        font-weight: 700;
        color: var(--cco-color-brand, #2b251f);
      }
      .pc-toolbar-action:hover {
        background: rgba(255, 255, 255, 1);
      }

      .pc-section {
        margin-bottom: 10px;
      }
      .pc-section summary {
        gap: 7px;
      }
      .pc-section-ico {
        display: inline-flex;
        width: 18px;
        height: 18px;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        flex-shrink: 0;
      }
      .pc-rows {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 6px 4px 8px;
      }
      .pc-row {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        padding: 9px 11px;
        border-radius: 11px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(247, 241, 236, 0.86));
        box-shadow:
          0 2px 6px rgba(56, 40, 28, 0.05),
          inset 0 1px 0 rgba(255, 255, 255, 0.88);
        border: 1px solid rgba(255, 255, 255, 0.7);
      }
      .pc-row.is-quick-open {
        cursor: pointer;
        transition:
          background 0.14s ease,
          transform 0.12s ease;
      }
      .pc-row.is-quick-open:hover {
        background: linear-gradient(180deg, rgba(252, 233, 240, 0.5), rgba(255, 255, 255, 0.95));
        transform: translateY(-1px);
        box-shadow:
          0 6px 14px rgba(187, 71, 121, 0.1),
          inset 0 1px 0 rgba(255, 255, 255, 0.88);
      }
      .pc-row.is-quick-open::after {
        content: '✎';
        position: absolute;
        right: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--accent-studio, #bb4779);
        opacity: 0;
        font-size: 14px;
        transition: opacity 0.14s;
        pointer-events: none;
      }
      .pc-row.is-quick-open {
        position: relative;
        padding-right: 36px;
      }
      .pc-row.is-quick-open:hover::after {
        opacity: 0.85;
      }

      .pc-row.is-needs-review {
        background: linear-gradient(180deg, rgba(255, 245, 230, 0.85), rgba(255, 228, 200, 0.7));
        border-left: 3px solid var(--cco-status-warning, #c8821e);
      }
      .pc-row-main {
        flex: 1;
        min-width: 0;
      }
      .pc-row-name {
        font-size: 12.5px;
        font-weight: 700;
        color: var(--cco-color-brand, #2b251f);
        line-height: 1.35;
        letter-spacing: -0.005em;
        font-variant-numeric: tabular-nums;
      }
      .pc-row-subline {
        font-size: 10.5px;
        color: var(--cco-text-secondary, rgba(70, 60, 50, 0.62));
        margin-top: 2px;
      }
      .pc-row-badges {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 5px;
      }
      .pc-badge {
        display: inline-flex;
        padding: 1px 7px;
        border-radius: 999px;
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 0.04em;
      }
      .pc-badge--success {
        background: rgba(74, 130, 104, 0.14);
        color: #366e4e;
      }
      .pc-badge--info {
        background: rgba(74, 123, 168, 0.14);
        color: #2a4d6e;
      }
      .pc-badge--warning {
        background: rgba(200, 130, 30, 0.16);
        color: #8a5a18;
      }
      .pc-badge--danger {
        background: rgba(185, 74, 74, 0.14);
        color: #8a3030;
      }
      .pc-badge--neutral {
        background: rgba(132, 117, 107, 0.16);
        color: #5f5450;
      }

      .pc-row-review {
        font-size: 10.5px;
        font-weight: 600;
        color: var(--cco-status-warning, #c8821e);
        margin-top: 4px;
      }
      .pc-row-tech {
        margin-top: 6px;
        font-size: 10px;
      }
      .pc-row-tech summary {
        font-size: 9.5px;
        font-weight: 700;
        color: var(--cco-text-tertiary, #84756b);
        cursor: pointer;
        padding: 2px 0;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .pc-row-tech dl {
        display: grid;
        grid-template-columns: 110px 1fr;
        gap: 2px 8px;
        margin: 4px 0 0;
        padding: 6px 8px;
        border-radius: 6px;
        background: rgba(132, 117, 107, 0.06);
        font-size: 10px;
      }
      .pc-row-tech dt {
        color: var(--cco-text-tertiary, #84756b);
        font-weight: 600;
      }
      .pc-row-tech dd {
        margin: 0;
        word-break: break-all;
        color: var(--cco-color-brand, #2b251f);
        font-variant-numeric: tabular-nums;
      }

      .pc-row-actions {
        display: flex;
        flex-direction: column;
        gap: 4px;
        flex-shrink: 0;
      }
      .pc-row-action {
        appearance: none;
        border: 1px solid rgba(132, 117, 107, 0.24);
        cursor: pointer;
        padding: 4px 10px;
        border-radius: 8px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.95), rgba(244, 238, 232, 0.88));
        font-family: inherit;
        font-size: 10.5px;
        font-weight: 700;
        color: var(--accent-studio, #bb4779);
        white-space: nowrap;
      }
      .pc-row-action:hover {
        background: rgba(255, 255, 255, 1);
      }
      .pc-row-action--ghost {
        color: var(--cco-text-tertiary, #84756b);
        font-weight: 600;
      }

      /* Filter: visa bara needs-review */
      [data-cco-patient-card-host].pc-only-review .pc-row:not(.is-needs-review) {
        display: none;
      }
      [data-cco-patient-card-host].pc-only-review .pc-section:not(:has(.pc-row.is-needs-review)) {
        display: none;
      }

      /* Mobile */
      @media (max-width: 720px) {
        .pc-row {
          flex-direction: column;
          gap: 6px;
          padding: 9px;
        }
        .pc-row-actions {
          flex-direction: row;
          flex-wrap: wrap;
        }
        .pc-row-name {
          font-size: 12px;
        }
        .pc-row-tech dl {
          grid-template-columns: 1fr;
        }
        .pc-row-tech dt {
          margin-top: 4px;
        }
      }
      /* CCO Sprint 19B.7 — Treatment Planning Canvas modal */

      .tc-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(43, 37, 31, 0.48);
        backdrop-filter: blur(6px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9500;
        padding: 24px;
      }
      .tc-modal {
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(248, 241, 232, 0.92));
        border-radius: 22px;
        max-width: 1100px;
        width: 100%;
        max-height: 92vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        box-shadow:
          0 36px 92px rgba(56, 40, 28, 0.32),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);
      }
      .tc-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 22px;
        border-bottom: 1px solid rgba(132, 117, 107, 0.18);
      }
      .tc-head h3 {
        margin: 0;
        font-size: 15px;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: #2b251f;
      }
      .tc-close {
        appearance: none;
        border: 0;
        background: rgba(255, 255, 255, 0.6);
        width: 28px;
        height: 28px;
        border-radius: 999px;
        cursor: pointer;
      }
      .tc-body {
        flex: 1;
        overflow-y: auto;
        padding: 18px 22px;
      }
      .tc-foot {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        padding: 14px 22px;
        border-top: 1px solid rgba(132, 117, 107, 0.18);
        background: linear-gradient(180deg, rgba(248, 241, 232, 0.5), rgba(244, 238, 232, 0.84));
      }

      .tc-step-kicker {
        font-size: 9.5px;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #bb4779;
        margin-bottom: 12px;
      }
      .tc-loading,
      .tc-empty {
        text-align: center;
        padding: 40px 20px;
        color: #84756b;
        font-style: italic;
      }

      .tc-image-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 10px;
      }
      .tc-image-card {
        appearance: none;
        border: 1px solid rgba(132, 117, 107, 0.24);
        cursor: pointer;
        padding: 12px 8px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.7);
        text-align: left;
        font-family: inherit;
      }
      .tc-image-card:hover {
        background: rgba(255, 255, 255, 1);
        transform: translateY(-1px);
        box-shadow: 0 4px 14px rgba(56, 40, 28, 0.1);
      }
      .tc-image-thumb {
        font-size: 28px;
        text-align: center;
        padding: 14px 0;
        background: rgba(132, 117, 107, 0.06);
        border-radius: 8px;
        margin-bottom: 6px;
      }
      .tc-image-name {
        font-size: 11px;
        font-weight: 700;
        color: #2b251f;
        line-height: 1.3;
      }

      .tc-tools {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin-bottom: 10px;
      }
      .tc-tool {
        appearance: none;
        border: 1px solid rgba(132, 117, 107, 0.24);
        cursor: pointer;
        padding: 6px 12px;
        border-radius: 999px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.95), rgba(244, 238, 232, 0.86));
        font-family: inherit;
        font-size: 11px;
        font-weight: 700;
        color: #2b251f;
      }
      .tc-tool.is-active {
        background: linear-gradient(180deg, #fff5e6, #ffe3b8);
        color: var(--tc-tool-color, #c8821e);
        border-color: var(--tc-tool-color, rgba(200, 130, 30, 0.34));
        box-shadow: 0 4px 12px rgba(200, 130, 30, 0.2);
      }
      .tc-tool-undo,
      .tc-tool-clear {
        color: #84756b;
        font-weight: 600;
        margin-left: auto;
      }

      .tc-canvas-wrap {
        position: relative;
        aspect-ratio: 1;
        max-width: 600px;
        margin: 0 auto 14px;
        border-radius: 12px;
        overflow: hidden;
        background:
          linear-gradient(135deg, #f5efe6 25%, transparent 25%) -10px 0,
          linear-gradient(225deg, #f5efe6 25%, transparent 25%) -10px 0,
          linear-gradient(315deg, #f5efe6 25%, transparent 25%),
          linear-gradient(45deg, #f5efe6 25%, transparent 25%);
        background-size: 20px 20px;
        background-color: #faf6f2;
        border: 1px solid rgba(132, 117, 107, 0.24);
      }
      .tc-canvas-img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
      }
      .tc-canvas-placeholder {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #84756b;
        font-size: 11px;
        font-style: italic;
        pointer-events: none;
        padding: 14px;
        text-align: center;
      }
      .tc-canvas-svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        cursor: crosshair;
        touch-action: none;
      }

      .tc-stroke-list {
        padding: 8px 12px;
        background: rgba(132, 117, 107, 0.06);
        border-radius: 8px;
        font-size: 11px;
      }
      .tc-stroke-kicker {
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #84756b;
        margin-bottom: 4px;
      }
      .tc-stroke-pill {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        background: rgba(187, 71, 121, 0.14);
        color: #bb4779;
        font-weight: 700;
        margin-right: 4px;
        font-size: 10px;
      }

      .tc-plan-form {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .tc-field {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .tc-field span {
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #84756b;
      }
      .tc-field select,
      .tc-field input,
      .tc-field textarea {
        font-family: inherit;
        font-size: 12.5px;
        padding: 8px 11px;
        border-radius: 10px;
        border: 1px solid rgba(132, 117, 107, 0.24);
        background: rgba(255, 255, 255, 0.85);
        color: #2b251f;
        outline: none;
      }
      .tc-field textarea {
        resize: vertical;
        min-height: 60px;
        line-height: 1.5;
      }

      .tc-area-list {
        padding: 10px 12px;
        border-radius: 10px;
        background: rgba(132, 117, 107, 0.06);

          { key: 'invoice', label: 'Faktura', ico: ICO.receipt },
          { key: 'preparation', label: 'Förberedelse', ico: ICO.checklist },
          { key: 'images', label: 'Bilder', ico: ICO.camera },
          { key: 'journal', label: 'Journal', ico: ICO.book },
          { key: 'aftercare', label: 'Eftervård', ico: ICO.leaf },
          { key: 'followup', label: 'Uppföljning', ico: ICO.loop },
        ];
        // Sortering: röda först (saknas) · amber (i kö) · grå (ej kopplat) · grön (klart/skickat) · purple (kommer senare)
        const TONE_ORDER = { red: 0, amber: 1, gray: 2, green: 3, purple: 4 };

        function computeJourneyChip(key, sections) {
          const find = (k) => sections.find((s) => s.key === k)?.rows || [];
          const has = (rows, predicate) => rows.some(predicate);
          // STRATEGI: röd = saknas/blocker · orange = i kö/utkast/väntar · grön = klart/signerat/skickat
          switch (key) {
            case 'health_declaration': {
              const forms = find('formular');
              if (
                has(
                  forms,
                  (r) => /hälsodekl/i.test(r.displayName) && /signerad/i.test(r.displayName)
                )
              )
                return { tone: 'green', text: 'Signerad' };
              if (has(forms, (r) => /hälsodekl/i.test(r.displayName)))
                return { tone: 'green', text: 'Skickad' };
              return { tone: 'red', text: 'Saknas' };
            }
            case 'fitness_certificate': {
              const forms = find('formular');
              if (
                has(
                  forms,
                  (r) => /friskförs/i.test(r.displayName) && /signerad/i.test(r.displayName)
                )
              )
                return { tone: 'green', text: 'Signerad' };
              if (has(forms, (r) => /friskförs/i.test(r.displayName)))
                return { tone: 'green', text: 'Skickad' };
              return { tone: 'gray', text: 'Ej krävs' };
            }
            case 'consent_treatment': {
              const consents = find('samtycken_avtal').filter((r) =>
                /samtycke/i.test(r.displayName)
              );
              if (has(consents, (r) => /signerad|godkänd/i.test(r.displayName)))
                return { tone: 'green', text: 'Signerat' };
              if (consents.length) return { tone: 'green', text: 'Skickat' };
              return { tone: 'red', text: 'Saknas' };
            }
            case 'agreement': {
              const agr = find('samtycken_avtal').filter((r) => /avtal/i.test(r.displayName));
              if (has(agr, (r) => /signerad/i.test(r.displayName)))
                return { tone: 'green', text: 'Signerat' };
              if (agr.length) return { tone: 'green', text: 'Skickat' };
              return { tone: 'red', text: 'Saknas' };
            }
            case 'offer': {
              const offers = find('offert');
              if (has(offers, (r) => /acceptera/i.test(r.displayName)))
                return { tone: 'green', text: 'Accepterad' };
              if (has(offers, (r) => /skickad/i.test(r.displayName)))
                return { tone: 'green', text: 'Skickad' };
              if (offers.length) return { tone: 'amber', text: 'Utkast' };
              return { tone: 'red', text: 'Saknas' };
            }
            case 'deposit': {
              const eko = sections.find((s) => s.key === 'ekonomi');
              const ps = eko?.paymentSummary;
              if (!ps) return { tone: 'gray', text: 'Ej kopplat' };
              if (ps.depositStatus === 'deposit_paid') return { tone: 'green', text: 'Betald' };
              if (ps.depositStatus === 'deposit_missing') return { tone: 'red', text: 'Saknas' };
              if (ps.depositStatus === 'deposit_not_required')
                return { tone: 'gray', text: 'Krävs ej' };
              if (ps.partial) return { tone: 'gray', text: 'Partial' };
              return { tone: 'gray', text: 'Okänd' };
            }
            case 'invoice': {
              const eko = sections.find((s) => s.key === 'ekonomi');
              const ps = eko?.paymentSummary;
              if (!ps) return { tone: 'gray', text: 'Ej kopplat' };
              const mapping = {
                not_connected: { tone: 'gray', text: 'Ej kopplat' },
                no_invoice: { tone: 'amber', text: 'I kö' },
                invoice_drafted: { tone: 'amber', text: 'Utkast' },
                invoice_sent: { tone: 'green', text: 'Skickad' },
                partially_paid: { tone: 'amber', text: 'Delbetald' },
                paid: { tone: 'green', text: 'Betald' },
                overdue: { tone: 'red', text: 'Förfallen' },
                refunded: { tone: 'gray', text: 'Återbetald' },
                unknown: { tone: 'gray', text: 'Okänd' },
              };
              const m = mapping[ps.invoiceStatus] || { tone: 'gray', text: 'Okänd' };
              if (ps.partial && m.tone === 'gray') m.text += ' · PARTIAL';
              return m;
            }
            case 'images': {
              const images = find('bilder');
              if (images.length >= 2) return { tone: 'green', text: `${images.length} st` };
              if (images.length === 1) return { tone: 'amber', text: '1 st' };
              return { tone: 'red', text: 'Saknas' };
            }
            case 'journal': {
              const journals = find('journaler');
              if (has(journals, (r) => /signerad|låst/i.test(r.displayName)))
                return { tone: 'green', text: 'Signerad' };
              if (journals.length) return { tone: 'amber', text: 'Draft' };
              return { tone: 'red', text: 'Saknas' };
            }
            case 'aftercare': {
              const after = find('eftervard');
              if (after.length) return { tone: 'green', text: `${after.length} st` };
              return { tone: 'gray', text: 'Schemalagd' };
            }
            case 'preparation': {
              const forms = find('formular');
              const hd = has(
                forms,
                (r) => /hälsodekl/i.test(r.displayName) && /signerad/i.test(r.displayName)
              );
              const fc = has(
                forms,
                (r) => /friskförs/i.test(r.displayName) && /signerad/i.test(r.displayName)
              );
              const planExists =
                (sections.find((s) => s.key === 'behandlingsplan')?.rows || []).length > 0;
              if (hd && fc && planExists) return { tone: 'green', text: 'Klar' };
              if (hd || fc || planExists) return { tone: 'amber', text: 'Pågår' };
              return { tone: 'purple', text: 'Inte påbörjad' };
            }
            case 'followup': {
              const fu = find('uppfoljning');
              if (after_some(fu, /signerad|completed/i)) return { tone: 'green', text: 'Klar' };
              if (fu.length) return { tone: 'amber', text: 'Väntar' };
              return { tone: 'purple', text: 'Kommer senare' };
            }
            default:
              return { tone: 'gray', text: '—' };
          }
        }
        function after_some(arr, regex) {
          return arr.some((r) => regex.test(r.displayName));
        }

        function journeyBarHtml(sections) {
          const enriched = JOURNEY_CHIPS.map((c) => ({
            ...c,
            state: computeJourneyChip(c.key, sections),
          }));
          // Sortera: röd (saknas) först → amber → grå → grön (klart) sist
          enriched.sort(
            (a, b) => (TONE_ORDER[a.state.tone] ?? 9) - (TONE_ORDER[b.state.tone] ?? 9)
          );
          const chips = enriched
            .map(
              (c) => `
      <button class="jbar-chip jbar-chip--${c.state.tone}" data-jbar-key="${c.key}" title="${esc(c.label)}: ${esc(c.state.text)}">
        <span class="jbar-ico" aria-hidden="true">${c.ico}</span>
        <span class="jbar-label">${esc(c.label)}</span>
        <span class="jbar-state">· ${esc(c.state.text)}</span>
      </button>`
            )
            .join('');
          const blockers = enriched.filter((c) => c.state.tone === 'red');
          const nextStep = blockers.length
            ? `<div class="jbar-next jbar-next--blocker">⚠ Nästa steg: ${esc(blockers[0].label.toLowerCase())} saknas</div>`
            : `<div class="jbar-next jbar-next--ok">✓ Allt obligatoriskt är på plats</div>`;
          return `<div class="jbar"><div class="jbar-chips">${chips}</div>${nextStep}</div>`;
        }

        function esc(s) {
          return String(s == null ? '' : s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
        }

        function badgeHtml(b) {
          const tone = b.tone || 'neutral';
          return `<span class="pc-badge pc-badge--${esc(tone)}">${esc(b.label)}</span>`;
        }

        // Routes som ÄR implementerade (resten visas som "kommer snart" istället för 404).
        // Vissa "öppna"-actions hanteras dock client-side via Treatment Canvas eller
        // direkt-länk till befintliga vyer — markera dem som implementerade.
        const IMPLEMENTED_ROUTE_PATTERNS = [
          /^\/konversationer\.html/,
          /^\/api\/v1\/cco\/assets\/[^/]+\/download/, // bild-preview via secure storage
        ];
        // Vissa hrefs öppnas inte i ny tab — de hanteras client-side (modal/canvas).
        // Format: regex → function(href, row) som returnerar true om hanterat.
        const CLIENT_SIDE_OPEN_HANDLERS = [
          {
            match: /\/patient\/[^/]+\/asset\/([^/?#]+)/,
            handler: (href, row, ctx) => {
              // Öppna bild DIREKT i ritningsläge — extrahera assetId ur href + skicka till canvas
              const m = href.match(/\/asset\/([^/?#]+)/);
              const assetId = m ? m[1] : null;
              const displayName =
                row?.row?.displayName ||
                row?.row?.technicalInfo?.originalFilename ||
                'Patient-bild';
              if (window.CCOTreatmentCanvas) {
                window.CCOTreatmentCanvas.open({
                  customerId: ctx.customerId,
                  mode: 'annotation',
                  preselectAsset: assetId ? { assetId, displayName } : null,
                });
                return true;
              }
              return false;
            },
          },
          {
            match: /\/patient\/[^/]+\/plan\/([^/?#]+)/,
            handler: (href, row, ctx) => {
              // Öppna behandlingsplan-detalj (TODO: dedikerad plan-modal — tills dess scrolla till plan-sektion)
              const sec = document.querySelector('[data-section-key="behandlingsplan"]');
              if (sec) {
                sec.setAttribute('open', '');
                sec.scrollIntoView({ behavior: 'smooth', block: 'center' });
                return true;
              }
              return false;
            },
          },
          {
            match: /\/patient\/[^/]+\/annotation\/([^/?#]+)/,
            handler: (href, row, ctx) => {
              if (window.CCOTreatmentCanvas) {
                window.CCOTreatmentCanvas.open({ customerId: ctx.customerId, mode: 'annotation' });
                return true;
              }
              return false;
            },
          },
        ];
        function clientSideHandlerFor(href) {
          return CLIENT_SIDE_OPEN_HANDLERS.find((h) => h.match.test(href || '')) || null;
        }
        function isRouteImplemented(href) {
          if (!href) return false;
          if (IMPLEMENTED_ROUTE_PATTERNS.some((re) => re.test(href))) return true;
          if (clientSideHandlerFor(href)) return true;
          return false;
        }

        function actionButton(row, kind) {
          const href = kind === 'open' ? row.openHref : row.historyHref;
          if (!href) return '';
          const implemented = isRouteImplemented(href);
          const label = kind === 'open' ? 'Öppna' : 'Historik';
          const ghost = kind === 'history' ? ' pc-row-action--ghost' : '';
          if (!implemented) {
            return `<button class="pc-row-action${ghost} is-coming-soon" disabled title="Kommer snart — backend levererat, UI inte än" data-row-id="${esc(row.rowId)}" data-action="${kind}">${label} · snart</button>`;
          }
          return `<button class="pc-row-action${ghost}" data-href="${esc(href)}" data-row-id="${esc(row.rowId)}" data-action="${kind}">${label}</button>`;
        }

        // Per-rad extra-actions (utöver Öppna/Historik). Format:
        //   { match: (row) => bool, html: (row) => '<button …>' }
        const ROW_EXTRA_ACTIONS = [
          {
            // Behandlingsplan utan kopplad offert → "Skapa offert"
            match: (row) => row.category === 'plan' && !row.technicalInfo?.offerId,
            html: (row) =>
              `<button class="pc-row-action pc-row-action--accent" data-row-id="${esc(row.rowId)}" data-action="create-offer-from-plan" data-plan-id="${esc(row.technicalInfo?.planId || row.rowId.replace(/^plan:/, ''))}">💼 Skapa offert</button>`,
          },
        ];
        function extraActionsHtml(row) {
          return ROW_EXTRA_ACTIONS.filter((a) => a.match(row))
            .map((a) => a.html(row))
            .join('');
        }

        function previewHtml(row) {
          // Bild → thumbnail från secure storage
          if (row.category === 'image' && row.technicalInfo?.assetId) {
            return `<img class="pc-row-thumb" src="/api/v1/cco/assets/${esc(row.technicalInfo.assetId)}/download?inline=1" alt="thumbnail" onerror="this.style.display='none'">`;
          }
          // Annotation → mini-SVG-preview (placeholder med ico)
          if (row.category === 'annotation') {
            return `<div class="pc-row-thumb pc-row-thumb--svg" title="Ritning v${row.version || 1}"><svg viewBox="0 0 40 40" width="40" height="40"><circle cx="14" cy="22" r="6" fill="none" stroke="#bb4779" stroke-width="2"/><path d="M22 14 L34 8 M34 8 L30 12 M34 8 L30 4" stroke="#c8821e" stroke-width="2" fill="none" stroke-linecap="round"/></svg></div>`;
          }
          // Plan → meta-chip (teknik/grafts)
          if (row.category === 'plan' && row.technicalInfo?.planId) {
            const m = row.displayName.match(/(\d+)\s*grafts/i);
            const tech = (row.displayName.match(/·\s*([A-ZÅÄÖa-z\s]+)\s*·\s*v/) || [])[1] || '';
            return `<div class="pc-row-thumb pc-row-thumb--plan">📋<div class="pc-row-thumb-meta">${esc(tech)}${m ? '<br>' + esc(m[0]) : ''}</div></div>`;
          }
          // Offer → status + pris
          if (row.category === 'offer') {
            return `<div class="pc-row-thumb pc-row-thumb--offer">💼<div class="pc-row-thumb-meta">${esc((row.subline || '').split(' · ')[0] || 'offer')}</div></div>`;
          }
          // Journal/form → PDF-ikon
          if (
            row.category === 'journal' ||
            row.category === 'form' ||
            row.category === 'consent' ||
            row.category === 'agreement'
          ) {
            return `<div class="pc-row-thumb pc-row-thumb--doc">📄</div>`;
          }
          return '';
        }

        function rowHtml(row) {
          const badges = (row.badges || []).map(badgeHtml).join('');
          const subline = row.subline
            ? `<div class="pc-row-subline">${esc(row.subline)}</div>`
            : '';
          const review = row.needsReview
            ? `<div class="pc-row-review">⚠️ Saknar: ${esc((row.missingFields || []).join(', '))}</div>`
            : '';
          const preview = previewHtml(row);
          const tech =
            row.technicalInfo && Object.keys(row.technicalInfo).length
              ? `<details class="pc-row-tech"><summary>Teknisk info</summary><dl>${Object.entries(
                  row.technicalInfo
                )
                  .map(
                    ([k, v]) =>
                      `<dt>${esc(k)}</dt><dd>${esc(typeof v === 'object' ? JSON.stringify(v) : v)}</dd>`
                  )
                  .join('')}</dl></details>`
              : '';
          // Bild + ritning + plan: hela raden klickbar → öppnar ritmodalen direkt (slipp Öppna-knapp)
          const isQuickOpen =
            (row.category === 'image' ||
              row.category === 'annotation' ||
              row.category === 'plan') &&
            (row.openHref || row.technicalInfo?.assetId);
          const quickOpenAttr = isQuickOpen
            ? ` data-quick-open="1" data-quick-asset-id="${esc(row.technicalInfo?.assetId || '')}" data-quick-annotation-id="${esc(row.technicalInfo?.annotationId || '')}" data-quick-plan-id="${esc(row.technicalInfo?.planId || '')}" data-quick-display-name="${esc(row.displayName)}"`
            : '';
          // Visa inte separat "Öppna" om hela raden är klickbar — bara historik
          const actions = isQuickOpen
            ? [extraActionsHtml(row), actionButton(row, 'history')].filter(Boolean).join('')
            : [extraActionsHtml(row), actionButton(row, 'open'), actionButton(row, 'history')]
                .filter(Boolean)
                .join('');
          return `
      <div class="pc-row${row.needsReview ? ' is-needs-review' : ''}${isQuickOpen ? ' is-quick-open' : ''}" data-row-id="${esc(row.rowId)}"${quickOpenAttr}>
        ${preview}
        <div class="pc-row-main">
          <div class="pc-row-name">${esc(row.displayName)}</div>
          ${subline}
          ${badges ? `<div class="pc-row-badges">${badges}</div>` : ''}
          ${review}
          ${tech}
        </div>
        ${actions ? `<div class="pc-row-actions">${actions}</div>` : ''}
      </div>`;
        }

        // Per-sektion "skapa ny"-knapp (om relevant)
        const SECTION_CTAS = {
          behandlingsplan: { label: '✎ Ny behandlingsplan', action: 'create-treatment-plan' },
          ritningar: { label: '✎ Ny ritning på bild', action: 'create-annotation' },
        };

        // Galleri-layout för bilder + ritningar — grid med stora thumbnails
        const TILE_ICO_PEN =
          '<svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 2 L14 5 L5 14 L2 14 L2 11 Z"/><line x1="9.5" y1="3.5" x2="12.5" y2="6.5"/></svg>';
        const TILE_ICO_TRASH =
          '<svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="2.5 4.5 13.5 4.5"/><path d="M5 4.5 V3 a1.2 1.2 0 0 1 1.2-1.2 h3.6 A1.2 1.2 0 0 1 11 3 V4.5"/><path d="M3.8 4.5 L4.8 14 a1 1 0 0 0 1 0.9 h4.4 a1 1 0 0 0 1-0.9 L12.2 4.5"/><line x1="6.5" y1="7.5" x2="6.5" y2="12"/><line x1="9.5" y1="7.5" x2="9.5" y2="12"/></svg>';

        function imageTileHtml(row, sectionKey) {
          const isAnnotation = sectionKey === 'ritningar';
          const assetId = row.technicalInfo?.assetId || '';
          const annotationId = row.technicalInfo?.annotationId || '';
          const planId = row.technicalInfo?.planId || '';
          const thumb = assetId
            ? `<img class="pc-tile-img" src="/api/v1/cco/assets/${esc(assetId)}/download?inline=1" alt="" onerror="this.style.background='#d4c4b8';this.removeAttribute('src')">`
            : isAnnotation
              ? `<div class="pc-tile-svg"><svg viewBox="0 0 40 40" width="48" height="48"><circle cx="14" cy="22" r="6" fill="none" stroke="#bb4779" stroke-width="2.5"/><path d="M22 14 L34 8 M34 8 L30 12 M34 8 L30 4" stroke="#c8821e" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg></div>`
              : `<div class="pc-tile-needs">⚠</div>`;
          const dateMatch = (row.displayName || '').match(/^(\d{4}-\d{2}-\d{2})/);
          const date = dateMatch ? dateMatch[1] : '';
          const labelTail = (row.displayName || '').replace(/^\d{4}-\d{2}-\d{2}\s*·\s*/, '');
          return `
      <div class="pc-tile${row.needsReview ? ' is-needs-review' : ''}" data-row-id="${esc(row.rowId)}"
           data-quick-asset-id="${esc(assetId)}"
           data-quick-annotation-id="${esc(annotationId)}"
           data-quick-plan-id="${esc(planId)}"
           data-quick-display-name="${esc(row.displayName)}">
        ${thumb}
        <div class="pc-tile-meta">
          ${date ? `<div class="pc-tile-date">${esc(date)}</div>` : ''}
          <div class="pc-tile-label">${esc(labelTail || row.displayName)}</div>
          ${row.needsReview ? '<div class="pc-tile-warn">⚠️ Behöver namnges</div>' : ''}
        </div>
        <div class="pc-tile-actions">
          <button class="pc-tile-btn pc-tile-btn--draw" data-tile-action="draw"><span class="pc-tile-btn-ico" aria-hidden="true">${TILE_ICO_PEN}</span><span>Rita</span></button>
          <button class="pc-tile-btn pc-tile-btn--delete" data-tile-action="delete"><span class="pc-tile-btn-ico" aria-hidden="true">${TILE_ICO_TRASH}</span><span>Radera</span></button>
        </div>
      </div>`;
        }

        function sectionHtml(section, openByDefault) {
          const rows = section.rows || [];
          const empty = rows.length === 0;
          const needsReview = section.summary?.needsReviewCount || 0;
          const cta = SECTION_CTAS[section.key];
          const ctaHtml = cta
            ? `<button class="pc-section-cta" data-section-cta="${esc(cta.action)}" data-section-key="${esc(section.key)}">${esc(cta.label)}</button>`
            : '';
          const isGallery = section.key === 'bilder' || section.key === 'ritningar';
          const body = empty
            ? `<div class="pc-empty">Inget ännu.</div>`
            : isGallery
              ? `<div class="pc-gallery">${rows.map((r) => imageTileHtml(r, section.key)).join('')}</div>`
              : `<div class="pc-rows">${rows.map(rowHtml).join('')}</div>`;
          return `
      <details class="dossier-section pc-section" ${openByDefault || cta ? 'open' : ''} data-section-key="${esc(section.key)}">
        <summary>
          <span class="pc-section-ico">${ICONS[section.key] || '•'}</span>
          ${esc(section.label)}
          <span class="count">${rows.length}${needsReview ? ` · ⚠️ ${needsReview}` : ''}</span>
        </summary>
        ${ctaHtml}
        ${body}
      </details>`;
        }

        async function audit(kind, detail) {
          try {
            await fetch('/api/v1/cco-audit', {
              method: 'POST',
              credentials: 'same-origin',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                kind,
                surface: 'cco.patient_card.ui',
                ts: new Date().toISOString(),
                detail,
              }),
              keepalive: true,
            });
          } catch {}
        }

        async function loadPatientCard(customerId, hostEl) {
          if (!hostEl) return;
          if (!customerId) {
            hostEl.innerHTML = `
        <div class="pc-error">
          <strong>Patient-ID saknas</strong> — kunde inte hämta patientkort-sektionerna.
          <br><small>Dossier-koden måste sätta <code>data-customer-id</code> på host-elementet.</small>
        </div>`;
            return;
          }
          hostEl.innerHTML = '<div class="pc-loading">Hämtar patientkort…</div>';
          let data;
          try {
            const r = await fetch(`/api/v1/cco-patient-card/${encodeURIComponent(customerId)}`, {
              credentials: 'same-origin',
            });
            if (!r.ok) throw new Error('HTTP ' + r.status);
            data = await r.json();
          } catch (err) {
            hostEl.innerHTML = `<div class="pc-error">Kunde inte hämta patientkort: ${esc(err.message)}</div>`;
            return;
          }
          const sections = data.sections || [];
          // Render: kunddata + readiness alltid open, resten stängda om tomma
          const openKeys = new Set(['kunddata', 'readiness', 'tidslinje']);
          hostEl.innerHTML = `
      ${journeyBarHtml(sections)}
      <div class="pc-toolbar">
        <span class="pc-toolbar-kicker">Patientkort</span>
        <button class="pc-toolbar-action pc-toolbar-action--primary" data-action="take-photo">📷 Ta bild</button>
        <button class="pc-toolbar-action" data-action="expand-all">Expandera alla</button>
        <button class="pc-toolbar-action" data-action="collapse-all">Fäll ihop</button>

        function findHostForCurrentDossier() {

        // Public API
        window.CCOPatientCardSections = {

    <script>
      /* CCO Sprint 19B.7 — Treatment Planning Canvas (modal-overlay)
       *
       * Användning:
       *   window.CCOTreatmentCanvas.open({ customerId, mode: 'plan' | 'annotation' });
       *
       * Flöde:
       *  1. Hämtar lista över bilder för kunden (via patient-card-endpoint, sektion 'bilder')
       *  2. Användaren väljer en bild
       *  3. Ritar med pen / arrow / donor-zone / recipient-zone / hairline
       *  4. Sparar annotation via POST /api/v1/cco-photo-annotations
       *  5. Om mode='plan': skapar plan via POST /api/v1/cco-treatment-plans med
       *     teknikförslag + graft-estimat per områdes-marker
       *
       * Säkerhet:
       *  - Koordinater normaliserade 0..1 (skalbar)
       *  - Inga PII i URL
       *  - Audit-events per spara/avbryt
       *  - Ingen extern AI på ritningen
       */
      (function () {
        'use strict';

        const TOOLS = [
          { id: 'pen', label: 'Penna', color: '#2b251f' },
          { id: 'donor-zone', label: 'Donor-område', color: '#bb4779' },
          { id: 'recipient-zone', label: 'Recipient', color: '#c8821e' },
          { id: 'hairline', label: 'Hairline', color: '#4a7ba8' },
          { id: 'arrow', label: 'Pil', color: '#4a8268' },
          { id: 'circle', label: 'Cirkel', color: '#b94a4a' },
        ];
        const TECHNIQUES = [
          { id: 'fue', label: 'FUE' },
          { id: 'dhi', label: 'DHI' },
          { id: 'prp_hair', label: 'PRP hår' },
          { id: 'beard_fue', label: 'Skägg FUE' },
          { id: 'eyebrow_dhi', label: 'Ögonbryn DHI' },
        ];

        let state = null;

        function esc(s) {
          return String(s == null ? '' : s).replace(
            /[&<>"']/g,
            (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]
          );
        }

        async function audit(kind, detail) {
          try {
            await fetch('/api/v1/cco-audit', {
              method: 'POST',
              credentials: 'same-origin',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                kind,
                surface: 'cco.treatment_canvas',
                ts: new Date().toISOString(),
                detail,
              }),
              keepalive: true,
            });
          } catch {}
        }

        function close() {
          document.querySelectorAll('.tc-backdrop').forEach((b) => b.remove());
          state = null;
        }

        async function fetchCustomerImages(customerId) {
          try {
            const r = await fetch(`/api/v1/cco-patient-card/${encodeURIComponent(customerId)}`, {
              credentials: 'same-origin',
            });
            if (!r.ok) return [];
            const data = await r.json();
            const bilder = (data.sections || []).find((s) => s.key === 'bilder');
            return (bilder?.rows || []).map((row) => ({
              rowId: row.rowId,
              assetId: row.technicalInfo?.assetId || row.rowId.replace(/^image:/, ''),
              displayName: row.displayName,
              storageKey: row.technicalInfo?.storageKey || null,
              date: row.date,
            }));
          } catch {
            return [];
          }
        }

        function modalShell(title) {
          const back = document.createElement('div');
          back.className = 'tc-backdrop';
          back.innerHTML = `
      <div class="tc-modal" role="dialog" aria-modal="true" aria-label="${esc(title)}">
        <header class="tc-head">
          <h3>${esc(title)}</h3>
          <button class="tc-close" aria-label="Stäng">✕</button>
        </header>
        <div class="tc-body" data-tc-body></div>
        <footer class="tc-foot" data-tc-foot></footer>
      </div>`;
          document.body.appendChild(back);
          back.querySelector('.tc-close').onclick = () => {
            audit('canvas.cancelled', { customerId: state?.customerId });
            close();
          };
          back.addEventListener('click', (e) => {
            if (e.target === back) close();
          });
          document.addEventListener('keydown', function esc(ev) {
            if (ev.key === 'Escape') {
              close();
              document.removeEventListener('keydown', esc);
            }
          });
          return back;
        }

        async function open({ customerId, mode = 'plan', preselectAsset = null }) {
          state = {
            customerId,
            mode,
            asset: null,
            strokes: [],
            currentTool: 'donor-zone',
            technique: null,
            areaSpecs: [],
          };
          const back = modalShell(
            mode === 'plan' ? '✎ Skapa behandlingsplan från bild' : '✎ Ny ritning på bild'
          );
          const body = back.querySelector('[data-tc-body]');
          body.innerHTML = '<div class="tc-loading">Hämtar patientens bilder…</div>';

          // Om bild redan vald (klick från patientkort) — hoppa över step 1
          if (preselectAsset?.assetId) {
            state.asset = {
              assetId: preselectAsset.assetId,
              displayName: preselectAsset.displayName || 'Patient-bild',
            };
            audit('canvas.opened_preselected', {
              customerId,
              mode,
              assetId: preselectAsset.assetId,
            });
            renderCanvas(back);
            return;
          }

          const images = await fetchCustomerImages(customerId);
          audit('canvas.opened', { customerId, mode, imageCount: images.length });

          if (!images.length) {
            body.innerHTML = `<div class="tc-empty">Inga bilder hittades för denna patient.<br><small>Ta en bild eller ladda upp en via Ta bild-knappen.</small></div>`;
            return;
          }

          renderImagePicker(back, images);
        }

        function renderImagePicker(back, images) {
          const body = back.querySelector('[data-tc-body]');
          body.innerHTML = `
      <div class="tc-step-kicker">Steg 1 av ${state.mode === 'plan' ? '3' : '2'} · Välj bild</div>
      <div class="tc-image-grid">
        ${images
          .map(
            (img) => `
          <button class="tc-image-card" data-asset-id="${esc(img.assetId)}" data-image-name="${esc(img.displayName)}">
            <div class="tc-image-thumb">📷</div>
            <div class="tc-image-name">${esc(img.displayName)}</div>
          </button>
        `
          )
          .join('')}
      </div>`;
          body.querySelectorAll('.tc-image-card').forEach((card) => {
            card.onclick = () => {
              state.asset = { assetId: card.dataset.assetId, displayName: card.dataset.imageName };
              audit('canvas.image_selected', { assetId: state.asset.assetId });
              renderCanvas(back);
            };
          });
        }

        function renderCanvas(back) {
          const body = back.querySelector('[data-tc-body]');
          const foot = back.querySelector('[data-tc-foot]');
          body.innerHTML = `
      <div class="tc-step-kicker">Steg 2 av ${state.mode === 'plan' ? '3' : '2'} · ${esc(state.asset.displayName)}</div>
      <div class="tc-tools">
        ${TOOLS.map((t, i) => `<button class="tc-tool ${i === 1 ? 'is-active' : ''}" data-tool="${t.id}" style="--tc-tool-color:${t.color}">${esc(t.label)}</button>`).join('')}
        <button class="tc-tool tc-tool-undo" data-tool-action="undo">↶ Ångra</button>
        <button class="tc-tool tc-tool-clear" data-tool-action="clear">Rensa</button>
      </div>
      <div class="tc-canvas-wrap" data-tc-canvas-wrap>
        <img class="tc-canvas-img" data-tc-img alt="${esc(state.asset.displayName)}"
             src="/api/v1/cco/assets/${esc(state.asset.assetId)}/download?inline=1"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <div class="tc-canvas-placeholder" data-tc-asset-placeholder style="display:none;">
          [ Kunde inte ladda bild från CCO secure storage — assetId: ${esc(state.asset.assetId)} ]
        </div>
        <svg class="tc-canvas-svg" data-tc-svg viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet"></svg>
      </div>
      <div class="tc-stroke-list">
        <div class="tc-stroke-kicker">Markeringar (${state.strokes.length})</div>
        <div data-tc-stroke-summary></div>
      </div>`;
          foot.innerHTML = `
      <button class="tc-btn tc-btn--ghost" data-tc-back>← Byt bild</button>
      <button class="tc-btn tc-btn--primary" data-tc-save>${state.mode === 'plan' ? 'Nästa: behandlingsplan →' : '✓ Spara ritning'}</button>`;

          state.currentTool = 'donor-zone';
          const svg = body.querySelector('[data-tc-svg]');
          bindTools(back);
          bindCanvas(svg);
          updateStrokeSummary(back);

          foot.querySelector('[data-tc-back]').onclick = () => {
            state.strokes = [];
            renderImagePicker(back, []);
            audit('canvas.back_to_image_picker', {});
          };
          foot.querySelector('[data-tc-save]').onclick = () => onSave(back);
        }

        function bindTools(back) {
          back.querySelectorAll('[data-tool]').forEach((b) => {
            b.onclick = () => {
              back.querySelectorAll('[data-tool]').forEach((x) => x.classList.remove('is-active'));
              b.classList.add('is-active');
              state.currentTool = b.dataset.tool;
            };
          });
          back.querySelectorAll('[data-tool-action]').forEach((b) => {
            b.onclick = () => {
              const a = b.dataset.toolAction;
              if (a === 'undo') state.strokes.pop();
              if (a === 'clear') state.strokes = [];
              redraw(back);
              updateStrokeSummary(back);
            };
          });
        }

        function bindCanvas(svg) {
          let drawing = false;
          let currentPoints = [];
          function pt(ev) {
            const rect = svg.getBoundingClientRect();
            const x = ((ev.clientX ?? ev.touches?.[0]?.clientX) - rect.left) / rect.width;
            const y = ((ev.clientY ?? ev.touches?.[0]?.clientY) - rect.top) / rect.height;
            return { x: Math.max(0, Math.min(1, x)), y: Math.max(0, Math.min(1, y)) };
          }
          const start = (ev) => {
            ev.preventDefault();
            drawing = true;
            currentPoints = [pt(ev)];
          };
          const move = (ev) => {
            if (!drawing) return;
            ev.preventDefault();
            currentPoints.push(pt(ev));
            redrawLive(svg, currentPoints);
          };
          const end = (ev) => {
            if (!drawing) return;
            ev.preventDefault();
            drawing = false;
            if (currentPoints.length < 2) {
              currentPoints = [];
              return;
            }
            const tool = TOOLS.find((t) => t.id === state.currentTool) || TOOLS[0];
            state.strokes.push({ tool: tool.id, color: tool.color, points: currentPoints });
            currentPoints = [];
            redraw(svg.closest('.tc-modal').parentElement);
            updateStrokeSummary(svg.closest('.tc-modal').parentElement);
          };
          svg.addEventListener('mousedown', start);
          svg.addEventListener('mousemove', move);
          svg.addEventListener('mouseup', end);
          svg.addEventListener('mouseleave', end);
          svg.addEventListener('touchstart', start, { passive: false });
          svg.addEventListener('touchmove', move, { passive: false });
          svg.addEventListener('touchend', end);
        }

        function redrawLive(svg, points) {
          const live = svg.querySelector('[data-live]');
          if (live) live.remove();
          if (points.length < 2) return;
          const tool = TOOLS.find((t) => t.id === state.currentTool) || TOOLS[0];
          const d = points
            .map((p, i) => `${i === 0 ? 'M' : 'L'}${p.x * 1000} ${p.y * 1000}`)
            .join(' ');
          const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          path.setAttribute('d', d);
          path.setAttribute('stroke', tool.color);
          path.setAttribute('stroke-width', '3');
          path.setAttribute('fill', 'none');
          path.setAttribute('data-live', '');
          svg.appendChild(path);
        }

        function redraw(back) {
          const svg = back.querySelector('[data-tc-svg]');
          if (!svg) return;
          svg.innerHTML = '';
          state.strokes.forEach((s) => {
            const d = s.points
              .map((p, i) => `${i === 0 ? 'M' : 'L'}${p.x * 1000} ${p.y * 1000}`)
              .join(' ');
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.setAttribute('d', d);
            path.setAttribute('stroke', s.color || '#2b251f');
            path.setAttribute('stroke-width', '3');
            path.setAttribute('fill', 'none');
            path.setAttribute('stroke-linecap', 'round');
            path.setAttribute('stroke-linejoin', 'round');
            svg.appendChild(path);
          });
        }

        function updateStrokeSummary(back) {
          const el = back.querySelector('[data-tc-stroke-summary]');
          if (!el) return;
          const counts = state.strokes.reduce((acc, s) => {
            acc[s.tool] = (acc[s.tool] || 0) + 1;
            return acc;
          }, {});
          el.innerHTML = Object.keys(counts).length
            ? Object.entries(counts)
                .map(
                  ([k, n]) =>
                    `<span class="tc-stroke-pill">${esc((TOOLS.find((t) => t.id === k) || {}).label || k)}: ${n}</span>`
                )
                .join(' ')
            : '<em>Inga markeringar ännu.</em>';
          back.querySelector('.tc-stroke-kicker').textContent =
            `Markeringar (${state.strokes.length})`;
        }

        async function onSave(back) {
          if (!state.strokes.length) {
            alert('Rita minst en markering först.');
            return;
          }
          audit('canvas.save_initiated', {
            customerId: state.customerId,
            strokeCount: state.strokes.length,
            mode: state.mode,
          });

          // 1. Spara annotation
          let annotationId;
          try {
            const r = await fetch('/api/v1/cco-photo-annotations', {
              method: 'POST',
              credentials: 'same-origin',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                assetId: state.asset.assetId,
                customerId: state.customerId,
                strokes: state.strokes,
                note: `Ritning från Treatment Canvas (mode=${state.mode})`,
              }),
            });
            if (!r.ok) throw new Error('HTTP ' + r.status);
            const j = await r.json();
            annotationId = j.annotationId;
          } catch (err) {
            alert('Kunde inte spara ritning: ' + err.message);
            return;
          }

          if (state.mode === 'annotation') {
            audit('canvas.annotation_saved', { annotationId, customerId: state.customerId });
            alert('✓ Ritning sparad');
            if (window.CCOPatientCardSections?.refresh) window.CCOPatientCardSections.refresh();
            close();
            return;
          }

          // mode === 'plan' → steg 3: bygg plan
          renderPlanStep(back, annotationId);
        }

        function renderPlanStep(back, annotationId) {
          const body = back.querySelector('[data-tc-body]');
          const foot = back.querySelector('[data-tc-foot]');
          // Mappa donor/recipient-strokes → område-rader
          const donorCount = state.strokes.filter((s) => s.tool === 'donor-zone').length;
          const recipientCount = state.strokes.filter((s) => s.tool === 'recipient-zone').length;
          state.areaSpecs = [];
          if (recipientCount > 0)
            state.areaSpecs.push({
              area: 'hairline',

          foot.querySelector('[data-tc-back-to-canvas]').onclick = () => renderCanvas(back);

        async function createPlan(back, annotationId) {
          const technique = back.querySelector('[data-tc-technique]').value;
          const totalGraftEstimate =
            parseInt(back.querySelector('[data-tc-graft-total]').value, 10) || null;
          const providerComment = back.querySelector('[data-tc-comment]').value;

            estimatedGrafts:

          try {
            const r = await fetch('/api/v1/cco-treatment-plans', {
              method: 'POST',

                    window.CCOPatientCardSections.refresh();
