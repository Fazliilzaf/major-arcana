<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CCO Calendar read-only booking preflight</title>
    <link rel="stylesheet" href="/public/cco-kalender-shell.css" />
    <style>
      :root {
        --cco-color-brand: #50392d;
        --cco-text-secondary: #6d5d53;
        --cco-text-tertiary: #8b7b72;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        padding: 32px;
        background: #f4eee8;
        font:
          14px/1.4 system-ui,
          sans-serif;
      }
      .calendar-shell {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 380px;
        gap: 24px;
        max-width: 1180px;
        margin: 0 auto;
      }
      .calendar-content {
        min-height: 720px;
        border-radius: 20px;
        background: rgba(250, 246, 242, 0.92);
      }
      .intel-shell {
        min-height: 720px;
        padding: 24px;
        border-radius: 20px;
        background: rgba(250, 246, 242, 0.92);
        box-shadow: 0 8px 24px rgba(70, 50, 30, 0.08);
      }
      @media (max-width: 760px) {
        body {
          padding: 16px;
        }
        .calendar-shell {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body data-cco-view="calendar" data-cco-calendar-mode="live-read">
    <main class="calendar-shell">
      <section class="calendar-content" data-mode="dag"></section>
      <aside class="intel-shell"><div class="cco-cal-live-placeholder"></div></aside>
    </main>
    <script src="/public/cco-kalender-shell.js"></script>
    <script>
      window.addEventListener('DOMContentLoaded', function () {
        setTimeout(function () {
          window.CcoKalenderShell.renderDrawer({
            id: 'visual-contract-booking',
            bookingId: 'visual-contract-booking',
            patientId: 'visual-canonical-patient',
            patientName: 'Canonical testpatient',
            encounterId: 'visual-canonical-encounter',
            serviceId: 'prp-hair',
            serviceLabel: 'PRP hår',
            resourceId: 'rum-2',
            resourceLabel: 'Rum 2',
            practitioner: 'Leg. vårdgivare',
            startsAt: '2026-07-17T10:00:00.000Z',
            time: '12:00',
            endTime: '13:00',
            status: 'confirmed',
            source: 'cliento',
          });
        }, 150);
      });
    </script>
  </body>
</html>
