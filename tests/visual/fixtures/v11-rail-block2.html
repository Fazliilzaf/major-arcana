<!doctype html>
<!--
  V11-RAIL Fas 3 · Block 2 — A Profile + B Smart information screenshot-fixture.
  Renderar de RIKTIGA komponenterna (cco-v11-rail.css + logik-lager + adapter +
  renderer) med representativ data. Används av scripts/shot-v11-rail-block2.mjs.

  Öppna direkt i webbläsare för manuell inspektion, eller kör:
    npm run shots:v11rail:block2
-->
<html lang="sv" data-v9-enabled="on" data-v11-rail="on">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>V11 Rail · Block 2 · A Profile + B Smart information</title>
    <link rel="stylesheet" href="../../../public/major-arcana-preview/cco-v11-rail.css" />
    <style>
      body {
        margin: 0;
        background: #efe7df;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      .v11-rail {
        width: 100%;
        max-width: 100%;
        margin: 0 auto;
      }
      @media (min-width: 1024px) {
        .v11-rail {
          max-width: 424px;
        }
      }
    </style>
  </head>
  <body>
    <section class="patient-master-card v11-rail" data-v11-rail-shell="1">
      <div class="v11-rail__scroll" id="mount" aria-label="Kunddossiér (V11 Rail)"></div>
    </section>

    <script src="../../../public/major-arcana-preview/app/cco-kunder-smart-next-step.js"></script>
    <script src="../../../public/major-arcana-preview/app/cco-v11-rail-adapters.js"></script>
    <script src="../../../public/major-arcana-preview/app/cco-v11-rail.js"></script>
    <script>
      var bcard = {
        displayName: 'Anna Karlsson',
        primaryPhone: '070-123 45 67',
        primaryEmail: 'anna.karlsson@example.se',
        vip: true,
        treatmentTypes: ['PRP-hår', 'Botox'],
        contact: { address: { street: 'Storgatan 1', zip: '111 22', city: 'Stockholm' } },
      };
      var card = {
        automationSignals: [
          {
            status: 'active',
            risk: 'review',
            priority: 90,
            what: 'Skicka offert för signering',
            why: 'Offert skapad efter konsultation, väntar på utskick.',
            next: 'Granska utkast och skicka för e-signering.',
            humanApprovalRequired: true,
            confidence: 'hög',
          },
          { status: 'active', risk: 'info', priority: 40, what: 'Boka uppföljning' },
        ],
      };
      document.getElementById('mount').innerHTML = window.CcoV11Rail.render({
        bcard: bcard,
        card: card,
      });
      document.documentElement.setAttribute('data-v11-rail-ready', '1');
    </script>
  </body>
</html>
