<!doctype html>
<!--
  V12 Customer Workspace · Block 4 — Bokningar-modul (kommande + historik) i två-zon-shell.
  Renderar de RIKTIGA komponenterna (cco-v11-rail + cco-v12-workspace). Återanvänder
  V11-adaptrarna buildBookingsFromExtras/buildHistoryFromExtras + befintlig confirm-handler.
  Används av scripts/shot-v12-workspace-bookings.mjs. Öppna i webbläsare, eller kör:
  npm run shots:v12workspace:bookings
-->
<html lang="sv" data-v9-enabled="on" data-v11-rail="on" data-v12-workspace="on">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>V12 Customer Workspace · Bokningar</title>
    <link rel="stylesheet" href="../../../public/major-arcana-preview/cco-v11-rail.css" />
    <link rel="stylesheet" href="../../../public/major-arcana-preview/cco-v12-workspace.css" />
    <style>
      body {
        margin: 0;
        padding: 12px;
        background: #efe7df;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
    </style>
  </head>
  <body>
    <section class="patient-master-card v12-workspace" data-v12-workspace-shell="1">
      <div id="mount"></div>
    </section>

    <script src="../../../public/major-arcana-preview/app/cco-kunder-smart-next-step.js"></script>
    <script>
      window.CcoKundkortKkx = {
        buildCanonicalJourneyLive: function () {
          return { activeStep: 5, nextLabel: 'Offert + behandlingsplan', steps: [] };
        },
        resolveReferensBookingExtras: function (card) {
          var up = (card && card.upcomingBookings) || [];
          var hist = (card && card.bookingHistory) || [];
          return {
            upcomingBookings: up,
            upcomingBookingCount: up.length,
            historyBookings: hist,
            historyBookingCount: hist.length,
          };
        },
      };
    </script>
    <script src="../../../public/major-arcana-preview/app/cco-v11-rail-adapters.js"></script>
    <script src="../../../public/major-arcana-preview/app/cco-v11-rail.js"></script>
    <script src="../../../public/major-arcana-preview/app/cco-v12-workspace-adapters.js"></script>
    <script src="../../../public/major-arcana-preview/app/cco-v12-workspace.js"></script>
    <script>
      var bcard = {
        patientId: 'p-1001',
        displayName: 'Anna Karlsson',
        primaryPhone: '070-123 45 67',
        primaryEmail: 'anna.karlsson@example.se',
        vip: true,
        treatmentTypes: ['PRP-hår', 'Botox'],
        contact: { address: { street: 'Storgatan 1', zip: '111 22', city: 'Stockholm' } },
        visits: 7,
        lifetimeValue: 48000,
        healthDeclaration: { signedAt: '2026-05-10', source: 'halso@m365' },
      };
      var card = Object.assign({}, bcard, {
        readyForTreatment: true,
        upcomingBookings: [
          {
            iso: '2026-06-25T09:30:00Z',
            title: 'PRP-behandling',
            sub: 'Hårbotten · Fazli',
            state: 'ready',
            stateLabel: '✓ Redo',
          },
          {
            iso: '2026-07-09T13:00:00Z',
            title: 'Uppföljning',
            sub: 'PRP-hår · Egzona',
            state: 'planned',
            stateLabel: 'Planerad',
          },
        ],
        bookingHistory: [
          {
            iso: '2026-05-12T10:00:00Z',
            title: 'PRP-behandling',
            sub: 'Hårbotten · Fazli',
            state: 'done',
            stateLabel: 'Klar',
          },
          {
            iso: '2026-04-02T13:30:00Z',
            title: 'Konsultation',
            sub: 'PRP-hår · Egzona',
            state: 'done',
            stateLabel: 'Klar',
          },
        ],
      });
      var journalEntries = [
        {
          title: 'Konsultation',
          journalType: 'consult',
          note: 'Inledande konsultation.',
          authorName: 'Dr. Lind',
          updatedAt: '2026-06-18T09:15:00Z',
        },
      ];

      var railInner =
        (window.CcoV11Rail &&
          window.CcoV11Rail.render({
            bcard: bcard,
            card: card,
            journalEntries: journalEntries,
            dossierBundle: null,
          })) ||
        '';
      var wsInner =
        (window.CcoV12Workspace &&
          window.CcoV12Workspace.render({
            card: card,
            bcard: bcard,
            journalEntries: journalEntries,
            dossierBundle: null,
          })) ||
        '';

      document.getElementById('mount').innerHTML =
        '<div class="v12-workspace__zones">' +
        '<div class="v12-workspace__zone1"><div class="v11-rail"><div class="v11-rail__scroll">' +
        railInner +
        '</div></div></div>' +
        '<div class="v12-workspace__zone2">' +
        wsInner +
        '</div></div>';
    </script>
  </body>
</html>
