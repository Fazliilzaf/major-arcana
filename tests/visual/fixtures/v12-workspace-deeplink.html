<!doctype html>
<!--
  V12 Customer Workspace · GAP-1 — V11/V9 deep-link → V12-sektion-scroll.
  Renderar de RIKTIGA komponenterna (cco-v11-rail i Zon 1 + cco-v12-workspace i Zon 2)
  i shell med data-patient-detail, och wire:ar de RIKTIGA [data-v9-section-link]-
  deep-links till den RIKTIGA exporterade CcoV9CustomersParity.scrollDossierSection
  (samma V12-guard som den riktiga bindV9-handlern). Klick på en rail-deep-link
  scrollar till motsvarande V12-modul (data-v12-module) + flashar den (is-nav-target).
  Används av scripts/shot-v12-workspace-deeplink.mjs.
-->
<html lang="sv" data-v9-enabled="on" data-v11-rail="on" data-v12-workspace="on">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>V12 Customer Workspace · Deep-link → V12-sektion</title>
    <link rel="stylesheet" href="../../../public/major-arcana-preview/cco-v11-rail.css" />
    <link rel="stylesheet" href="../../../public/major-arcana-preview/cco-v12-workspace.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: #efe7df;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      /* Panelen är scroll-container (som slide-over/detaljpanelen i appen) så att
         scrollIntoView för V12-sektioner har en scrollbar förälder. */
      #panel {
        height: 100vh;
        overflow: auto;
        padding: 12px;
        box-sizing: border-box;
      }
      /* Tydlig flash på navigations-target (motsvarar appens .is-nav-target). */
      .is-nav-target {
        outline: 3px solid var(--v12-amber, #c8821e);
        outline-offset: 2px;
        border-radius: 12px;
      }
    </style>
  </head>
  <body>
    <div id="panel">
      <section
        class="patient-master-card v12-workspace"
        data-patient-detail
        data-v12-workspace-shell="1"
      >
        <div id="mount"></div>
      </section>
    </div>

    <script src="../../../public/major-arcana-preview/app/cco-kunder-smart-next-step.js"></script>
    <script>
      window.CcoKundkortKkx = {
        buildCanonicalJourneyLive: function () {
          return { activeStep: 4, nextLabel: 'Offert', steps: [] };
        },
        resolveReferensBookingExtras: function (card) {
          var up = (card && card.upcomingBookings) || [];
          var hist = (card && card.bookingHistory) || [];
          return {
            upcomingBookings: up,
            upcomingBookingCount: up.length,
            historyBookings: hist,
            historyBookingCount: hist.length,
          };
        },
      };
    </script>
    <script src="../../../public/major-arcana-preview/app/cco-v11-rail-adapters.js"></script>
    <script src="../../../public/major-arcana-preview/app/cco-v11-rail.js"></script>
    <script src="../../../public/major-arcana-preview/app/cco-v12-workspace-adapters.js"></script>
    <script src="../../../public/major-arcana-preview/app/cco-v12-workspace.js"></script>
    <script src="../../../public/major-arcana-preview/app/cco-v9-customers-parity.js"></script>
    <script>
      var bcard = {
        patientId: 'p-1001',
        displayName: 'Anna Karlsson',
        primaryPhone: '070-123 45 67',
        primaryEmail: 'anna.karlsson@example.se',
        vip: true,
        treatmentTypes: ['PRP-hår', 'Botox'],
        visits: 7,
        upcomingBookings: [{ start: '2026-07-01T10:00:00Z', title: 'PRP-hår', staff: 'Dr. Lind' }],
        bookingHistory: [
          { start: '2026-05-10T10:00:00Z', title: 'Konsultation', staff: 'Dr. Lind' },
        ],
      };
      var card = Object.assign({}, bcard, { readyForTreatment: true });
      var journalEntries = [
        {
          title: 'Konsultation',
          journalType: 'consult',
          note: 'Inledande konsultation.',
          authorName: 'Dr. Lind',
          updatedAt: '2026-06-18T09:15:00Z',
        },
      ];
      var ctx = { card: card, bcard: bcard, journalEntries: journalEntries, dossierBundle: null };

      var railInner = (window.CcoV11Rail && window.CcoV11Rail.render(ctx)) || '';
      var wsInner = (window.CcoV12Workspace && window.CcoV12Workspace.render(ctx)) || '';

      document.getElementById('mount').innerHTML =
        '<div class="v12-workspace__zones" data-v9-dossier-scroll>' +
        '<div class="v12-workspace__zone1"><div class="v11-rail"><div class="v11-rail__scroll">' +
        railInner +
        '</div></div></div>' +
        '<div class="v12-workspace__zone2">' +
        wsInner +
        '</div></div>';

      // Wire:a de RIKTIGA rail-deep-links med EXAKT samma V12-guard som den riktiga
      // bindV9MockupDossierHandlers använder (cco-v9-customers-parity.js).
      document.querySelectorAll('[data-v9-section-link]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var sectionId = btn.getAttribute('data-v9-section-link') || '';
          var detailRoot = btn.closest('[data-patient-detail]');
          if (
            detailRoot &&
            detailRoot.querySelector('[data-v12-module]') &&
            window.CcoV9CustomersParity &&
            window.CcoV9CustomersParity.scrollDossierSection
          ) {
            window.CcoV9CustomersParity.scrollDossierSection(detailRoot, sectionId);
          }
        });
      });

      // Hjälpare för screenshot-scriptet: klicka en rail-deep-link (zon 1) per värde.
      window.__clickRailDeepLink = function (value) {
        var b = document.querySelector(
          '.v12-workspace__zone1 [data-v9-section-link="' + value + '"]'
        );
        if (b) {
          b.click();
          return true;
        }
        return false;
      };
    </script>
  </body>
</html>
