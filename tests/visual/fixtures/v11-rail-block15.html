<!doctype html>
<!--
  V11-RAIL Fas 3 · Block 15 — … + L Auto-documents + M Photos (KEEP) + S.
  Renderar de RIKTIGA komponenterna (cco-v11-rail.css + adapter + renderer).
  Ordning D → A → V → B → C → E → F → G → H → I → J → K → L → M → S. Används av scripts/shot-v11-rail-block15.mjs.

  M listar foton/media från ctx.driveFiles (filtrerade på media). Varje foto är
  en native-länk (target=_blank) med data-photo=<id> — befintlig lightbox-handler
  wire:as om den finns (graceful här), ingen ny handler.

  Öppna direkt i webbläsare, eller kör: npm run shots:v11rail:block15
-->
<html lang="sv" data-v9-enabled="on" data-v11-rail="on">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>V11 Rail · Block 15 · … + M Photos</title>
    <link rel="stylesheet" href="../../../public/major-arcana-preview/cco-v11-rail.css" />
    <style>
      body {
        margin: 0;
        background: #efe7df;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      .v11-rail {
        width: 100%;
        max-width: 100%;
        margin: 0 auto;
      }
      @media (min-width: 1024px) {
        .v11-rail {
          max-width: 424px;
        }
      }
    </style>
  </head>
  <body>
    <section class="patient-master-card v11-rail" data-v11-rail-shell="1">
      <div class="v11-rail__scroll" id="mount" aria-label="Kunddossiér (V11 Rail)"></div>
    </section>

    <script src="../../../public/major-arcana-preview/app/cco-kunder-smart-next-step.js"></script>
    <script>
      // Deterministiska stubbar (journey + booking/history-lagret) för fixturen.
      window.CcoKundkortKkx = {
        buildCanonicalJourneyLive: function () {
          return {
            activeStep: 5,
            nextLabel: 'Offert + behandlingsplan',
            steps: [
              { step: 1, label: 'Bokning konsultation', status: 'done', meta: '' },
              { step: 2, label: 'Bokningsbekräftelse-mail', status: 'done', meta: '' },
              { step: 3, label: 'Hälsodeklaration', status: 'done', meta: 'Signerad' },
              { step: 4, label: 'Konsultation', status: 'done', meta: '' },
              { step: 5, label: 'Offert + behandlingsplan', status: 'active', meta: '' },
              { step: 6, label: 'Betänketid 2 dagar', status: 'future', meta: '' },
              { step: 7, label: 'Avtal + behandlingssamtycke', status: 'future', meta: '' },
              { step: 8, label: 'Friskförsäkran', status: 'future', meta: '' },
              { step: 9, label: 'Foto-samtycke', status: 'future', meta: '' },
            ],
          };
        },
        resolveReferensBookingExtras: function (card) {
          var up = (card && card.upcomingBookings) || [];
          var hist = (card && card.bookingHistory) || [];
          return {
            upcomingBookings: up,
            upcomingBookingCount: up.length,
            historyBookings: hist,
            historyBookingCount: hist.length,
          };
        },
      };
    </script>
    <script src="../../../public/major-arcana-preview/app/cco-v11-rail-adapters.js"></script>
    <script src="../../../public/major-arcana-preview/app/cco-v11-rail.js"></script>
    <script>
      var bcard = {
        patientId: 'p-1001',
        displayName: 'Anna Karlsson',
        primaryPhone: '070-123 45 67',
        primaryEmail: 'anna.karlsson@example.se',
        vip: true,
        treatmentTypes: ['PRP-hår', 'Botox'],
        contact: { address: { street: 'Storgatan 1', zip: '111 22', city: 'Stockholm' } },
        visits: 7,
        lifetimeValue: 48000,
        outstandingBalance: '1 200 kr',
        healthDeclaration: { signedAt: '2026-05-10', source: 'halso@m365' },
        allergies: ['Penicillin', 'Lidokain'],
      };
      var card = Object.assign({}, bcard, {
        readyForTreatment: true,
        upcomingBookings: [
          {
            iso: '2026-06-25T09:30:00Z',
            title: 'PRP-behandling',
            sub: 'Hårbotten · Fazli',
            area: 'Hårbotten',
            state: 'ready',
            stateLabel: '✓ Redo',
          },
        ],
        automationSignals: [
          {
            ruleId: 'customer.missing_agreement_consent_bundle',
            status: 'active',
            what: 'Avtal + samtycke saknas',
            why: 'Steg 7 — samma transaktion.',
            risk: 'legal_blocker',
          },
        ],
      });
      var journalEntries = [
        {
          title: 'PRP-behandling',
          journalType: 'tp_treatment',
          summary: 'Tredje PRP-sessionen. Patienten tolererade behandlingen väl.',
          authorName: 'Dr. Lind',
          signedAt: '2026-05-12T11:30:00Z',
          locked: true,
        },
      ];
      // Riktiga thumbnails som data-URI så screenshots visar laddade bilder.
      function thumb(label, c1, c2) {
        var svg =
          '<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160">' +
          '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
          '<stop offset="0" stop-color="' +
          c1 +
          '"/><stop offset="1" stop-color="' +
          c2 +
          '"/></linearGradient></defs>' +
          '<rect width="160" height="160" fill="url(#g)"/>' +
          '<text x="80" y="88" font-size="18" fill="#fff" text-anchor="middle" ' +
          'font-family="sans-serif" font-weight="700">' +
          label +
          '</text></svg>';
        return 'data:image/svg+xml,' + encodeURIComponent(svg);
      }
      var driveFiles = [
        {
          id: 'f1',
          fileType: 'image',
          viewUrl: thumb('FÖRE', '#7a5a32', '#b9842f'),
          originalFileName: '2026-05-12 · före · hårlinje.jpg',
        },
        {
          id: 'f2',
          fileType: 'image',
          viewUrl: thumb('EFTER', '#3c6b4a', '#6fae74'),
          originalFileName: '2026-05-12 · efter · hårlinje.jpg',
        },
        {
          id: 'f3',
          fileType: 'image',
          viewUrl: thumb('ÖVERSIKT', '#42577a', '#7d9ec9'),
          originalFileName: '2026-04-02 · översikt.png',
        },
        { id: 'f4', mimeType: 'video/mp4', originalFileName: 'PRP-session · film.mp4' },
        { id: 'f5', fileType: 'image', originalFileName: '2026-02-18 · donator.heic' },
        { id: 'd1', fileType: 'journal_pdf', originalFileName: 'Journal.pdf' },
      ];
      var dossierBundle = {
        activeVisit: {
          visible: true,
          state: 'in_progress',
          serviceLabel: 'PRP-behandling',
          practitionerLabel: 'Dr. Lind',
          checkedInAt: '2026-06-21T09:10:00Z',
          startedAt: '2026-06-21T09:25:00Z',
          journalStarted: true,
          blockers: [{ code: 'photo_consent', label: 'Foto-samtycke ej signerat' }],
          photoCaptureAvailable: true,
          notesAvailable: true,
        },
        documents: {
          autoDocs: [
            {
              registryId: 'auto_bekraftelse_mail',
              title: 'Bokningsbekräftelse',
              filler: 'auto',
              status: 'sent',
              journeyStep: 2,
            },
          ],
        },
      };
      document.getElementById('mount').innerHTML = window.CcoV11Rail.render({
        bcard: bcard,
        card: card,
        dossierBundle: dossierBundle,
        journalEntries: journalEntries,
        driveFiles: driveFiles,
      });
      document.documentElement.setAttribute('data-v11-rail-ready', '1');
    </script>
  </body>
</html>
