<!doctype html>
<!--
  V12 Customer Workspace · Block 10 — Dokument-modul i två-zon-shell.
  Renderar de RIKTIGA komponenterna (cco-v11-rail + cco-v12-workspace). Återanvänder
  V11-adaptrarna buildOffersFromPayload + buildAutoDocsFromPayload + buildFilesFromDriveFiles
  (via CcoV9CustomersParity.resolveV11DocumentPayload + driveFiles) + befintliga
  data-v11-doc-*-attribut. Används av scripts/shot-v12-workspace-documents.mjs.
  Öppna i webbläsare, eller kör: npm run shots:v12workspace:documents
-->
<html lang="sv" data-v9-enabled="on" data-v11-rail="on" data-v12-workspace="on">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>V12 Customer Workspace · Dokument</title>
    <link rel="stylesheet" href="../../../public/major-arcana-preview/cco-v11-rail.css" />
    <link rel="stylesheet" href="../../../public/major-arcana-preview/cco-v12-workspace.css" />
    <style>
      body {
        margin: 0;
        padding: 12px;
        background: #efe7df;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
    </style>
  </head>
  <body>
    <section class="patient-master-card v12-workspace" data-v12-workspace-shell="1">
      <div id="mount"></div>
    </section>

    <script src="../../../public/major-arcana-preview/app/cco-kunder-smart-next-step.js"></script>
    <script>
      window.CcoKundkortKkx = {
        buildCanonicalJourneyLive: function () {
          return { activeStep: 4, nextLabel: 'Offert + behandlingsplan', steps: [] };
        },
        resolveReferensBookingExtras: function (card) {
          var up = (card && card.upcomingBookings) || [];
          var hist = (card && card.bookingHistory) || [];
          return {
            upcomingBookings: up,
            upcomingBookingCount: up.length,
            historyBookings: hist,
            historyBookingCount: hist.length,
          };
        },
      };
      // Dokument-payload (samma kontrakt som legacy resolveV11DocumentPayload).
      window.CcoV9CustomersParity = {
        resolveV11DocumentPayload: function () {
          return {
            offers: [
              {
                title: 'Behandlingsplan PRP-hår',
                amount: '18 000 kr',
                status: 'sent',
                registryId: 'offert_prp',
                journeyStep: '4',
              },
              {
                title: 'Offert Botox',
                amount: '4 500 kr',
                status: 'signed',
                registryId: 'offert_botox',
                journeyStep: '4',
              },
            ],
            autoDocs: [
              { title: 'Samtycke PRP', status: 'pending', registryId: 'auto_samtycke_prp' },
              { title: 'Eftervårdsinstruktion', status: 'planned', registryId: 'auto_eftervard' },
            ],
          };
        },
      };
    </script>
    <script src="../../../public/major-arcana-preview/app/cco-v11-rail-adapters.js"></script>
    <script src="../../../public/major-arcana-preview/app/cco-v11-rail.js"></script>
    <script src="../../../public/major-arcana-preview/app/cco-v12-workspace-adapters.js"></script>
    <script src="../../../public/major-arcana-preview/app/cco-v12-workspace.js"></script>
    <script>
      var bcard = {
        patientId: 'p-1001',
        displayName: 'Anna Karlsson',
        primaryPhone: '070-123 45 67',
        primaryEmail: 'anna.karlsson@example.se',
        vip: true,
        treatmentTypes: ['PRP-hår', 'Botox'],
        visits: 7,
        lifetimeValue: 48000,
      };
      var card = Object.assign({}, bcard, { readyForTreatment: true });
      var journalEntries = [
        {
          title: 'Konsultation',
          journalType: 'consult',
          note: 'Inledande konsultation.',
          authorName: 'Dr. Lind',
          updatedAt: '2026-06-18T09:15:00Z',
        },
      ];
      // Dokumentfiler (icke-media) → Filer-underavsnittet.
      var driveFiles = [
        { id: 'f-1', originalFileName: 'Journal-2026-06-18.pdf', fileType: 'journal_pdf' },
        { id: 'f-2', originalFileName: 'Remiss.docx' },
      ];

      var railInner =
        (window.CcoV11Rail &&
          window.CcoV11Rail.render({
            bcard: bcard,
            card: card,
            journalEntries: journalEntries,
            driveFiles: driveFiles,
            dossierBundle: null,
          })) ||
        '';
      var wsInner =
        (window.CcoV12Workspace &&
          window.CcoV12Workspace.render({
            card: card,
            bcard: bcard,
            journalEntries: journalEntries,
            driveFiles: driveFiles,
            dossierBundle: null,
          })) ||
        '';

      document.getElementById('mount').innerHTML =
        '<div class="v12-workspace__zones">' +
        '<div class="v12-workspace__zone1"><div class="v11-rail"><div class="v11-rail__scroll">' +
        railInner +
        '</div></div></div>' +
        '<div class="v12-workspace__zone2">' +
        wsInner +
        '</div></div>';
    </script>
  </body>
</html>
