<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CCO — Vad systemet ska innehålla</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 920px;
      margin: 0 auto;
      padding: 2rem 1.25rem 4rem;
      line-height: 1.55;
    }
    pre {
      white-space: pre-wrap;
      word-wrap: break-word;
      font: inherit;
      margin: 0;
    }
    .meta { opacity: 0.7; font-size: 0.9rem; margin-bottom: 1.5rem; }
  </style>
</head>
<body>
  <p class="meta">Lokal förhandsvisning · <code>docs/strategy/CCO-SYSTEM-SCOPE.md</code></p>
  <pre id="doc">Laddar…</pre>
  <script>
    fetch('./CCO-SYSTEM-SCOPE.md')
      .then((r) => r.text())
      .then((t) => {
        document.getElementById('doc').textContent = t;
        document.title = 'CCO — Vad systemet ska innehålla';
      })
      .catch((e) => {
        document.getElementById('doc').textContent = 'Kunde inte ladda markdown: ' + e;
      });
  </script>
</body>
</html>
