<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1100" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FAF6F1"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3D352E"/>
      <stop offset="100%" stop-color="#231F1D"/>
    </linearGradient>
    <linearGradient id="btnHover" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5A4E45"/>
      <stop offset="100%" stop-color="#3D352E"/>
    </linearGradient>
    <linearGradient id="toastGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F4F4E8"/>
      <stop offset="100%" stop-color="#E8E8D8"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#231F1D" flood-opacity="0.10"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#231F1D" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background canvas -->
  <rect width="1440" height="1100" fill="#F5F0EA"/>

  <!-- Header bar -->
  <rect x="0" y="0" width="1440" height="60" fill="#231F1D"/>
  <text x="32" y="38" font-size="15" font-weight="600" fill="#F5F0EA" letter-spacing="0.5">major-arcana-preview · CCO</text>
  <text x="1300" y="38" font-size="13" fill="#F5F0EA" opacity="0.7">Egzona · hair-tp-clinic</text>

  <!-- Page title -->
  <text x="32" y="110" font-size="14" fill="#231F1D" opacity="0.55" letter-spacing="1.5">CASE</text>
  <text x="32" y="142" font-size="28" font-weight="300" fill="#231F1D">Morten Bak Kristoffersen</text>
  <rect x="32" y="160" width="180" height="26" rx="13" fill="#646E46"/>
  <text x="48" y="178" font-size="11" font-weight="600" fill="#FFFFFF" letter-spacing="0.8">FÖLJER UPP · 11 MÅN</text>

  <!-- Three-column layout -->
  <!-- Left: case info -->
  <g filter="url(#cardShadow)">
    <rect x="32" y="220" width="420" height="780" rx="16" fill="url(#cardGrad)"/>
  </g>
  <text x="56" y="258" font-size="12" font-weight="600" fill="#231F1D" opacity="0.55" letter-spacing="1">ÄRENDE</text>
  <text x="56" y="290" font-size="14" fill="#231F1D" opacity="0.5">Behandling</text>
  <text x="56" y="312" font-size="15" font-weight="500" fill="#231F1D">FUE · 3 200 grafter</text>

  <text x="56" y="356" font-size="14" fill="#231F1D" opacity="0.5">Operation</text>
  <text x="56" y="378" font-size="15" font-weight="500" fill="#231F1D">2025-06-14</text>

  <text x="56" y="422" font-size="14" fill="#231F1D" opacity="0.5">Operatör</text>
  <text x="56" y="444" font-size="15" font-weight="500" fill="#231F1D">Egzona Krasniqi</text>

  <text x="56" y="488" font-size="14" fill="#231F1D" opacity="0.5">Konversation</text>
  <text x="56" y="510" font-size="13" fill="#231F1D" font-family="Menlo, monospace">demo-mb-001</text>

  <text x="56" y="560" font-size="12" font-weight="600" fill="#231F1D" opacity="0.55" letter-spacing="1">UPPFÖLJNINGAR</text>
  <line x1="56" y1="580" x2="428" y2="580" stroke="#231F1D" stroke-opacity="0.08"/>

  <circle cx="68" cy="615" r="5" fill="#646E46"/>
  <text x="86" y="619" font-size="13" fill="#231F1D">1 vecka · klar 2025-06-21</text>
  <circle cx="68" cy="650" r="5" fill="#646E46"/>
  <text x="86" y="654" font-size="13" fill="#231F1D">1 mån · klar 2025-07-14</text>
  <circle cx="68" cy="685" r="5" fill="#646E46"/>
  <text x="86" y="689" font-size="13" fill="#231F1D">3 mån · klar 2025-09-14</text>
  <circle cx="68" cy="720" r="5" fill="#646E46"/>
  <text x="86" y="724" font-size="13" fill="#231F1D">6 mån · klar 2025-12-14</text>
  <circle cx="68" cy="755" r="6.5" fill="#FFFFFF" stroke="#D2A06E" stroke-width="2.5"/>
  <text x="86" y="759" font-size="13" font-weight="600" fill="#231F1D">12 mån · idag 2026-05-18</text>
  <text x="86" y="778" font-size="11" fill="#231F1D" opacity="0.55">Sista uppföljningen i protokollet</text>

  <!-- Middle: photos -->
  <g filter="url(#cardShadow)">
    <rect x="476" y="220" width="460" height="500" rx="16" fill="url(#cardGrad)"/>
  </g>
  <text x="500" y="258" font-size="12" font-weight="600" fill="#231F1D" opacity="0.55" letter-spacing="1">FÖRE / SENASTE</text>
  <rect x="500" y="280" width="200" height="200" rx="8" fill="#E8E0D6"/>
  <text x="600" y="384" font-size="12" fill="#231F1D" opacity="0.5" text-anchor="middle">Före — 2025-06-14</text>
  <rect x="712" y="280" width="200" height="200" rx="8" fill="#E8E0D6"/>
  <text x="812" y="384" font-size="12" fill="#231F1D" opacity="0.5" text-anchor="middle">6 mån — 2025-12-14</text>

  <text x="500" y="528" font-size="12" font-weight="600" fill="#231F1D" opacity="0.55" letter-spacing="1">EFTER-BILDER 12 MÅN</text>
  <rect x="500" y="548" width="412" height="140" rx="8" fill="#FAEDE2" stroke="#D2A06E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="706" y="610" font-size="14" fill="#826E5A" text-anchor="middle" font-style="italic">Inga bilder ännu</text>
  <text x="706" y="632" font-size="12" fill="#826E5A" text-anchor="middle">Klicka "Markera klar" → patienten får länk att ladda upp</text>

  <!-- Right column: ACTION PANEL — THE NEW BUTTON -->
  <g filter="url(#cardShadow)">
    <rect x="960" y="220" width="448" height="780" rx="16" fill="url(#cardGrad)"/>
  </g>
  <text x="984" y="258" font-size="12" font-weight="600" fill="#231F1D" opacity="0.55" letter-spacing="1">ÅTGÄRDER</text>

  <!-- Standard actions (unchanged) -->
  <rect x="984" y="290" width="400" height="56" rx="10" fill="#FFFFFF" stroke="#231F1D" stroke-opacity="0.12"/>
  <text x="1010" y="324" font-size="14" fill="#231F1D">Boka nästa möte</text>
  <text x="1356" y="324" font-size="16" fill="#231F1D" opacity="0.4" text-anchor="end">→</text>

  <rect x="984" y="362" width="400" height="56" rx="10" fill="#FFFFFF" stroke="#231F1D" stroke-opacity="0.12"/>
  <text x="1010" y="396" font-size="14" fill="#231F1D">Skicka påminnelse</text>
  <text x="1356" y="396" font-size="16" fill="#231F1D" opacity="0.4" text-anchor="end">→</text>

  <rect x="984" y="434" width="400" height="56" rx="10" fill="#FFFFFF" stroke="#231F1D" stroke-opacity="0.12"/>
  <text x="1010" y="468" font-size="14" fill="#231F1D">Lägg till anteckning</text>
  <text x="1356" y="468" font-size="16" fill="#231F1D" opacity="0.4" text-anchor="end">→</text>

  <!-- Divider -->
  <line x1="984" y1="530" x2="1384" y2="530" stroke="#231F1D" stroke-opacity="0.08"/>

  <!-- NEW: Sista uppföljning section -->
  <text x="984" y="568" font-size="12" font-weight="600" fill="#826E5A" letter-spacing="1">NY · POST-OP REVIEW FLOW</text>

  <text x="984" y="600" font-size="13" fill="#231F1D" opacity="0.7">Detta är 12-månadersbesöket — sista i</text>
  <text x="984" y="618" font-size="13" fill="#231F1D" opacity="0.7">protokollet. När du klickar nedan:</text>

  <circle cx="996" cy="650" r="3" fill="#646E46"/>
  <text x="1012" y="654" font-size="13" fill="#231F1D">Status sätts till <tspan font-family="Menlo, monospace" font-size="12">follow_up_completed</tspan></text>

  <circle cx="996" cy="678" r="3" fill="#646E46"/>
  <text x="1012" y="682" font-size="13" fill="#231F1D">Capability via gateway → e-postdraft</text>

  <circle cx="996" cy="706" r="3" fill="#646E46"/>
  <text x="1012" y="710" font-size="13" fill="#231F1D">Du granskar + skickar (eller schemalägger)</text>

  <circle cx="996" cy="734" r="3" fill="#646E46"/>
  <text x="1012" y="738" font-size="13" fill="#231F1D">Patienten får länk att ladda upp efter-bilder</text>

  <!-- The new button -->
  <g filter="url(#cardShadow)">
    <rect x="984" y="770" width="400" height="64" rx="12" fill="url(#btnGrad)"/>
  </g>
  <text x="1184" y="809" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">Markera sista uppföljning klar →</text>

  <!-- Helper -->
  <text x="1184" y="858" font-size="11" fill="#231F1D" opacity="0.5" text-anchor="middle">Patient: contact@hairtpclinic.com · M365 Graph · audit-loggad</text>

  <!-- States footer (3 states preview) -->
  <text x="32" y="1042" font-size="11" font-weight="600" fill="#231F1D" opacity="0.55" letter-spacing="1.5">KNAPP-VARIANTER</text>

  <!-- Default -->
  <rect x="32" y="1056" width="220" height="36" rx="8" fill="url(#btnGrad)"/>
  <text x="142" y="1080" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Markera klar →</text>
  <text x="142" y="1098" font-size="10" fill="#231F1D" opacity="0.55" text-anchor="middle">default</text>

  <!-- Hover -->
  <rect x="276" y="1056" width="220" height="36" rx="8" fill="url(#btnHover)"/>
  <text x="386" y="1080" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Markera klar →</text>
  <text x="386" y="1098" font-size="10" fill="#231F1D" opacity="0.55" text-anchor="middle">hover</text>

  <!-- After click - toast -->
  <rect x="520" y="1056" width="320" height="36" rx="8" fill="url(#toastGrad)" stroke="#646E46" stroke-width="1.5"/>
  <circle cx="540" cy="1074" r="7" fill="#646E46"/>
  <path d="M 537 1074 L 540 1077 L 545 1071" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="556" y="1080" font-size="12" font-weight="600" fill="#231F1D">Uppföljning markerad — draft i gateway-kön</text>
  <text x="680" y="1098" font-size="10" fill="#231F1D" opacity="0.55" text-anchor="middle">after click (toast 4s)</text>

  <!-- Title at bottom -->
  <text x="1408" y="1080" font-size="10" fill="#231F1D" opacity="0.5" text-anchor="end" font-family="Menlo, monospace">cco-mark-followup-completed-button.svg</text>
  <text x="1408" y="1095" font-size="10" fill="#231F1D" opacity="0.4" text-anchor="end">DXM mock 2026-05-18 · Hair TP Clinic</text>
</svg>
