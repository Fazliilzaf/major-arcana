<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Developer Handover - Major Arcana</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f7f7f8;
        color: #111;
      }
      .container {
        max-width: 980px;
        margin: 24px auto;
        padding: 24px;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 2px 18px rgba(0, 0, 0, 0.08);
      }
      h1, h2, h3 {
        line-height: 1.25;
      }
      code, pre {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, "Courier New", monospace;
      }
      pre {
        padding: 12px;
        background: #f1f3f5;
        border-radius: 8px;
        overflow-x: auto;
      }
      .note {
        margin-bottom: 12px;
        color: #555;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <div class="note">Renderar innehållet från <code>developer-handover-complete.md</code>.</div>
      <article id="content">Laddar dokument...</article>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
      (async function render() {
        const contentEl = document.getElementById("content");
        try {
          const response = await fetch("./developer-handover-complete.md", { cache: "no-store" });
          if (!response.ok) throw new Error("Kunde inte läsa markdown-filen.");
          const markdown = await response.text();
          contentEl.innerHTML = marked.parse(markdown);
        } catch (error) {
          contentEl.textContent = "Fel vid rendering av dokumentet: " + (error && error.message ? error.message : String(error));
        }
      })();
    </script>
  </body>
</html>
